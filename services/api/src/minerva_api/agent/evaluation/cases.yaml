- id: dimensional-missing
  category: physics
  prompt: 'I know a mass m in kg and want an energy E in joules. Can I get E from m using units alone?'
  expected_tool: dimensional_analysis
  reply_matches: 'missing|velocity|speed|m/s|c\b|constant'
  expect_card: {status: ok}
  reference:
    tool: dimensional_analysis
    arguments:
      quantities: [{name: m, unit: kg}, {name: W, unit: J}]
