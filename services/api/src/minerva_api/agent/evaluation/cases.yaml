# ----------------------------------------------------------------------------- point sources (3D delta)
- id: distributional-coulomb-divergence
  category: physics
  prompt: 'Find the divergence of the field $\mathbf{F}=\mathbf{r}/r^3$ in three dimensions, including what happens at the origin.'
  expected_tool: vector_calculus
  args: {equals: {action: distributional}}
  expect_card: {status: ok}
  reference:
    tool: vector_calculus
    arguments:
      action: distributional
      expression: '\nabla\cdot\left(\frac{\mathbf{r}}{r^{3}}\right)'
      coordinates: spherical
  reply_matches: '4 ?\\pi|4 ?π'
  reply_forbids: 'is (identically )?zero everywhere|\\delta\^\{?\(?3\)?\}?\(\\mathbf\{?r\}?\)\s*=\s*0'
  wrong_formulas:
    - '\nabla\cdot\frac{\mathbf r}{r^3}=\delta^{(3)}(\mathbf r)'
    - '\nabla\cdot\frac{\mathbf r}{r^3}=-4\pi\delta^{(3)}(\mathbf r)'
  source: "Griffiths, Introduction to Electrodynamics, chapter 1 (div of r-hat over r squared is 4 pi delta); the coefficient and the source come from the engine, never from the model"

- id: distributional-laplacian-one-over-r
  category: physics
  prompt: 'Derive the distributional Laplacian of $1/r$ in three dimensions.'
  expected_tool: vector_calculus
  args: {equals: {action: distributional}}
  expect_card: {status: ok}
  reference:
    tool: vector_calculus
    arguments:
      action: distributional
      expression: '\nabla^{2}\frac{1}{r}'
      coordinates: spherical
  reply_matches: '-\s*4 ?\\pi|−\s*4 ?π|minus four'
  wrong_formulas:
    - '\nabla^2\frac1r=4\pi\delta^{(3)}(\mathbf r)'
  source: "Jackson, Classical Electrodynamics, chapter 1 (the Laplacian of 1/r is -4 pi delta); the sign is the engine's"

- id: distributional-translated-source
  category: physics
  prompt: 'A point source sits at a real point $\mathbf{a}=(a_1,a_2,a_3)$. What is the distributional divergence of $\frac{\mathbf{r}-\mathbf{a}}{|\mathbf{r}-\mathbf{a}|^{3}}$?'
  expected_tool: vector_calculus
  args: {equals: {action: distributional}}
  expect_card: {status: ok}
  reference:
    tool: vector_calculus
    arguments:
      action: distributional
      expression: '\nabla\cdot F'
      coordinates: cartesian
      fields:
        - name: F
          kind: vector
          components:
            - '(x - a_1)/((x - a_1)**2 + (y - a_2)**2 + (z - a_3)**2)**(3/2)'
            - '(y - a_2)/((x - a_1)**2 + (y - a_2)**2 + (z - a_3)**2)**(3/2)'
            - '(z - a_3)/((x - a_1)**2 + (y - a_2)**2 + (z - a_3)**2)**(3/2)'
      constants: [a_1, a_2, a_3]
      assumptions: {a_1: [real], a_2: [real], a_3: [real]}
  reply_matches: '4 ?\\pi|4 ?π'
  source: "translation of a point source (Griffiths, chapter 1): the delta moves with the field, the coefficient is unchanged"

- id: distributional-point-charge-gauss
  category: physics
  prompt: 'A point charge $q$ sits at the origin. Show that the differential form of Gauss law holds for its field $\mathbf{E}=\frac{q}{4\pi\epsilon_0}\frac{\hat{r}}{r^2}$, including the charge density at the origin.'
  expected_tool: vector_calculus
  args: {equals: {action: distributional}}
  expect_card: {status: ok}
  reference:
    tool: vector_calculus
    arguments:
      action: distributional
      expression: '\nabla\cdot\left(\frac{q}{4\pi\epsilon_0}\frac{\mathbf{r}}{r^{3}}\right)'
      coordinates: spherical
      constants: [q, epsilon_0]
      assumptions: {epsilon_0: [positive]}
  reply_matches: 'epsilon_0|\\epsilon|ε'
  source: "Griffiths, Introduction to Electrodynamics, chapter 2 (the divergence of E for a point charge is rho/epsilon_0 with rho = q delta)"

- id: distributional-classical-versus-distributional
  category: physics
  prompt: 'Why is the divergence of $\mathbf{r}/r^3$ zero everywhere away from the origin, yet its flux through every sphere about the origin is $4\pi$?'
  expected_tool: vector_calculus
  args: {equals: {action: distributional}}
  expect_card: {status: ok}
  reference:
    tool: vector_calculus
    arguments:
      action: distributional
      expression: '\nabla\cdot\left(\frac{\mathbf{r}}{r^{3}}\right)'
      coordinates: spherical
  reply_matches: '(?i)distribution|delta'
  reply_forbids: '(?i)\bproved\b|rigorously proved'
  source: "the classical divergence vanishes away from the source and the flux 4 pi is carried by the delta at the origin (Griffiths, chapter 1)"

- id: distributional-wrong-normalisation-is-rejected
  category: false_claim
  prompt: 'Is it true that $\nabla\cdot(\mathbf{r}/r^3)=\delta^{(3)}(\mathbf{r})$?'
  expected_tool: vector_calculus
  args: {equals: {action: distributional}, present: [target]}
  expect_card: {status: ok}
  reference:
    tool: vector_calculus
    arguments:
      action: distributional
      expression: '\nabla\cdot\left(\frac{\mathbf{r}}{r^{3}}\right)'
      coordinates: spherical
      target: '\delta^{(3)}(\mathbf r)'
  reply_matches: '(?is)not|incorrect|wrong|does not hold|fails|differs'
  reply_forbids: '(?i)(is|statement is) (true|correct)\b'
  wrong_formulas:
    - '\nabla\cdot\frac{\mathbf r}{r^3}=\delta^{(3)}(\mathbf r)'
  source: "the coefficient is 4 pi: a delta with coefficient 1 is a false identity (Griffiths, chapter 1); the engine compares the statement exactly"

- id: distributional-unsupported-field-is-refused
  category: unsupported
  prompt: 'Find the distributional divergence of $\mathbf{r}/r^4$ in three dimensions.'
  expected_tool: vector_calculus
  args: {equals: {action: distributional}}
  expect_card: {status: unsupported}
  reference:
    tool: vector_calculus
    arguments:
      action: distributional
      expression: '\nabla\cdot F'
      coordinates: cartesian
      fields:
        - name: F
          kind: vector
          components:
            - 'x/(x**2 + y**2 + z**2)**2'
            - 'y/(x**2 + y**2 + z**2)**2'
            - 'z/(x**2 + y**2 + z**2)**2'
  reply_matches: '(?i)not supported|unsupported|cannot|only (the )?coulomb|not of that form|not a point source|not zero'
  reply_forbids: '4 ?\\pi ?\\delta'
  source: "r/r^4 has a nonzero divergence away from the origin: it is not a point-source Coulomb kernel, so the tool refuses and no delta is invented"

- id: distributional-follow-up-asks-for-the-verification
  category: followup
  prompt: 'How was that verified? Is it a proof?'
  history:
    - {role: user, content: 'Find the divergence of $\mathbf{r}/r^3$ in three dimensions, including the origin.'}
    - role: assistant
      content: ''
      tool_calls:
        - id: call_distributional_1
          name: vector_calculus
          arguments:
            action: distributional
            expression: '\nabla\cdot\left(\frac{\mathbf{r}}{r^{3}}\right)'
            coordinates: spherical
    - role: tool
      tool_call_id: call_distributional_1
      name: vector_calculus
      content: 'status=ok; coordinates=spherical; result=$4 \pi \delta^{(3)}\left(\mathbf{r}\right)$; equal as distributions, not pointwise. proof status: derived (this is NOT called proved); independent pairings with test functions: 4/4 agree (values at the source differ, including 0); flux through 2 spheres agrees. These are supporting evidence, not a proof: say so.'
    - {role: assistant, content: 'The divergence is zero away from the origin and equals $4\pi\delta^{(3)}(\mathbf r)$ as a distribution.'}
  expected_tool: none
  reply_matches: '(?is)derived|shrinking|sphere|pairing|test function'
  reply_forbids: '(?i)\bit is proved\b|rigorous(ly)? proof|mathematically proved'
  source: "the tool result states the proof status (derived, not proved) and that the pairings are supporting evidence; the answer must say so"

# ----------------------------------------------------------------------------- homepage examples
# The exact prompts of the example cards on the chat home page (packages/ui/fixtures/homepage-examples.json). A card is
# shown only when its case passes here AND five live runs on the deployed model were all correct and engine-backed
# (docs/benchmarks/homepage-live.json). The expected results are the textbook values, never what a model produced.
- id: homepage-coulomb-divergence
  category: physics
  prompt: "Consider the vector field F = r/r³ in three-dimensional space. Its classical divergence vanishes everywhere away from the origin, yet its flux through an enclosing sphere is 4π. Derive its distributional divergence and explain the apparent contradiction. Show the mathematical verification."
  expected_tool: vector_calculus
  max_calls: 3
  max_reply_words: 450
  args: { equals: { action: distributional } }
  expect_card: { status: ok }
  reference:
    tool: vector_calculus
    arguments:
      action: distributional
      expression: '\nabla\cdot\left(\frac{\mathbf{r}}{r^{3}}\right)'
      coordinates: spherical
  reply_matches: '(?is)(?=.*(4 ?\\pi|4 ?π))(?=.*(distribution|delta|δ))'
  reply_forbids: '(?i)(?<!not )(?<!never )\bproved\b|rigorous(ly)? proof|is (identically )?zero everywhere'
  wrong_formulas:
    - '\nabla\cdot\frac{\mathbf r}{r^3}=\delta^{(3)}(\mathbf r)'
    - '\nabla\cdot\frac{\mathbf r}{r^3}=-4\pi\delta^{(3)}(\mathbf r)'
  source: "Griffiths, Introduction to Electrodynamics, chapter 1: div(r-hat/r^2) = 4 pi delta^(3)(r); the engine derives the coefficient and the source, and says classical and distributional apart"

- id: homepage-delta-two-roots
  category: calculus
  prompt: "Evaluate the integral of x² DiracDelta(x²−4) over the entire real line. Explain how both roots contribute and verify the result."
  expected_tool: distribution
  max_calls: 3
  args: { equals: { action: integrate }, assumes: { x: real } }
  expect_card: { status: ok, result_text: "2" }
  reference:
    tool: distribution
    arguments:
      {
        latex: 'x^2\operatorname{DiracDelta}(x^2-4)',
        action: integrate,
        variable: x,
        lower: '-\infty',
        upper: '\infty',
        assumptions: { x: [real] },
      }
  reply_matches: '(?is)(?=.*(root|\\pm|±|both))(?=.*\b2\b)'
  reply_forbids: '(?i)(?<!not )(?<!never )\bproved\b|rigorous(ly)? proof'
  source: "delta(g(x)) = sum delta(x - x_i)/|g'(x_i)| over the simple roots x_i = -2, 2 with |g'| = 4: the integral is (4 + 4)/4 = 2"

- id: homepage-stokes-curved-surface
  category: calculus
  prompt: "Verify Stokes' theorem for F = (−yz, xz, xy) on the surface r(u,v) = (u,v,uv), where 0 ≤ u,v ≤ 1. Orient the surface by ∂r/∂u × ∂r/∂v and use the induced boundary orientation. Calculate both integrals independently."
  expected_tool: vector_calculus
  max_calls: 3
  args: { equals: { action: integrate, integral: stokes_theorem } }
  expect_card: { status: ok }
  reference:
    tool: vector_calculus
    arguments:
      action: integrate
      integral: stokes_theorem
      expression: "F"
      coordinates: cartesian
      fields: [{ name: F, kind: vector, components: ["-y*z", "x*z", "x*y"] }]
      surface:
        q: ["u", "v", "u*v"]
        u: { name: u, lower: "0", upper: "1" }
        v: { name: v, lower: "0", upper: "1" }
  reply_matches: '(?is)(?=.*= ?1(?!\d))(?=.*(circulation|line integral|boundary))(?=.*(flux|surface integral|curl))'
  reply_forbids: '(?i)(?<!not )(?<!never )\bproved\b|rigorous(ly)? proof'
  source: "curl F = (0, -2y, 2z); the normal d_u r x d_v r = (-v, -u, 1) gives the flux density 4uv, whose integral over the unit square is 1, and so is the circulation around the boundary (hand computation; engine benchmark int-stokes-surface, Marsden and Tromba)"

- id: homepage-heaviside-derivative
  category: calculus
  prompt: "For real t and positive gamma, calculate the distributional derivative of exp(−gamma*t) Heaviside(t). Explain why a Dirac delta appears at t=0 and verify the result."
  expected_tool: distribution
  max_calls: 3
  args:
    { equals: { action: differentiate }, assumes: { t: real, gamma: positive } }
  expect_card: { status: ok }
  reference:
    tool: distribution
    arguments:
      {
        latex: '\exp(-\gamma t)\operatorname{Heaviside}(t)',
        action: differentiate,
        variable: t,
        assumptions: { gamma: [positive], t: [real] },
      }
  reply_matches: "(?is)(?=.*(jump|discontinu))(?=.*(delta|δ))"
  reply_forbids: '(?i)(?<!not )(?<!never )\bproved\b|rigorous(ly)? proof'
  source: "d/dt [f(t) H(t)] = f'(t) H(t) + f(0) delta(t) (DLMF 1.16(ii)): f = exp(-gamma t) gives delta(t) - gamma exp(-gamma t) H(t)"

- id: homepage-kepler-hidden-symmetries
  category: physics
  prompt: "Find the conserved quantities of the Kepler system defined by L = m/2*(r_dot² + r²*theta_dot²) + k/r, with coordinates r and theta. Search for hidden conserved quantities beyond energy and angular momentum. Verify the discovered quantities and determine their functional independence."
  expected_tool: find_conserved_quantities
  max_calls: 3
  args: { includes: { coordinates: [r, theta] } }
  expect_card: { status: ok }
  reference:
    tool: find_conserved_quantities
    arguments:
      lagrangian: '\frac{m}{2}\left(\dot{r}^2 + r^2\dot{\theta}^2\right) + \frac{k}{r}'
      coordinates: [r, theta]
      budget: thorough
  reply_matches: "(?is)(?=.*(runge|lenz))(?=.*independen)"
  reply_forbids: '(?i)no other (conserved )?quantit|the system has no|completely integrable|rigorous(ly)? proof'
  source: "the Kepler problem has the energy, the angular momentum and the two components of the Laplace-Runge-Lenz vector (3 functionally independent of the 4: Goldstein, Classical Mechanics, chapter 3)"

- id: homepage-integral-by-symmetry
  category: calculus
  prompt: "Evaluate the integral of sin(x)^n / (sin(x)^n + cos(x)^n) from 0 to pi/2, for positive real n. Find an elegant symmetry-based approach and verify the result."
  expected_tool: integrate
  max_calls: 3
  args: { assumes: { n: positive } }
  expect_card: { status: ok, result_text: "pi/4" }
  reference:
    tool: integrate
    arguments:
      latex: '\frac{\sin^{n}(x)}{\sin^{n}(x)+\cos^{n}(x)}'
      variable: x
      lower: "0"
      upper: '\frac{\pi}{2}'
      assumptions: { n: [positive], x: [real] }
      strategy: reflection
