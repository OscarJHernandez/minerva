  args: {absent: [commuting]}
  expect_card: {status: ok}
  reference:
    tool: matrix_calculus
    arguments:
      latex: '\exp(A)\exp(B)'
      matrices: [{name: A, entries: [['0', '1'], ['0', '0']]}, {name: B, entries: [['0', '0'], ['1', '0']]}]
