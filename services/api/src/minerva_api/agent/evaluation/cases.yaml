- id: units-check
  category: physics
  prompt: 'Are the units consistent in $W = m v$ if W is in joules, m in kg and v in m/s?'
  expected_tool: check_units
  reply_matches: 'not|inconsist|differ|missing|1/s|s\^?-1'
  expect_card: {status: ok}
  reference:
    tool: check_units
    arguments:
      equation: 'W = m v'
      quantities: [{name: W, unit: J}, {name: m, unit: kg}, {name: v, unit: 'm/s'}]
  source: "dimensional analysis (kg m/s is a momentum, not an energy)"

- id: assumptions-carried
  category: physics
  prompt: 'k and m are positive. Simplify $\sqrt{\frac{k}{m}}\sqrt{\frac{m}{k}}$.'
  expected_tool: simplify
  args: {assumes: {k: positive, m: positive}}
  # With k and m positive the reader already folds the product to 1, so the engine reports "unchanged".
  expect_card: {status: unchanged, result_text: "1"}
  reference:
    tool: simplify
    arguments:
      latex: '\sqrt{\frac{k}{m}}\sqrt{\frac{m}{k}}'
      assumptions: {k: [positive], m: [positive]}
  source: "textbook (product of square roots of positive numbers)"

