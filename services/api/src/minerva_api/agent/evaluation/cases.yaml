  reference:
    tool: integrate_motion
    arguments:
      lagrangian: '\frac12 m\dot{x}^2 - \frac12 k x^2'
      coordinates: [x]
      parameters: {m: 1, k: 4}
      initial_positions: [1]
      initial_velocities: [0]
      t_end: 10
  source: "AGENTS.md (the numbers are the user's) and engine test_motion.py"

- id: motion-values-missing
