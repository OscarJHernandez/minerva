- id: followup-keeps-assumptions
  category: followup
  prompt: 'Now do the same for $\sqrt{x^4}$.'
  history:
    - {role: user, content: 'x is positive. Simplify $\sqrt{x^2}$'}
    - {role: assistant, content: 'With x positive the result is $x$.'}
  expected_tool: simplify
  args: {assumes: {x: positive}}
  # With x positive the reader already folds sqrt(x^4) to x^2, so the engine reports "unchanged".
  expect_card: {status: unchanged, result_text: "x**2"}
  reference: {tool: simplify, arguments: {latex: '\sqrt{x^4}', assumptions: {x: [positive]}}}
  source: "textbook (sqrt(x^4) = x^2 for positive x)"

- id: followup-second-derivative
  category: followup
  prompt: 'Now the second derivative.'
  history:
    - {role: user, content: 'What is the derivative of $x^x$ with respect to x?'}
    - {role: assistant, content: 'It is $x^x(\log x + 1)$.'}
  expected_tool: differentiate
  args: {includes: {variables: [{name: x, order: 2}]}}
  expect_card: {status: ok, result_text: "x**x*((log(x) + 1)**2 + 1/x)"}
  reference: {tool: differentiate, arguments: {latex: 'x^x', variables: [{name: x, order: 2}]}}
  source: "calculus (f'' = f ((ln x + 1)^2 + 1/x) for f = x^x)"

