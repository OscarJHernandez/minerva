  expected_tool: approximation
  args:
    present: [small, order]
  expect_card: {status: ok}
  reference:
    tool: approximation
    arguments:
      latex: '\frac{m c^2}{\sqrt{1-v^2/c^2}}'
      method: perturbation
      small: 'v/c'
      order: 4
      assumptions: {m: [positive], c: [positive], v: [real]}
  source: "engine approx benchmark (hand expansion: mc^2 + m v^2/2 + 3 m v^4/(8 c^2))"

- id: approximation-laurent-residue
