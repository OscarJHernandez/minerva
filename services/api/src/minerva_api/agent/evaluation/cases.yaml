# Benchmark cases for the chat agent (see cases.py for the schema and docs/observability.md for use).
#
# Expected outcomes come from hand-written expectations (engine tests, handbook benchmark) or from
# textbook mathematics, never from what an agent produced. `reference` is a correct call for the prompt;
# the test suite runs it against the real engine and requires it to meet `expect_card`.
# Each case's `source` says where the expectation comes from.
#
# Editing this file changes the case-set digest recorded in every report: reports with different
# digests are not directly comparable.

# ----------------------------------------------------------------------------- symbolic
- id: simplify-rational
  category: symbolic
  prompt: 'Simplify $\frac{x^2-1}{x-1}$'
  expected_tool: simplify
  max_unchecked: 0
  expect_card: {status: ok, result_text: "x + 1"}
  reference: {tool: simplify, arguments: {latex: '\frac{x^2-1}{x-1}'}}
  source: "engine test_simplify.py"

- id: simplify-trig
  category: symbolic
  prompt: 'Simplify $\sin^2 x + \cos^2 x$'
  expected_tool: simplify
  also_ok: [find_identities]
  expect_card: {status: ok, result_text: "1"}
  reference: {tool: simplify, arguments: {latex: '\sin^2 x + \cos^2 x'}}
  source: "engine test_simplify.py"

- id: sqrt-no-assumptions
  category: symbolic
  prompt: 'Simplify $\sqrt{x^2}$'
  expected_tool: simplify
  args: {absent: [assumptions]}
  expect_card: {status: conditions_not_satisfied}
  reference: {tool: simplify, arguments: {latex: '\sqrt{x^2}'}}
  reply_matches: 'unchanged|no simpler|assum|real|positive|non-?negative'
  wrong_formulas: ['\sqrt{x^2} = x', '\sqrt{x^2} = \left|x\right|', '\sqrt{x^2} = |x|']
  source: "AGENTS.md (symbols are complex unless declared) and engine test_simplify.py"

- id: sqrt-positive
  category: symbolic
  prompt: 'x is positive. Simplify $\sqrt{x^2}$'
  expected_tool: simplify
  args: {assumes: {x: positive}}
  # With x positive the reader already folds sqrt(x^2) to x, so the engine reports "unchanged".
  expect_card: {status: unchanged, result_text: "x"}
  reference: {tool: simplify, arguments: {latex: '\sqrt{x^2}', assumptions: {x: [positive]}}}
  source: "textbook (the square root of a square of a positive number)"

- id: hyperbolic
  category: symbolic
  prompt: 'Is $\cosh^2 x - \sinh^2 x$ equal to 1?'
  expected_tool: simplify
  also_ok: [find_identities, search_handbook]
  expect_card: {status: ok, result_text: "1"}
  reference: {tool: simplify, arguments: {latex: '\cosh^2 x - \sinh^2 x'}}
  source: "engine test_simplify.py"

- id: factor-fourth-powers
  category: symbolic
  prompt: 'Factor $x^4 - y^4$.'
  expected_tool: simplify
  args: {equals: {goal: factor}}
  expect_card: {status: ok, result_text: "(x - y)*(x + y)*(x**2 + y**2)"}
  reference: {tool: simplify, arguments: {latex: 'x^4 - y^4', goal: factor}}
  source: "handbook benchmark transform_cases.yaml (factor_fourth_powers)"

- id: expand-binomial
  category: symbolic
  prompt: 'Expand $(x+1)^3$.'
  expected_tool: simplify
  args: {equals: {goal: expand}}
  expect_card: {status: ok, result_text: "x**3 + 3*x**2 + 3*x + 1"}
  reference: {tool: simplify, arguments: {latex: '(x+1)^3', goal: expand}}
  source: "binomial theorem"

- id: solve-reducible
  category: symbolic
  prompt: 'Solve $x^3 + x^2 + x + 1 = 0$.'
  expected_tool: solve_polynomial
  max_unchecked: 3
  expect_card: {status: ok}
  reference: {tool: solve_polynomial, arguments: {equation: 'x^3+x^2+x+1=0'}}
  source: "engine test_solve.py (roots -1, i, -i)"

- id: solve-quintic
  category: symbolic
  prompt: 'Solve $x^5 - x - 1 = 0$. Is there a closed formula for the roots?'
  expected_tool: solve_polynomial
  reply_matches: 'radical|closed|formula|Galois|Abel|numeric'
  expect_card: {status: ok}
  reference: {tool: solve_polynomial, arguments: {equation: 'x^5-x-1=0'}}
  source: "engine test_solve.py (quintic has no radical solution)"

# ----------------------------------------------------------------------------- multistep
- id: chain-pyth-tan
  category: multistep
  prompt: 'Simplify $\sin^2 x + \cos^2 x + \tan^2 x$ and tell me which handbook identities you used.'
  expected_tool: simplify
  reply_matches: 'trig\.|pythagorean|tangent and secant|sec'
  expect_card: {status: ok, result_text: "sec(x)**2"}
  reference: {tool: simplify, arguments: {latex: '\sin^2 x + \cos^2 x + \tan^2 x'}}
  source: "handbook benchmark transform_cases.yaml (pyth_then_tan_secant)"

- id: chain-hyperbolic-trig
  category: multistep
  prompt: 'Simplify $\cosh^2 x - \sinh^2 x + \sin^2 t + \cos^2 t$.'
  expected_tool: simplify
  expect_card: {status: ok, result_text: "2"}
  reference: {tool: simplify, arguments: {latex: '\cosh^2 x - \sinh^2 x + \sin^2 t + \cos^2 t'}}
  source: "handbook benchmark transform_cases.yaml (hyperbolic_then_trig)"

- id: integrate-then-check
  category: multistep
  prompt: 'Find an antiderivative of $x \cos x$ and then differentiate it to check.'
  expected_tool: integrate
  sequence: [integrate, differentiate]
  max_calls: 2
  expect_card: {status: ok, result_text: "x*sin(x) + cos(x)"}
  reference: {tool: integrate, arguments: {latex: 'x \cos x', variable: x}}
  source: "engine test_integrate.py"

- id: differentiate-then-series
  category: multistep
  prompt: 'Differentiate $x^3 \sin x$ with respect to x, then give the Taylor series of that derivative about 0 up to order 3.'
  expected_tool: differentiate
  sequence: [differentiate, series]
  max_calls: 2
  expect_card: {status: ok, result_text: "x**2*(x*cos(x) + 3*sin(x))"}
  reference: {tool: differentiate, arguments: {latex: 'x^3 \sin x', variables: [{name: x}]}}
  source: "product rule"

- id: simplify-then-differentiate
  category: multistep
  prompt: 'Simplify $\frac{x^2-1}{x-1}$ and then differentiate the result with respect to x.'
  expected_tool: simplify
  sequence: [simplify, differentiate]
  max_calls: 2
  expect_card: {status: ok, result_text: "x + 1"}
  reference: {tool: simplify, arguments: {latex: '\frac{x^2-1}{x-1}'}}
  source: "engine test_simplify.py"

- id: definite-by-tool
  category: multistep
  prompt: 'Compute $\int_0^1 x e^{x}\,dx$.'
  expected_tool: integrate
  args: {present: [lower, upper]}
  max_unchecked: 0
  expect_card: {status: ok, result_text: "1"}
  reference: {tool: integrate, arguments: {latex: 'x \exp(x)', variable: x, lower: '0', upper: '1'}}
  source: "integration by parts, [(x-1)e^x] from 0 to 1 equals 1"

- id: lagrangian-then-numbers
  category: multistep
  prompt: 'Find the equations of motion of $\frac12 m\dot{x}^2 - \frac12 k x^2$ and then integrate them numerically.'
  expected_tool: analyze_lagrangian
  forbid: [integrate_motion]
  reply_matches: '\?|which|what|value|initial|choose|provide|give'
  expect_card: {status: ok}
  reference:
    tool: analyze_lagrangian
    arguments: {lagrangian: '\frac12 m\dot{x}^2 - \frac12 k x^2', coordinates: [x]}
  source: "AGENTS.md (integrate_motion needs numbers only the user may choose)"

- id: expand-pendulum
  category: multistep
  prompt: 'Expand the equations of motion of the pendulum Lagrangian $\frac12 m l^2\dot{\theta}^2 + m g l \cos\theta$ about the bottom position theta = 0 to third order.'
  expected_tool: expand_motion
  also_ok: [analyze_lagrangian]
  args: {includes: {coordinates: [theta]}}
  max_calls: 2
  expect_card: {status: ok}
  reference:
    tool: expand_motion
    arguments:
      lagrangian: '\frac12 m l^2\dot{\theta}^2 + m g l \cos\theta'
      coordinates: [theta]
      equilibrium: {theta: '0'}
      order: 3
  source: "engine test_expansion.py (pendulum)"

# ----------------------------------------------------------------------------- calculus
- id: differentiate-first
  category: calculus
  prompt: 'What is the derivative of $x^x$ with respect to x?'
  expected_tool: differentiate
  args: {includes: {variables: [{name: x}]}}
  max_unchecked: 0
  expect_card: {status: ok, result_text: "x**x*(log(x) + 1)"}
  reference: {tool: differentiate, arguments: {latex: 'x^x', variables: [{name: x}]}}
  source: "engine test_differentiate.py"

- id: differentiate-second
  category: calculus
  prompt: 'Differentiate $\sin x \, e^{x}$ twice with respect to x.'
  expected_tool: differentiate
  args: {includes: {variables: [{name: x, order: 2}]}}
  expect_card: {status: ok, result_text: "2*exp(x)*cos(x)"}
  reference: {tool: differentiate, arguments: {latex: '\sin x \exp(x)', variables: [{name: x, order: 2}]}}
  source: "engine test_differentiate.py (derivatives of sin(x) exp(x))"

- id: differentiate-mixed
  category: calculus
  prompt: 'Find the mixed partial derivative of $x^2 y^3$, first in x and then in y.'
  expected_tool: differentiate
  args: {includes: {variables: [{name: x}, {name: y}]}}
  expect_card: {status: ok, result_text: "6*x*y**2"}
  reference: {tool: differentiate, arguments: {latex: 'x^2 y^3', variables: [{name: x}, {name: y}]}}
  source: "engine test_differentiate.py (mixed partial)"

- id: differentiate-product
  category: calculus
  prompt: 'Differentiate $x^3 \sin x$.'
  expected_tool: differentiate
  args: {includes: {variables: [{name: x}]}}
  max_unchecked: 1
  expect_card: {status: ok, result_text: "x**2*(x*cos(x) + 3*sin(x))"}
  reference: {tool: differentiate, arguments: {latex: 'x^3 \sin x', variables: [{name: x}]}}
  source: "product rule (this case used to demand a refusal; differentiate now handles it)"

- id: integrate-indefinite
  category: calculus
  prompt: 'Find an antiderivative of $x \cos x$.'
  expected_tool: integrate
  args: {equals: {variable: x}}
  max_unchecked: 0
  expect_card: {status: ok, result_text: "x*sin(x) + cos(x)"}
  reference: {tool: integrate, arguments: {latex: 'x \cos x', variable: x}}
  source: "engine test_integrate.py"

- id: integrate-definite
  category: calculus
  prompt: 'Compute $\int_0^\pi \sin x \, dx$.'
  expected_tool: integrate
  args: {present: [lower, upper]}
  max_unchecked: 0
  expect_card: {status: ok, result_text: "2"}
  reference: {tool: integrate, arguments: {latex: '\sin x', variable: x, lower: '0', upper: '\pi'}}
  source: "engine test_integrate.py (sin from 0 to pi)"

- id: integrate-gaussian
  category: calculus
  prompt: 'Find an antiderivative of $e^{-x^2}$.'
  expected_tool: integrate
  expect_card: {status: ok, result_text: "sqrt(pi)*erf(x)/2"}
  reference: {tool: integrate, arguments: {latex: '\exp(-x^2)', variable: x}}
  source: "engine test_integrate.py"

- id: integrate-log
  category: calculus
  prompt: 'Compute $\int_0^1 \ln x \, dx$.'
  expected_tool: integrate
  args: {present: [lower, upper]}
  expect_card: {status: ok, result_text: "-1"}
  reference: {tool: integrate, arguments: {latex: '\log x', variable: x, lower: '0', upper: '1'}}
  source: "engine test_integrate.py (log from 0 to 1)"

- id: integrate-improper
  category: calculus
  prompt: 'Compute $\int_0^\infty e^{-x}\,dx$.'
  expected_tool: integrate
  args: {present: [lower, upper]}
  expect_card: {status: ok, result_text: "1"}
  reference: {tool: integrate, arguments: {latex: '\exp(-x)', variable: x, lower: '0', upper: 'oo'}}
  source: "engine test_integrate.py (exp(-x) from 0 to infinity)"

- id: series-tan
  category: calculus
  prompt: 'Expand $\tan x$ in a Taylor series about 0 up to order 5.'
  expected_tool: series
  args: {equals: {variable: x}}
  expect_card: {status: ok, result_text: "x + x**3/3 + 2*x**5/15"}
  reference: {tool: series, arguments: {latex: '\tan x', variable: x, point: '0', order: 5}}
  source: "engine test_series.py"

- id: integrate-needs-assumptions
  category: calculus
  prompt: 'Compute $\int_0^\infty e^{-a x}\,dx$ with respect to x.'
  expected_tool: integrate
  args: {absent: [assumptions]}
  expect_card: {status: conditions_not_satisfied}
  reference: {tool: integrate, arguments: {latex: '\exp(-a x)', variable: x, lower: '0', upper: 'oo'}}
  reply_matches: 'positive|assum|condition|Re'
  source: "AGENTS.md (convergence conditions are never assumed) and engine test_integrate.py"

