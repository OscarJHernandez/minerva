    - {role: user, content: 'Christoffel symbols of $ds^2 = a^2 d\theta^2 + a^2\sin^2\theta\, d\phi^2$, a > 0.'}
    - role: assistant
      content: ''
      tool_calls:
        - id: call_geometry_1
          name: geometry
          arguments:
            coordinates: [theta, phi]
            metric: [['a^2', '0'], ['0', 'a^2 \sin^2\theta']]
            assumptions: {a: [positive]}
            quantities: [christoffel]
    - {role: tool, tool_call_id: call_geometry_1, name: geometry, content: 'status=ok; dimension=2; the Christoffel symbols were computed and verified.'}
    - {role: assistant, content: 'The card lists them.'}
  expected_tool: geometry
  args: {equals: {coordinates: [theta, phi]}, includes: {quantities: [ricci_scalar]}}
  informational: true
  source: "tool description of geometry (the geometry is not remembered: a follow-up resends the same metric)"

- id: delta-integral-uses-the-tool
