- id: beta-binomial-posterior
  category: symbolic
  prompt: 'The number of successes $k$ in $n$ trials is Binomial(n, p) and I use a Beta(alpha, beta) prior for p. What is the posterior of p?'
  expected_tool: statistical_model
  args: {equals: {action: posterior}, includes: {estimate: [p]}}
  expect_card: {status: ok}
  reference:
    tool: statistical_model
    arguments:
      family: binomial
      parameters: {n: n}
      observation: k
      estimate: [p]
      prior: {family: beta, parameters: {alpha: alpha, beta: beta}}
      action: posterior
      assumptions: {n: [integer, positive], k: [integer, nonnegative], alpha: [positive], beta: [positive]}
  informational: true
  source: "engine test_stat_derivations.py (the prior is the user's)"
