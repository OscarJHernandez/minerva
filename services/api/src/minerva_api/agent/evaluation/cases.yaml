# ----------------------------------------------------------------------------- statistics
- id: mle-gaussian-mean-independent
  category: symbolic
  prompt: 'Observations $x_1,\dots,x_n$ are independent and normally distributed with unknown mean $\mu$ and known variance $v$. Derive the maximum-likelihood estimator of $\mu$.'
  expected_tool: statistical_model
  args: {equals: {family: normal, action: mle, iid: true}, includes: {estimate: [mu]}}
  expect_card: {status: ok}
  reference:
    tool: statistical_model
    arguments:
      family: normal
      parametrization: variance
      parameters: {v: v}
      observation: x
      sample_size: n
      iid: true
      estimate: [mu]
      action: mle
      assumptions: {n: [integer, positive], v: [positive], x: [real]}
  informational: true
  source: "engine test_stat_derivations.py (the independence was stated by the user)"

