- id: identity-gamma-ratio
  category: retrieval
  prompt: 'Simplify $\Gamma(x+1)/\Gamma(x)$.'
  expected_tool: simplify
  also_ok: [find_identities]
  expect_card: {status: ok, result_text: "x"}
  reference: {tool: simplify, arguments: {latex: '\Gamma(x+1)/\Gamma(x)'}}
  source: "handbook benchmark transform_cases.yaml (gamma_ratio)"

- id: identity-tan-secant
  category: retrieval
  prompt: 'Which identity relates $\tan^2 x$ and $\sec^2 x$?'
  expected_tool: find_identities
  also_ok: [search_handbook, simplify]
  expect_card: {status: ok}
  reference: {tool: find_identities, arguments: {latex: '1 + \tan^2 x'}}
  source: "handbook entry trig.tan_secant"

# ----------------------------------------------------------------------------- tensor_matrix
- id: tensor-contraction
  category: tensor_matrix
  prompt: 'S has two symmetric indices and A two antisymmetric ones. Is $S_{ab}A^{ab}$ zero?'
  expected_tool: tensor_canonicalize
  reply_matches: '\b(zero|0|vanish)'
  expect_card: {status: ok}
  reference:
    tool: tensor_canonicalize
    arguments:
      expression: 'S(a,b)*A(-a,-b)'
      tensors: {S: {rank: 2, symmetry: symmetric}, A: {rank: 2, symmetry: antisymmetric}}
  source: "engine test_tensor.py (symmetric x antisymmetric contraction vanishes)"

- id: tensor-riemann-pair-symmetry
  category: tensor_matrix
  prompt: 'R is a Riemann tensor. Simplify $R_{abcd} - R_{cdab}$.'
  expected_tool: tensor_canonicalize
  reply_matches: '\b(zero|0|vanish)'
  expect_card: {status: ok}
  reference:
    tool: tensor_canonicalize
    arguments:
      expression: 'R(-a,-b,-c,-d) - R(-c,-d,-a,-b)'
      tensors: {R: {rank: 4, symmetry: riemann}}
  source: "engine test_tensor.py (pair symmetry of the Riemann tensor)"

- id: matrix-merge-needs-commutation
  category: tensor_matrix
  prompt: 'Simplify $\exp(A)\exp(B)$ for two 2x2 matrices A and B.'
  expected_tool: matrix_calculus
  args: {absent: [commuting]}
  expect_card: {status: conditions_not_satisfied}
  reference:
    tool: matrix_calculus
    arguments:
      latex: '\exp(A)\exp(B)'
      matrices: [{name: A, rows: 2}, {name: B, rows: 2}]
      action: simplify
  reply_matches: 'commut'
  wrong_formulas: ['\exp(A)\exp(B) = \exp(A + B)', '\exp(A)\exp(B) = \exp(A+B)']
  source: "engine test_matrix_calculus.py (undeclared commutation is refused)"

- id: matrix-commuting-declared
  category: tensor_matrix
  prompt: 'A and B are 2x2 matrices and they commute. Simplify $\exp(A)\exp(B)$.'
  expected_tool: matrix_calculus
  args: {includes: {commuting: [[A, B]]}}
  expect_card: {status: ok}
  reference:
    tool: matrix_calculus
    arguments:
      latex: '\exp(A)\exp(B)'
      matrices: [{name: A, rows: 2}, {name: B, rows: 2}]
      action: simplify
      commuting: [[A, B]]
  source: "engine test_matrix_calculus.py (declared commutation merges the exponentials)"

- id: matrix-integral-not-evaluated
  category: tensor_matrix
  prompt: 'Integrate $\exp(tP)\exp(tQ)$ in t from 0 to 1, where P and Q are 2x2 matrices.'
  expected_tool: matrix_calculus
  args: {equals: {action: integrate}, absent: [invertible]}
  reply_matches: 'not evaluated|equation|representation|commut|cannot|unsupported|blocked'
  source: "AGENTS.md (a Sylvester equation is never presented as an evaluated integral)"

- id: matrix-frechet-not-rewritten
  category: tensor_matrix
  prompt: 'Differentiate $\exp(t^2 A + t B)$ in t, where A and B are 2x2 matrices.'
  expected_tool: matrix_calculus
  args: {equals: {action: differentiate}, absent: [commuting]}
  expect_card: {status: ok}
  reference:
    tool: matrix_calculus
    arguments:
      latex: '\exp(t^2 A + t B)'
      matrices: [{name: A, rows: 2}, {name: B, rows: 2}]
      action: differentiate
      variable: t
  reply_matches: 'integral|representation|commut'
  wrong_formulas: ['\frac{d}{dt}\exp(t^2 A + t B) = (2tA + B)\exp(t^2 A + t B)']
  source: "engine test_matrix_frechet.py (X' exp(X) is wrong when X and X' do not commute)"

- id: matrix-evolution-asks-for-the-span
  category: tensor_matrix
  prompt: 'Solve dU/dt = A(t) U with U(0) = I for the 2x2 matrix A(t) = [[0, t], [-1, 0]].'
  expected_tool: ask
  reply_matches: 'end|until|span|how long|up to|which time|what time'
  source: "AGENTS.md (the end of a numerical span is a number only the user may choose)"

# ----------------------------------------------------------------------------- physics
- id: lagrangian-kepler
  category: physics
  prompt: 'Find the equations of motion and the conserved quantities of the Lagrangian $\frac12 m(\dot{r}^2 + r^2\dot{\theta}^2) + \frac{k}{r}$ in the coordinates r and theta.'
  expected_tool: analyze_lagrangian
  args: {includes: {coordinates: [r, theta]}}
  expect_card: {status: ok}
  reference:
    tool: analyze_lagrangian
    arguments: {lagrangian: '\frac12 m(\dot{r}^2 + r^2\dot{\theta}^2) + \frac{k}{r}', coordinates: [r, theta]}
  source: "engine test_lagrangian.py (Kepler in polar coordinates)"

- id: motion-values-given
