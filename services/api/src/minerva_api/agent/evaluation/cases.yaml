- id: statmech-ideal-gas-conventions-are-the-users
  category: physics
  prompt: 'Find the pressure of a classical ideal gas of N identical particles of mass m in a box of volume V, with H = sum of p^2/(2m).'
  expected_tool: statistical_mechanics
  args: {present: [system]}
  expect_card: {status: conditions_not_satisfied}
  reference:
    tool: statistical_mechanics
    arguments:
      action: derive
      system:
        kind: classical
        hamiltonian: '(px**2 + py**2 + pz**2)/(2*m)'
        variables:
          - {name: x, domain_lower: '0', domain_upper: 'V**(1/3)'}
          - {name: y, domain_lower: '0', domain_upper: 'V**(1/3)'}
          - {name: z, domain_lower: '0', domain_upper: 'V**(1/3)'}
          - {name: px}
          - {name: py}
          - {name: pz}
      copies_count: N
      parameters: [V]
