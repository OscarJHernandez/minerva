  expect_card: {status: ok, result_text: "x*cos(x)"}
  reference: {tool: differentiate, arguments: {latex: 'x \sin x + \cos x', variables: [{name: x}]}}
  source: "calculus (the derivative of an antiderivative is the integrand)"

