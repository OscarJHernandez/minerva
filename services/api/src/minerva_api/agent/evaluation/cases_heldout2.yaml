  args: {present: [expression]}
  expect_card: {status: ok}
  reference:
    tool: vector_calculus
    arguments:
      expression: '\nabla f'
      fields: [{name: f, kind: scalar, components: ['x**2*y + z']}]
  source: "hand calculation: (2xy, x^2, 1)"

- id: h2-vec-div-curl-needs-smoothness
  category: ambiguous
  prompt: 'In cylindrical coordinates, what is the divergence of the curl of an arbitrary vector field A?'
  expected_tool: vector_calculus
  expect_card: {status: conditions_not_satisfied}
  reference:
    tool: vector_calculus
    arguments:
      expression: '\nabla\cdot(\nabla\times\mathbf{A})'
      coordinates: cylindrical
      fields: [{name: A, kind: vector}]
  reply_matches: 'smooth|differentiab|C\^?2|continuous|mixed'
  source: "AGENTS.md (vector calculus): nothing is assumed smooth; div curl A = 0 needs equal mixed partials, which the user did not state"

- id: h2-vec-laplacian-radial
  category: calculus
  prompt: 'Laplacian of r^3 in spherical coordinates please'
  expected_tool: vector_calculus
  args: {equals: {coordinates: spherical}}
  expect_card: {status: ok, result_text: "12*r"}
  reference:
    tool: vector_calculus
    arguments:
      expression: '\nabla^2 (r^3)'
      coordinates: spherical
  source: "hand calculation: (1/r^2) d/dr (r^2 * 3 r^2) = 12 r"

# ----------------------------------------------------------------------------- integration
- id: h2-int-definite-by-parts
  category: calculus
  prompt: "What's the area under x e^(-x) between x = 0 and x = 1?"
  expected_tool: integrate
  args: {present: [latex, variable, lower, upper]}
  expect_card: {status: ok, result_text: "1 - 2*exp(-1)"}
  reference: {tool: integrate, arguments: {latex: 'x\exp(-x)', variable: x, lower: '0', upper: '1'}}
  source: "hand calculation by parts: [-x e^-x - e^-x]_0^1 = 1 - 2/e"

- id: h2-int-no-closed-form
  category: unsupported
  prompt: 'Find the antiderivative of $x^x$.'
  expected_tool: integrate
  args: {equals: {variable: x}}
  expect_card: {status: unsupported}
  reference: {tool: integrate, arguments: {latex: 'x^x', variable: x}}
  reply_forbids: 'no closed.form (exists|antiderivative exists)|is impossible|proved that|can.t be expressed'
  source: "AGENTS.md (antiderivatives): no closed form found is unsupported and never claims that none exists"

- id: h2-int-gaussian-needs-assumption
  category: calculus
  prompt: 'Compute the integral of exp(-a x^2) over the whole real line.'
  expected_tool: integrate
  forbid_assumptions: true
  args: {absent: [assumptions]}
  expect_card: {status: conditions_not_satisfied}
  reference: {tool: integrate, arguments: {latex: '\exp(-a x^2)', variable: x, lower: '-oo', upper: 'oo'}}
  reply_matches: 'positive|a\s*>\s*0|real part|assum|converge'
  source: "the integral converges only for Re(a) > 0 (Gaussian integral); a is complex unless declared (AGENTS.md)"
  followups:
    - prompt: 'Take a > 0 then.'
      expected_tool: integrate
      args: {assumes: {a: positive}}
      expect_card: {status: ok, result_text: "sqrt(pi)/sqrt(a)"}
      reference:
        tool: integrate
        arguments: {latex: '\exp(-a x^2)', variable: x, lower: '-oo', upper: 'oo', assumptions: {a: [positive]}}
      source: "Gaussian integral: sqrt(pi/a) for a > 0"

# ----------------------------------------------------------------------------- differentiation and series
- id: h2-diff-log-quotient
  category: calculus
  prompt: 'd/dx of ln(x)/x'
  expected_tool: differentiate
  args: {includes: {variables: [{name: x}]}}
  expect_card: {status: ok, result_text: "(1 - log(x))/x**2"}
  reference: {tool: differentiate, arguments: {latex: '\frac{\log x}{x}', variables: [{name: x}]}}
  source: "quotient rule: (1/x * x - ln x)/x^2 = (1 - ln x)/x^2"

- id: h2-series-sqrt
  category: calculus
  prompt: 'Taylor polynomial of sqrt(1+x) around 0 through x^3, please.'
  expected_tool: series
  args: {equals: {variable: x}}
  expect_card: {status: ok, result_text: "1 + x/2 - x**2/8 + x**3/16"}
  reference: {tool: series, arguments: {latex: '\sqrt{1+x}', variable: x, point: '0', order: 3}}
  source: "binomial series: 1 + x/2 - x^2/8 + x^3/16 - ..."

# ----------------------------------------------------------------------------- matrix calculus
- id: h2-mat-noncommuting-product
  category: tensor_matrix
  prompt: 'A and B are 2x2 matrices. Multiply out (A+B)(A-B).'
  expected_tool: matrix_calculus
  args: {present: [matrices], absent: [commuting]}
  forbid_assumptions: true
  expect_card: {status: ok}
  reference:
    tool: matrix_calculus
    arguments:
      latex: '(A+B)(A-B)'
      matrices: [{name: A, rows: 2}, {name: B, rows: 2}]
      action: simplify
  wrong_formulas: ['(A+B)(A-B) = A^2 - B^2']
  source: "distributing without reordering: A^2 - AB + BA - B^2; equal to A^2 - B^2 only if AB = BA"

- id: h2-mat-exp-nilpotent
  category: tensor_matrix
  prompt: 'Evaluate exp(N) for N = [[0, 2], [0, 0]].'
  expected_tool: matrix_calculus
  args: {present: [matrices]}
  expect_card: {status: ok}
  reference:
    tool: matrix_calculus
    arguments:
      latex: '\exp(N)'
      matrices: [{name: N, entries: [['0', '2'], ['0', '0']]}]
      action: evaluate
  reply_matches: '1.*2.*0.*1'
  source: "N^2 = 0, so exp(N) = I + N = [[1, 2], [0, 1]]"

- id: h2-mat-quadratic-form-gradient
  category: tensor_matrix
  prompt: 'x is a 3-vector and A a 3x3 matrix. What is the gradient of x^T A x with respect to x?'
  expected_tool: matrix_calculus
  args: {equals: {action: gradient}, absent: [symmetric]}
  expect_card: {status: ok}
  reference:
    tool: matrix_calculus
    arguments:
      latex: 'transpose(x)*A*x'
      matrices: [{name: x, rows: 3, cols: 1}, {name: A, rows: 3}]
      action: gradient
      variable: x
  reply_matches: 'A\s*\+\s*A\^?\{?(T|\\top)|A\^?\{?(T|\\top)\}?\s*\+\s*A'
  source: "differential: d(x'Ax) = x'(A + A')dx, so the gradient is (A + A')x; A is not stated symmetric"

# ----------------------------------------------------------------------------- statistics
- id: h2-stat-mle-poisson
  category: symbolic
  prompt: 'I have counts x_1, ..., x_n, independent and identically Poisson distributed with unknown rate lam. What is the maximum likelihood estimate of lam?'
  expected_tool: statistical_model
  args: {equals: {family: poisson, action: mle, iid: true}, includes: {estimate: [lam]}}
  expect_card: {status: ok}
  reference:
    tool: statistical_model
    arguments:
      family: poisson
      observation: x
      sample_size: n
      iid: true
      estimate: [lam]
      action: mle
      assumptions: {n: [integer, positive], x: [integer, nonnegative]}
  source: "textbook: the Poisson MLE is the sample mean (score sum(x_i)/lam - n = 0)"

- id: h2-stat-fisher-bernoulli
  category: symbolic
  prompt: 'Fisher information of a single Bernoulli(p) observation?'
  expected_tool: statistical_model
  args: {equals: {family: bernoulli, action: fisher_information}, includes: {estimate: [p]}}
  expect_card: {status: ok}
  reference:
    tool: statistical_model
    arguments:
      family: bernoulli
      estimate: [p]
      action: fisher_information
      assumptions: {p: [positive]}
  source: "textbook: I(p) = 1/(p(1-p)) for the Bernoulli family"

- id: h2-stat-poisson-gamma-posterior
  category: symbolic
  prompt: 'One observed count k from a Poisson(lam) distribution; my prior on lam is Gamma with shape a and rate b. Derive the posterior for lam.'
  expected_tool: statistical_model
  args: {equals: {family: poisson, action: posterior}, includes: {estimate: [lam]}}
  expect_card: {status: ok}
  reference:
    tool: statistical_model
    arguments:
      family: poisson
      observation: k
      estimate: [lam]
      prior: {family: gamma, parameters: {alpha: a, beta: b}}
      action: posterior
      assumptions: {a: [positive], b: [positive], k: [integer, nonnegative]}
  source: "conjugacy (textbook): Gamma(a + k, b + 1); the prior is the user's"

- id: h2-stat-variance-linear-combination
  category: symbolic
  prompt: 'Expand Var(2X - Y) for random variables X and Y.'
  expected_tool: expectation
  args: {absent: [independent]}
  expect_card: {status: ok}
  reference:
    tool: expectation
    arguments: {latex: '\operatorname{Var}(2X - Y)', random: [X, Y]}
  source: "bilinearity of covariance: 4 Var X + Var Y - 4 Cov(X, Y); no independence was stated"
  followups:
    - prompt: 'X and Y are independent, by the way. Does that change it?'
      expected_tool: expectation
      args: {includes: {independent: [[X, Y]]}}
      expect_card: {status: ok}
      reference:
        tool: expectation
        arguments: {latex: '\operatorname{Var}(2X - Y)', random: [X, Y], independent: [[X, Y]]}
      reply_matches: 'given|assum|independen'
      source: "independence kills Cov(X, Y): 4 Var X + Var Y, which holds given the premise the user stated"

# ----------------------------------------------------------------------------- mechanics
- id: h2-mech-atwood
  category: physics
  prompt: 'Atwood machine with masses m1 and m2, y is the position of m1 measured downward: L = (m1+m2) ydot^2 / 2 + (m1-m2) g y. Equation of motion?'
  expected_tool: analyze_lagrangian
  args: {includes: {coordinates: [y]}}
  expect_card: {status: ok}
  reference:
    tool: analyze_lagrangian
    arguments: {lagrangian: '\frac{(m_1+m_2)\dot{y}^2}{2} + (m_1-m_2) g y', coordinates: [y]}
  source: "textbook (Atwood machine): (m1 + m2) y'' = (m1 - m2) g"

- id: h2-mech-kepler-conserved
  category: physics
  prompt: 'For L = (rdot^2 + r^2 phidot^2)/2 + k/r in polar coordinates r and phi, which quantities are conserved?'
  expected_tool: find_conserved_quantities
  also_ok: [analyze_lagrangian]
  args: {includes: {coordinates: [r, phi]}}
  expect_card: {status: ok}
  reference:
    tool: find_conserved_quantities
    arguments:
      lagrangian: '\frac12(\dot{r}^2 + r^2\dot{\phi}^2) + \frac{k}{r}'
      coordinates: [r, phi]
  reply_forbids: 'no other|has no more|completely integrable|fully integrable|only two'
  source: "textbook: energy (no explicit time) and the angular momentum r^2 phidot (phi is cyclic); a result holds within the explored families only (docs/conserved-quantities.md)"

- id: h2-mech-oscillator-total-derivative
  category: physics
  prompt: "For L = m xdot^2/2 - k x^2/2, is the energy E = m xdot^2/2 + k x^2/2 constant along the motion?"
  expected_tool: time_derivative
  also_ok: [find_conserved_quantities, analyze_lagrangian]
  args: {present: [latex]}
  expect_card: {status: ok}
  reference:
    tool: time_derivative
    arguments:
      latex: '\frac{m\dot{x}^2}{2} + \frac{k x^2}{2}'
      coordinates: [x]
      lagrangian: '\frac{m\dot{x}^2}{2} - \frac{k x^2}{2}'
  source: "hand calculation: dE/dt = m xdot xddot + k x xdot = xdot (m xddot + k x) = 0 on the equation of motion m xddot = -k x"

# ----------------------------------------------------------------------------- differential geometry
- id: h2-geo-polar-flat
  category: tensor_matrix
  prompt: 'Is the plane in polar coordinates, ds^2 = dr^2 + r^2 dtheta^2, flat? Compute the Ricci scalar to find out.'
  expected_tool: geometry
  args: {includes: {coordinates: [r, theta], quantities: [ricci_scalar]}}
  expect_card: {status: ok}
  reference:
    tool: geometry
    arguments:
      coordinates: [r, theta]
      metric: [['1', '0'], ['0', 'r^2']]
      assumptions: {r: [positive]}
      quantities: [ricci_scalar]
  reply_matches: 'flat|zero|vanish|0'
  source: "polar coordinates on the Euclidean plane: curvature 0"

- id: h2-geo-hyperbolic-curvature
  category: tensor_matrix
  prompt: 'Metric ds^2 = dx^2 + e^{2x} dy^2 on coordinates (x, y). What is the scalar curvature?'
  expected_tool: geometry
  args: {includes: {coordinates: [x, y], quantities: [ricci_scalar]}}
  expect_card: {status: ok}
  reference:
    tool: geometry
    arguments:
      coordinates: [x, y]
      metric: [['1', '0'], ['0', '\exp(2x)']]
      quantities: [ricci_scalar]
  reply_matches: '-\s*2'
  source: "for dx^2 + f(x)^2 dy^2 the Gauss curvature is -f''/f = -1, so R = 2K = -2 (hyperbolic plane)"

