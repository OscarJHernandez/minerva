# Second held-out set: written from docs/capabilities.md and the engine's documented behaviour alone, before any
# model trace of these prompts exists. Not part of `all`; run with `--suite heldout2`. Nothing may be tuned
# against it, and no trace of it is to be read before the final measurement. Every reference call is run
# against the engine by `--check-cases`.

# ----------------------------------------------------------------------------- statistical mechanics
- id: h2-sm-three-levels
  category: physics
  prompt: 'A system has three nondegenerate energy levels at -eps, 0 and +eps (eps is positive). Give me Z and the mean energy as functions of beta.'
  expected_tool: statistical_mechanics
  args: {present: [system]}
  expect_card: {status: ok}
  reference:
    tool: statistical_mechanics
    arguments:
      action: derive
      system: {kind: levels, levels: [{energy: '-eps'}, {energy: '0'}, {energy: eps}]}
      assumptions: {eps: [positive]}
      quantities: [Z, U]
  source: "hand calculation: Z = exp(beta eps) + 1 + exp(-beta eps) = 1 + 2 cosh(beta eps), U = -d ln Z / d beta"

- id: h2-sm-degenerate-heat-capacity
  category: physics
  prompt: "heat capacity of a system with a single ground state at 0 and an excited level at energy eps that's g-fold degenerate? eps > 0 and g is a positive integer"
  expected_tool: statistical_mechanics
  args: {present: [system]}
  expect_card: {status: ok}
  reference:
    tool: statistical_mechanics
    arguments:
      action: derive
      system: {kind: levels, levels: [{energy: '0'}, {energy: eps, degeneracy: g}]}
      assumptions: {eps: [positive], g: [integer, positive]}
      quantities: [Z, U]
      partials: [{of: U, variable: T, held_fixed: [], label: C}]
  source: "hand calculation: Z = 1 + g exp(-beta eps); C = dU/dT with U = g eps exp(-beta eps)/(1 + g exp(-beta eps))"

- id: h2-sm-coupled-oscillators-refused
  category: unsupported
  prompt: 'Two classical oscillators on a line, H = px^2/(2m) + py^2/(2m) + (k/2)(x - y)^2 + (k/2)(x + y)^2, with x and y each ranging over the whole real line. What is the canonical partition function?'
  expected_tool: statistical_mechanics
  also_ok: [none]
  args: {present: [system]}
  expect_card: {status: conditions_not_satisfied}
  reference:
    tool: statistical_mechanics
    arguments:
      action: partition
      system:
        kind: classical
        hamiltonian: '(px**2 + py**2)/(2*m) + (k/2)*(x - y)**2 + (k/2)*(x + y)**2'
        variables:
          - {name: x, domain_lower: '-oo', domain_upper: 'oo'}
          - {name: y, domain_lower: '-oo', domain_upper: 'oo'}
          - {name: px}
          - {name: py}
      assumptions: {m: [positive], k: [positive]}
  reply_matches: 'separab|couple|normal.mode|cross|not.*(supported|handled)|cannot'
  source: "docs/capabilities.md and AGENTS.md (statistical mechanics): a term that couples two variables is not_separable and no change of variables is attempted"

- id: h2-sm-bose-chemical-potential
  category: physics
  prompt: 'Non-interacting bosons occupy two single-particle levels with energies 0 and eps. The chemical potential mu is positive and so is eps. Find the mean particle number.'
  expected_tool: statistical_mechanics
  args: {present: [system], equals: {ensemble: grand_canonical}}
  expect_card: {status: conditions_not_satisfied}
  reference:
    tool: statistical_mechanics
    arguments:
      ensemble: grand_canonical
      action: derive
      system:
        kind: occupation
        statistics: bose
        levels: [{energy: '0'}, {energy: eps}]
      assumptions: {mu: [positive], eps: [positive]}
      quantities: [N]
  reply_matches: 'below|mu|diverg|converge|condition|negative'
  source: "AGENTS.md (statistical mechanics): Bose needs mu provably below every level; a positive mu above the level 0 makes the occupation sum diverge"

# ----------------------------------------------------------------------------- vector calculus
- id: h2-vec-gradient-explicit
