- id: h2-ode-forced-linear
  category: calculus
  prompt: 'Solve y'' + 2y = e^(-t) with y(0) = 0.'
  expected_tool: ode_solve_symbolic
  also_ok: [ode_analyze]
  args: {present: [equations, conditions]}
  max_calls: 2
  expect_card: {status: ok}
  reference:
    tool: ode_solve_symbolic
    arguments:
      equations: ["y' + 2*y = exp(-t)"]
      independent: t
      conditions: ["y(0) = 0"]
      format: text
  source: "hand calculation: y = e^-t - e^-2t (check: y' + 2y = e^-t, y(0) = 0)"

- id: h2-ode-equilibria
  category: ambiguous
  prompt: 'What are the equilibria of x'' = x - x^3 and are they stable?'
  expected_tool: ode_analyze
  also_ok: [ode_solve_symbolic]
  args: {present: [equations]}
  expect_card: {status: ok}
  reference: {tool: ode_analyze, arguments: {equations: ["x' = x - x^3"], independent: t}}
  reply_forbids: 'globally stable|stable for all'
  source: "hand calculation: equilibria 0, 1, -1; f'(x) = 1 - 3x^2 is +1 at 0 (unstable) and -2 at +-1 (stable); local statements only (docs/ode.md)"

