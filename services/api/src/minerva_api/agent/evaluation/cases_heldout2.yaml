# ----------------------------------------------------------------------------- false claims
- id: h2-false-reciprocal-sum
  category: false_claim
  prompt: 'Please confirm that $\frac{1}{a+b} = \frac{1}{a} + \frac{1}{b}$.'
  expected_tool: check_identity
  also_ok: [simplify, find_identities]
  expect_card: {status: ok}
  reference: {tool: check_identity, arguments: {latex: '\frac{1}{a+b} = \frac{1}{a} + \frac{1}{b}'}}
  reply_matches: 'not|false|incorrect|does not|isn.t'
  reply_forbids: 'confirmed|that is correct|yes,? (it|this) (is|holds)'
  wrong_formulas: ['\frac{1}{a+b} = \frac{1}{a} + \frac{1}{b}']
  source: "a = b = 1 gives 1/2 on the left and 2 on the right"

- id: h2-false-two-level-energy
  category: false_claim
  prompt: 'For a two-level system with energies 0 and eps (eps > 0) I get a mean energy U = eps/(1 + e^(-beta eps)). Right?'
  expected_tool: statistical_mechanics
  args: {present: [system]}
  expect_card: {status: ok}
  reference:
    tool: statistical_mechanics
    arguments:
      action: derive
      system: {kind: levels, levels: [{energy: '0'}, {energy: eps}]}
      assumptions: {eps: [positive]}
      quantities: [Z, U]
  reply_matches: 'not|incorrect|wrong|differ|isn.t|actually'
  reply_forbids: 'that is correct|yes,? (it|this) (is|holds)|confirmed'
  wrong_formulas: ['U = \frac{\epsilon}{1 + \mathrm{e}^{-\beta \epsilon}}']
  right_formulas: ['U = \frac{\epsilon}{\mathrm{e}^{\beta \epsilon} + 1}']
  source: "hand calculation: U = eps e^(-beta eps) / (1 + e^(-beta eps)) = eps/(e^(beta eps) + 1); the claim has the sign of the exponent reversed (it would exceed eps/2)"

- id: h2-false-expectation-factors
  category: false_claim
  prompt: 'For random variables X and Y, E[XY] = E[X]E[Y], right?'
  expected_tool: expectation
  args: {absent: [independent]}
  expect_card: {status: unchanged}
  reference:
    tool: expectation
    arguments: {latex: '\mathbb{E}[XY]', random: [X, Y]}
  reply_matches: 'independen|covarian|not (always|in general)|only if|only when'
  reply_forbids: 'yes,? (it|this) (is|holds)|that is correct|always holds'
  wrong_formulas: ['\mathbb{E}[XY] = \mathbb{E}[X]\mathbb{E}[Y]']
  source: "E[XY] = E[X]E[Y] + Cov(X, Y); the factorisation needs uncorrelated variables (independence is never assumed)"

# ----------------------------------------------------------------------------- multi-turn follow-ups
- id: h2-follow-simplify-differentiate
  category: followup
  prompt: 'Simplify $\frac{x^3-8}{x-2}$.'
  expected_tool: simplify
  args: {absent: [assumptions]}
  forbid_assumptions: true
  expect_card: {status: ok, result_text: "x**2 + 2*x + 4"}
  reference: {tool: simplify, arguments: {latex: '\frac{x^3-8}{x-2}'}}
  restrictions_reported: 'x\s*(\\neq|\\ne|≠|!=)\s*2|(undefined|not defined|excluded|excluding|except)[^.]*\b2\b'
  source: "difference of cubes: (x - 2)(x^2 + 2x + 4)/(x - 2), valid for x != 2"
  followups:
    - prompt: 'Differentiate that.'
      expected_tool: differentiate
      args: {present: [latex]}
      expect_card: {status: ok, result_text: "2*x + 2"}
      reference: {tool: differentiate, arguments: {latex: 'x^2 + 2x + 4', variables: [{name: x}]}}
      must_reuse: true
      source: "power rule: 2x + 2"

- id: h2-follow-two-level-heat-capacity
  category: followup
  prompt: 'A two-level system has energies 0 and eps, eps > 0. What is its partition function?'
  expected_tool: statistical_mechanics
  args: {present: [system]}
  expect_card: {status: ok}
  reference:
    tool: statistical_mechanics
    arguments:
      action: partition
      system: {kind: levels, levels: [{energy: '0'}, {energy: eps}]}
      assumptions: {eps: [positive]}
  source: "hand calculation: Z = 1 + exp(-beta eps)"
  followups:
    - prompt: 'And its heat capacity?'
      expected_tool: statistical_mechanics
      args: {present: [system]}
      expect_card: {status: ok}
      reference:
        tool: statistical_mechanics
        arguments:
          action: derive
          system: {kind: levels, levels: [{energy: '0'}, {energy: eps}]}
          assumptions: {eps: [positive]}
          quantities: [Z, U]
          partials: [{of: U, variable: T, held_fixed: [], label: C}]
      source: "C = dU/dT with U = eps/(e^(beta eps) + 1): the Schottky form k (beta eps)^2 e^(beta eps)/(e^(beta eps) + 1)^2"

- id: h2-follow-christoffel-then-ricci-scalar
  category: followup
  prompt: 'The unit 2-sphere has metric diag(1, sin^2 theta) in (theta, phi). Which Christoffel symbols are nonzero?'
  expected_tool: geometry
  args: {includes: {coordinates: [theta, phi], quantities: [christoffel]}}
  expect_card: {status: ok}
  reference:
