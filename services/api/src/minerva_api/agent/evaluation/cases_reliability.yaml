  forbid: [expand_motion]
  tools_optional: true
  max_calls: 3
  expect_card: {status: ok}
  reply_matches: 'theta_1|first angle|first rod|only'
  reference:
    tool: series
    arguments:
      latex: '\frac12 (m_1+m_2) l_1^2 \dot{\theta}_1^2 + \frac12 m_2 l_2^2 \dot{\theta}_2^2 + m_2 l_1 l_2 \dot{\theta}_1 \dot{\theta}_2 \cos(\theta_1-\theta_2) + (m_1+m_2) g l_1 \cos\theta_1 + m_2 g l_2 \cos\theta_2'
