# Issue 137, the whole chat: the three earlier turns are the stored text of the reported conversation (plain history, no
# tool calls), the last one is the user's own wording. "l1 moving as a small angle" names a rod length, not an angle: the
# reply may ask or use the first angle only, and must say which regime it uses; both angles small is a different regime.
- id: double-pendulum-chat-one-small-angle-in-the-users-words
  category: ambiguous
  prompt: 'Can we approximate system if the l1 is moving as a small angle thing'
  history:
    - {role: user, content: 'Whats the lagrangian for a double pendulum'}
    - {role: assistant, content: 'For two point masses $m_1$, $m_2$ on rods of length $l_1$, $l_2$ with angles $\theta_1$, $\theta_2$ from the vertical: $$L = \frac{1}{2}(m_1 + m_2)l_1^2\dot{\theta}_1^2 + \frac{1}{2}m_2l_2^2\dot{\theta}_2^2 + m_2l_1l_2\dot{\theta}_1\dot{\theta}_2\cos(\theta_1-\theta_2) + (m_1+m_2)gl_1\cos\theta_1 + m_2gl_2\cos\theta_2$$ (1)'}
    - {role: user, content: 'What are the symmetries of Equation (1)'}
    - {role: assistant, content: 'L does not depend on time explicitly, so the energy is conserved. It depends on both angles, so neither is cyclic and there is no conserved angular momentum.'}
    - {role: user, content: 'Are there any hidden symmetries?'}
    - {role: assistant, content: 'Within the families searched no further constant of motion was found; that does not show there is none.'}
  expected_tool: series
  also_ok: [approximation]
  forbid: [expand_motion]
  tools_optional: true
  max_calls: 4
  expect_card: {status: ok}
  reply_matches: 'theta_1|first angle|first rod|l_1|only|which'
  reply_forbids: '(?i)both (angles|\$?\\theta)'
  reference:
    tool: series
    arguments:
      latex: '\frac{1}{2}(m_1 + m_2)l_1^2\dot{\theta}_1^2 + \frac{1}{2}m_2l_2^2\dot{\theta}_2^2 + m_2l_1l_2\dot{\theta}_1\dot{\theta}_2\cos(\theta_1-\theta_2) + (m_1+m_2)gl_1\cos\theta_1 + m_2gl_2\cos\theta_2'
      variable: theta_1
      point: '0'
      order: 2
  source: "issue 137 trace: `expand_motion` expands every coordinate at once (both angles small), the user named one small angle; a Taylor series in theta_1 only, or a question about the regime, is the faithful answer"

# Issue 131, the Schwarzschild sequence up to the conserved quantities (metric -> Christoffel -> Lagrangian -> symmetries
# -> conserved quantities; the radial effective potential needs mathematics that is not built yet). The earlier turns are
# plain history written for this case (no tool calls). The last one asks for the conserved quantities of Equation (1) with
# all four coordinates: the answer is `analyze_lagrangian` (cyclic momenta and the energy, each verified), and the reply must
# say which symmetries were tested, never that these are all of them. `find_conserved_quantities` takes four coordinates
# since issue 152 and, t and phi being cyclic, searches the Routh-reduced system of (r, theta) at the default budget
# (the whole system's smallest family has 405 unknown coefficients); it reports the same three constants, so this case
# still expects `analyze_lagrangian` and was not changed. The time symbol is `s` because `t` is a coordinate.
- id: schwarzschild-chat-conserved-quantities-are-scoped
  category: physics
  prompt: 'Which quantities are conserved along the geodesics of Equation (1)? The curve parameter is s and the coordinates are t, r, theta, phi.'
  history:
    - {role: user, content: 'Compute the Christoffel symbols of the metric diag(-(1-2M/r), 1/(1-2M/r), r^2, r^2 sin(theta)^2) in the coordinates t, r, theta, phi.'}
    - {role: assistant, content: 'The geometry tool computed and checked all the Christoffel symbols of this metric; the nonzero ones are listed in its card.'}
    - {role: user, content: 'Now write the geodesic Lagrangian L = 1/2 g_{mu nu} xdot^mu xdot^nu for it.'}
    - {role: assistant, content: 'With the metric above: $$L = \frac{1}{2}\left(-\left(1-\frac{2M}{r}\right)\dot{t}^2 + \frac{\dot{r}^2}{1-2M/r} + r^2\dot{\theta}^2 + r^2\sin^2\theta\,\dot{\phi}^2\right)$$ (1)'}
    - {role: user, content: 'What are the symmetries of Equation (1)?'}
    - {role: assistant, content: 'L does not depend on t or phi explicitly, so those two coordinates are cyclic, and it has no explicit dependence on the curve parameter.'}
  expected_tool: analyze_lagrangian
  args: {includes: {coordinates: [t, r, theta, phi]}}
  max_calls: 4
  expect_card: {status: ok}
  reply_matches: '(?i)(cyclic|tested|searched|families|symmetries)'
  reply_forbids: '(?i)\ball (the )?(conserved|constants)|every conserved|complete (list|set)|no other (conserved|constant)|curvature singularity (at|of) \$?r ?= ?2'
  reference:
    tool: analyze_lagrangian
    arguments:
      lagrangian: '1/2*(-(1-2*M/r)*t_dot^2 + r_dot^2/(1-2*M/r) + r^2*theta_dot^2 + r^2*sin(theta)^2*phi_dot^2)'
      coordinates: [t, r, theta, phi]
      time: s
      format: text
  source: "Schwarzschild geodesics: t and phi are cyclic (p_t = -E, p_phi = L_z) and L has no explicit parameter dependence (energy function); analyze_lagrangian's own checks decide, and it states the symmetries it tested (cyclic, time translation, coordinate-pair rotations); total angular momentum J^2 is not searched there (issue 151), so the reply may not say the list is complete"

# Issue 153: Routh reduction of the Schwarzschild geodesic Lagrangian by the cyclic coordinate t. The held momentum is the
# symbol p_t (the name the Lagrangian card prints), never a value or a renamed E the model picks; the reply must state
# where R holds (the block d^2L/dt_dot^2 = -(1 - 2M/r) is divided by: r = 2M is excluded). No assumption was stated.
- id: schwarzschild-routh-reduction-by-time
  category: physics
  prompt: 'Reduce the Schwarzschild geodesic Lagrangian $L = \frac{1}{2}\left(-\left(1-\frac{2M}{r}\right)\dot{t}^2 + \frac{\dot{r}^2}{1-2M/r} + r^2\dot{\theta}^2 + r^2\sin^2\theta\,\dot{\phi}^2\right)$ by the cyclic coordinate t (Routh reduction). The coordinates are t, r, theta, phi and the curve parameter is s.'
  expected_tool: routh_reduce
  args: {includes: {coordinates: [t, r, theta, phi], cyclic: [t]}, absent: [assumptions]}
  forbid_assumptions: true
  max_calls: 3
  expect_card: {status: ok}
  restrictions_reported: '2\s*M|1\s*-\s*\\frac\{2\s*M\}\{r\}|horizon'
  reply_forbids: '(?i)\bE\s*=\s*-\s*p_\{?t\}?'
  reference:
    tool: routh_reduce
    arguments:
      lagrangian: '1/2*(-(1-2*M/r)*t_dot^2 + r_dot^2/(1-2*M/r) + r^2*theta_dot^2 + r^2*sin(theta)^2*phi_dot^2)'
      coordinates: [t, r, theta, phi]
      time: s
      format: text
      cyclic: [t]
  source: "Routh's procedure (Landau and Lifshitz, Mechanics, section 41; Goldstein, Classical Mechanics, section 8.3): with p_t held fixed R = (r_dot^2/f + r^2 theta_dot^2 + r^2 sin^2(theta) phi_dot^2 + p_t^2/f)/2, f = 1 - 2M/r (issue 153, with E = -p_t)"

# Issue 131, the whole Schwarzschild sequence as one conversation (the closing evaluation of the plan): metric -> Christoffel
# symbols -> geodesic Lagrangian -> Killing vectors and their charges -> Routh reduction by t -> discovery with four
# coordinates. Every turn is really run: each later turn is built from what the earlier answers produced. Two turns pin the
# claim checker on a formula the reply restates: a Christoffel row of the verified `geometry` card (evidence rule
# `same_indexed_label`) and a charge `Q_k` (rule 3, `named_quantity`); a link is never "proved" by itself.
# Not in the sequence: the radial effective potential. It needs the Routhian restricted to theta = pi/2 and rewritten with
# the normalisation g(v, v) = -1 as ONE verified result; the merged tools give the reduction, the normalisation charge,
# `substitute` and `isolate_variable` as separate steps, so no single call produces it and it is not asked here.
# The last turn is `find_conserved_quantities` with four coordinates: it reduces t and phi first (Routh, verified on the
# whole system), lists p_t, p_phi and the energy function as already known, and the reply must say that the total angular
# momentum J^2 is not among the searched families. The single-turn case above is unchanged.
- id: schwarzschild-sequence-metric-to-discovery
  category: physics
  prompt: 'The Schwarzschild metric is diag(-(1-2M/r), 1/(1-2M/r), r^2, r^2 sin(theta)^2) in the coordinates t, r, theta, phi. Give its inverse and its determinant.'
  expected_tool: geometry
  args: {includes: {quantities: [inverse_metric, determinant], coordinates: [t, r, theta, phi]}, absent: [assumptions]}
  forbid_assumptions: true
  max_calls: 2
  expect_card: {status: ok}
  reference:
    tool: geometry
    arguments:
      coordinates: [t, r, theta, phi]
      metric: [['-(1-2*M/r)', '0', '0', '0'], ['0', '1/(1-2*M/r)', '0', '0'], ['0', '0', 'r^2', '0'], ['0', '0', '0', 'r^2*sin(theta)^2']]
      format: text
      quantities: [inverse_metric, determinant]
  source: "Schwarzschild metric: g^{tt} = -1/(1-2M/r), g^{rr} = 1-2M/r, det g = -r^4 sin^2(theta) (any general relativity text); the geometry tool's own numeric legs and symbolic zero decide"
  followups:
    - prompt: 'Now the Christoffel symbols of that metric.'
      expected_tool: geometry
      args: {includes: {quantities: [christoffel], coordinates: [t, r, theta, phi]}, absent: [assumptions]}
      forbid_assumptions: true
      max_calls: 2
      expect_card: {status: ok}
      reference:
        tool: geometry
        arguments:
          coordinates: [t, r, theta, phi]
          metric: [['-(1-2*M/r)', '0', '0', '0'], ['0', '1/(1-2*M/r)', '0', '0'], ['0', '0', 'r^2', '0'], ['0', '0', '0', 'r^2*sin(theta)^2']]
          format: text
          quantities: [christoffel]
      claim_marks:
        - {formula: '\Gamma^{r}{}_{t t} = \frac{M (r - 2 M)}{r^{3}}', status: from_tool, evidence_rule: same_indexed_label}
    - prompt: 'Write the geodesic Lagrangian of that metric, $L = \frac{1}{2} g_{\mu\nu}\dot{x}^\mu\dot{x}^\nu$, and give its equations of motion. The coordinates are t, r, theta, phi and the curve parameter is s.'
      expected_tool: analyze_lagrangian
      args: {includes: {coordinates: [t, r, theta, phi]}, absent: [assumptions]}
      forbid_assumptions: true
      max_calls: 2
      expect_card: {status: ok}
      reference:
        tool: analyze_lagrangian
        arguments:
          lagrangian: '1/2*(-(1-2*M/r)*t_dot^2 + r_dot^2/(1-2*M/r) + r^2*theta_dot^2 + r^2*sin(theta)^2*phi_dot^2)'
          coordinates: [t, r, theta, phi]
          time: s
          format: text
      reply_forbids: '(?i)\ball (the )?(conserved|constants)|every conserved|complete (list|set)|no other (conserved|constant)'
    - prompt: 'Find the Killing vectors of that metric and the quantities conserved along its geodesics that come from them.'
      expected_tool: geometry
      args: {includes: {quantities: [killing_vectors, geodesic_constants], coordinates: [t, r, theta, phi]}, absent: [assumptions]}
      forbid_assumptions: true
      max_calls: 2
      expect_card: {status: ok}
      reference:
        tool: geometry
        arguments:
          coordinates: [t, r, theta, phi]
          metric: [['-(1-2*M/r)', '0', '0', '0'], ['0', '1/(1-2*M/r)', '0', '0'], ['0', '0', 'r^2', '0'], ['0', '0', '0', 'r^2*sin(theta)^2']]
          format: text
          quantities: [killing_vectors, geodesic_constants]
      reply_forbids: '(?i)\ball (the )?(killing|conserved)|no other killing|none exist|complete (list|set)'
      claim_marks:
        - {formula: 'Q_{2} = r^{2} \dot{\phi} \sin^{2}{\left(\theta \right)}', status: from_tool, evidence_rule: named_quantity}
    - prompt: 'Reduce the geodesic Lagrangian of that metric by the cyclic coordinate t (Routh reduction). The coordinates are t, r, theta, phi and the curve parameter is s.'
      expected_tool: routh_reduce
      args: {includes: {coordinates: [t, r, theta, phi], cyclic: [t]}, absent: [assumptions]}
      forbid_assumptions: true
      max_calls: 2
      expect_card: {status: ok}
      restrictions_reported: '2\s*M|1\s*-\s*\\frac\{2\s*M\}\{r\}|horizon'
      reply_forbids: '(?i)\bE\s*=\s*-\s*p_\{?t\}?'
      reference:
        tool: routh_reduce
        arguments:
          lagrangian: '1/2*(-(1-2*M/r)*t_dot^2 + r_dot^2/(1-2*M/r) + r^2*theta_dot^2 + r^2*sin(theta)^2*phi_dot^2)'
          coordinates: [t, r, theta, phi]
          time: s
          format: text
          cyclic: [t]
    - prompt: 'Now search that Lagrangian, with all four coordinates, for any further conserved quantities. The curve parameter is s.'
      expected_tool: find_conserved_quantities
      args: {includes: {coordinates: [t, r, theta, phi]}}
      max_calls: 2
      expect_card: {status: ok}
      reply_matches: '(?i)(J\^2|J\^\{2\}|total angular momentum)'
      reply_forbids: '(?i)\ball (the )?(conserved|constants)|every conserved|complete (list|set)|no other (conserved|constant)'
      reference:
        tool: find_conserved_quantities
        arguments:
          lagrangian: '1/2*(-(1-2*M/r)*t_dot^2 + r_dot^2/(1-2*M/r) + r^2*theta_dot^2 + r^2*sin(theta)^2*phi_dot^2)'
          coordinates: [t, r, theta, phi]
          time: s
          format: text
  source: "Schwarzschild geodesics: t and phi are cyclic (p_t = -E, p_phi = L_z), the Killing vectors d_t, d_phi and the three rotations give charges, Routh reduction by t leaves a Routhian in the held p_t (Landau and Lifshitz, Mechanics, section 41); the engine's own checks decide each turn; total angular momentum J^2 is a quadratic combination of the rotation charges and is not in the families discovery searches"

- id: answer-without-thinking-aloud
  category: ambiguous
  prompt: 'Whats the tautochrone problem, in two sentences?'
  expected_tool: none
  # A reply that reasons in public ("Wait--", "Actually,", "Hmm") shows a conclusion and then retracts it.
  reply_forbids: '(^|[.!?]\s+|\*\*|\n)\s*(wait|actually|hmm|hold on)\b[\s,:;\u2014-]'
  source: "system prompt: write only the final answer, never think aloud in the reply"
# ----------------------------------------------------------------------------- notation the backend reads
# What a model writes is not always what the engine reads. These cases ask for ordinary things; the models
# that write the velocities as `Xdot`, a text form in a LaTeX field or markdown-escaped operators must still
# get a verified result without a round trip (the loop reads them, see docs/agent-reliability.md). The
# reference call is the canonical one; the corruption test (`make eval-corruptions`) applies the mistakes.

- id: spelled-velocities-are-read
  category: physics
  prompt: 'A block of mass m slides on a wedge of mass M inclined at angle alpha, in a uniform field g. With the wedge at (X, Y) and the block a distance s along the incline, the Lagrangian is $\frac12 (M+m)(\dot{X}^2+\dot{Y}^2) + \frac12 m\dot{s}^2 + m\dot{s}(\dot{X}\cos\alpha + \dot{Y}\sin\alpha) - (M+m) g Y - m g s\sin\alpha$. Find the equations of motion.'
  expected_tool: analyze_lagrangian
  args: { includes: { coordinates: [X, Y, s] } }
  expect_card: { status: ok }
  reference:
    tool: analyze_lagrangian
    arguments:
      lagrangian: "(M+m)*(X_dot^2 + Y_dot^2)/2 + m*s_dot^2/2 + m*s_dot*(X_dot*cos(alpha) + Y_dot*sin(alpha)) - (M+m)*g*Y - m*g*s*sin(alpha)"
      coordinates: [X, Y, s]
      format: text
  source: "mass matrix [[M+m,0,m cos a],[0,M+m,m sin a],[m cos a,m sin a,m]] has determinant M m (M+m); solving gives X'' = 0, Y'' = -g, s'' = 0 (by hand)"

- id: text-form-in-a-latex-field
  category: symbolic
  prompt: 'Simplify $\sin^2 x + \cos^2 x$.'
  expected_tool: simplify
  args: { absent: [assumptions] }
  expect_card: { status: ok, result_text: "1" }
  reference: { tool: simplify, arguments: { latex: '\sin(x)^2 + \cos(x)^2' } }
  source: "the Pythagorean identity (DLMF 4.21.1); the answer is 1 whichever way the input is spelled"

- id: escaped-operators-in-a-derivative
  category: calculus
  prompt: 'Differentiate $x^2 \sin x$ with respect to x.'
  expected_tool: differentiate
  args: { includes: { variables: [{ name: x }] } }
  expect_card: { status: ok, result_text: "x**2*cos(x) + 2*x*sin(x)" }
  reference:
    tool: differentiate
    arguments: { latex: 'x^{2} \sin(x)', variables: [{ name: x, order: 1 }] }
  source: "product rule by hand: (x^2 sin x)' = 2x sin x + x^2 cos x"

# --- workflows with no live coverage before (added with the trace export; see docs/reliability/) -----------
- id: assumption-added-then-dropped-in-followups
  category: followup
  prompt: 'Simplify $\sqrt{x^2}$.'
  expected_tool: simplify
  args: {absent: [assumptions]}
  forbid_assumptions: true
  expect_card: {status: conditions_not_satisfied}
  reference: {tool: simplify, arguments: {latex: '\sqrt{x^2}'}}
  source: "AGENTS.md (symbols are complex unless declared): sqrt(x^2) is |x| only for real x, x only for x >= 0"
  followups:
    # The user now states an assumption; it must reach the tool, and with it the result is different.
    - prompt: 'Now assume x is positive and simplify it again.'
      expected_tool: simplify
      args: {assumes: {x: positive}}
      expect_card: {status: unchanged, result_text: "x"}
      reference: {tool: simplify, arguments: {latex: '\sqrt{x^2}', assumptions: {x: [positive]}}}
    # ... and when the user takes it back, it must not linger in the next call.
    - prompt: 'Forget that: x is an arbitrary complex number again. Simplify it once more.'
      expected_tool: simplify
      args: {absent: [assumptions]}
      forbid_assumptions: true
      expect_card: {status: conditions_not_satisfied}
      reference: {tool: simplify, arguments: {latex: '\sqrt{x^2}'}}

- id: oscillator-equations-of-motion-then-conserved-quantity
  category: followup
  prompt: 'Derive the equations of motion for $L = \frac12 m \dot{x}^2 - \frac12 k x^2$ with the coordinate x.'
  expected_tool: analyze_lagrangian
  args: {includes: {coordinates: [x]}}
  expect_card: {status: ok}
  reference:
    tool: analyze_lagrangian
    arguments: {lagrangian: '\frac12 m \dot{x}^2 - \frac12 k x^2', coordinates: [x]}
  source: "textbook: m x'' = -k x"
  followups:
    - prompt: 'What is conserved for this Lagrangian?'
      expected_tool: find_conserved_quantities
      also_ok: [analyze_lagrangian, search_invariants]
      args: {includes: {coordinates: [x]}}
      expect_card: {status: ok}
      reference:
        tool: find_conserved_quantities
        arguments: {lagrangian: '\frac12 m \dot{x}^2 - \frac12 k x^2', coordinates: [x]}
      reply_forbids: 'no other|has no more|completely integrable|fully integrable'

# Issue #184: "what are the units of C_3?" had no tool path. The model sent the quantity being asked about as
# `{"name": "C_3", "unit": null}` and a kind that is not in the table, was refused, repeated the call and ended at
# `repeated_calls`. Now the asked-for names go in `unknown`, the dimension is found from the equation and the units of
# the other symbols, and a unit the user never stated is labelled "assumed". The names C_1..C_4 are fixed by the
# first prompt, as in the Kepler case above.
- id: kepler-constant-then-its-units
  category: followup
  prompt: 'Find the hidden conserved quantities of the Kepler system $L = \frac12 m (\dot{r}^2 + r^2 \dot{\theta}^2) + \frac{k}{r}$ with coordinates r and theta. List them as C_1, C_2, C_3, C_4.'
  expected_tool: find_conserved_quantities
  args: {includes: {coordinates: [r, theta]}}
  max_calls: 2
  expect_card: {status: ok}
  reference:
    tool: find_conserved_quantities
    arguments:
      lagrangian: '\frac12 m (\dot{r}^2 + r^2 \dot{\theta}^2) + \frac{k}{r}'
      coordinates: [r, theta]
      budget: thorough
  source: "Kepler: energy, angular momentum and two components of the Laplace-Runge-Lenz vector (Goldstein, Classical Mechanics, ch. 3)"
  followups:
    - prompt: 'What are the units of C_3? in Equation (3)'
      expected_tool: check_units
      forbid: [dimensional_analysis]
      args: {present: [unknown], includes: {unknown: [C_3]}}
      expect_card: {status: ok}
      # By hand: m r^3 thetadot^2 is kg m^3 s^-2 (radians are dimensionless), and C_3 and k are terms of one sum.
      # The user gave no units, so the reply must say they were assumed.
      reply_matches: '(?is)(?=.*assum)(?=.*kg.{0,25}m.{0,8}3.{0,25}s.{0,8}-2)'
      reference:
        tool: check_units
        arguments:
          equation: 'C_{3} = - k \cos{\theta} + m r^{3} \dot{\theta}^{2} \cos{\theta} + m r^{2} \dot{r} \dot{\theta} \sin{\theta}'
          quantities: [{name: m, unit: kg}, {name: r, unit: m}, {name: theta, unit: rad}]
          unknown: [C_3, k]
