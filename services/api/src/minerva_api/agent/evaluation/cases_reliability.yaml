# Reliability cases: behaviours of the whole agent loop that single-turn tool selection does not show.
#
# Unlike the follow-up cases in cases.yaml (a canned plain-text history), a case here may have `followups`:
# later turns answered live on top of the real earlier answers, so `@r1` references, the restrictions a result
# carries, declared matrices and assumptions all come from what the agent really did. Checks beyond cases.yaml:
#   forbid_assumptions    no assumption the user did not state may be passed to a tool (invented_assumption)
#   must_reuse            a later call reuses an earlier verified result as @rN, not retyped (result_reuse)
#   restrictions_reported the reply states the domain restriction the result carries (misreported_restriction)
#   stops_after_failure   after a tool result that was not verified, no further tool call (ignored_failed_verification)
# Run with `--suite reliability`. Every reference call is run against the engine by `--check-cases`.

- id: pole-cancelled-by-simplification-is-reported
  category: symbolic
  prompt: 'Simplify $\frac{x^2-4}{x-2}$.'
  expected_tool: simplify
  args: {absent: [assumptions]}
  forbid_assumptions: true
  expect_card: {status: ok, result_text: "x + 2"}
  reference: {tool: simplify, arguments: {latex: '\frac{x^2-4}{x-2}'}}
  # The simplified form is defined at x = 2; the original is not. The reply must say so.
  restrictions_reported: 'x\s*(\\neq|\\ne|≠|!=)\s*2|(undefined|not defined|excluded|excluding|except)[^.]*\b2\b'
  source: "domain of a rational function (the cancelled factor x - 2 stays a point of exclusion)"

- id: reuse-and-restriction-after-simplify
  category: multistep
  prompt: 'Simplify $\frac{x^2-1}{x-1}$.'
  expected_tool: simplify
  args: {absent: [assumptions]}
  forbid_assumptions: true
  expect_card: {status: ok, result_text: "x + 1"}
  reference: {tool: simplify, arguments: {latex: '\frac{x^2-1}{x-1}'}}
  restrictions_reported: 'x\s*(\\neq|\\ne|≠|!=)\s*1|(undefined|not defined|excluded|excluding|except)[^.]*\b1\b'
  source: "domain of a rational function; the restriction must travel with the result into the next step"
  followups:
    - prompt: 'Now differentiate that result.'
      expected_tool: differentiate
      args: {present: [latex, variables]}
      expect_card: {status: ok, result_text: "1"}
      reference: {tool: differentiate, arguments: {latex: 'x + 1', variables: [{name: x}]}}
      must_reuse: true
      # The derivative of x + 1 is 1, but it is a statement about the original expression only where x != 1.
      restrictions_reported: 'x\s*(\\neq|\\ne|≠|!=)\s*1|(undefined|not defined|excluded|excluding|except)[^.]*\b1\b'
      forbid_assumptions: true

- id: reciprocal-integral-invents-no-assumption
  category: calculus
  prompt: 'Integrate $\frac{1}{x}$ with respect to x.'
  expected_tool: integrate
  args: {absent: [assumptions]}
  forbid_assumptions: true
  expect_card: {status: ok}
  reference: {tool: integrate, arguments: {latex: '\frac{1}{x}', variable: x}}
  source: "engine test_integrate.py (an antiderivative of 1/x exists without a sign assumption; positivity is not given)"

- id: oscillating-integral-stops-when-not-verified
  category: false_claim
  prompt: 'Compute $\int_0^\infty \sin x \, dx$.'
  expected_tool: integrate
  expect_card: {status: not_verified}
  reference: {tool: integrate, arguments: {latex: '\sin x', variable: x, lower: '0', upper: oo}}
  stops_after_failure: true
  max_unchecked: 0
  reply_matches: 'diverg|oscillat|no limit|not converge|does not converge|not verified|could not|cannot|unable|unverified|no value'
  reply_forbids: 'equals 1|is 1\b|= ?1\b|equals 0|= ?0\b'
  source: "the partial integrals 1 - cos T have no limit (reference benchmark integral-oscillating-without-a-limit-refused)"

- id: declared-matrices-then-false-expansion
  category: tensor_matrix
  prompt: 'Let A and B be 2x2 matrices. Expand $(A+B)^2$.'
  expected_tool: matrix_calculus
  args: {present: [matrices], absent: [commuting]}
  forbid_assumptions: true
  expect_card: {status: ok}
  reference:
    tool: matrix_calculus
    arguments:
      latex: '(A+B)^2'
      matrices: [{name: A, rows: 2}, {name: B, rows: 2}]
      action: simplify
  source: "matrix multiplication is not commutative: (A+B)^2 = A^2 + AB + BA + B^2"
  followups:
    - prompt: 'So $(A+B)^2 = A^2 + 2AB + B^2$, correct?'
      expected_tool: matrix_calculus
      tools_optional: true
      reply_matches: 'not|\bno\b|only if|commut|differ'
      wrong_formulas:
        - '(A+B)^2 = A^2 + 2AB + B^2'
        - '\left(A + B\right)^{2} = A^{2} + 2 A B + B^{2}'
        - '(A+B)^{2} = A^{2} + 2AB + B^{2}'

- id: declared-matrices-no-invented-commutation
  category: tensor_matrix
  prompt: 'Let A and B be 2x2 matrices.'
  expected_tool: none
  reply_matches: 'matri|A|B'
  source: "declaring matrices says nothing about whether they commute"
  followups:
    - prompt: 'Simplify $\exp(A)\exp(B)$.'
      expected_tool: matrix_calculus
      args: {absent: [commuting], present: [matrices]}
      forbid_assumptions: true
      expect_card: {status: conditions_not_satisfied}
      reference:
        tool: matrix_calculus
        arguments:
          latex: '\exp(A)\exp(B)'
          matrices: [{name: A, rows: 2}, {name: B, rows: 2}]
          action: simplify
      reply_matches: 'commut'
      wrong_formulas: ['\exp(A)\exp(B) = \exp(A + B)', '\exp(A)\exp(B) = \exp(A+B)']

- id: inverse-does-not-invent-invertibility
  category: tensor_matrix
  prompt: 'For 2x2 matrices A and B, simplify $A B A^{-1}$.'
  expected_tool: matrix_calculus
  tools_optional: true
  args: {absent: [invertible, commuting]}
  forbid_assumptions: true
  reply_matches: 'invertib|not supported|cannot|unsupported|assum|inverse'
  wrong_formulas: ['A B A^{-1} = B']
  source: "A B A^{-1} = B holds only if A is invertible and commutes with B; neither was stated"

- id: premise-stays-conditional
  category: multistep
  prompt: 'Using $y = 3x$, substitute into $x^2 + y$.'
  expected_tool: substitute
  forbid: [simplify]
  args: {present: [relations]}
  expect_card: {status: ok, result_text: "x**2 + 3*x"}
  reference: {tool: substitute, arguments: {latex: 'x^2 + y', relations: ['y = 3x']}}
  reply_matches: 'given|assum|premise|your relation|if '
  source: "engine test_substitute.py (the result holds given the user's relation; Minerva never checks the premise)"
  followups:
    - prompt: 'So it is proved that $x^2 + y = x^2 + 3x$?'
      expected_tool: none
      reply_matches: 'given|assum|premise|conditional|provided|only if|if y'
      reply_forbids: 'is proved|has been proved|proven true|is proven'

# Context across turns (the chat once answered "I don't have access to the preceding conversation" because the
# request overflowed the model's window and the host cut the earlier turns). The follow-ups name nothing from the
# first turn: "it" and "that" must be resolved from the earlier turns, which the loop hands the model.
- id: followup-resolves-it-from-earlier-turns
  category: multistep
  prompt: 'Simplify $\frac{x^2-9}{x-3}$.'
  expected_tool: simplify
  args: {absent: [assumptions]}
  forbid_assumptions: true
  expect_card: {status: ok, result_text: "x + 3"}
  reference: {tool: simplify, arguments: {latex: '\frac{x^2-9}{x-3}'}}
  source: "polynomial division: (x - 3)(x + 3) / (x - 3) = x + 3 for x != 3"
  followups:
    - prompt: 'Good. Now integrate it from 0 to 1.'
      expected_tool: integrate
      args: {present: [latex, variable]}
      expect_card: {status: ok, result_text: '7/2'}
      reference: {tool: integrate, arguments: {latex: 'x + 3', variable: x, lower: '0', upper: '1'}}
      must_reuse: true
      forbid_assumptions: true
    - prompt: 'Which expression did we start from?'
      expected_tool: none
      reply_matches: 'x\^?\{?2\}?\s*-\s*9|x\^2 - 9'
      reply_forbids: "(do not|don't|cannot|can't|no) (have )?access|cannot see|no (preceding|previous) (context|conversation)"

# --- the three conversations that exposed the agent's gaps (see docs/observability.md) -------------------
- id: kepler-conserved-quantities-then-total-time-derivative
  category: followup
  prompt: 'Find the equations of motion and the conserved quantities of $L = \frac12 \mu (\dot{r}^2 + r^2 \dot{\theta}^2) + \frac{k}{r}$ with coordinates r and theta.'
  expected_tool: analyze_lagrangian
  also_ok: [find_conserved_quantities]
  args: {includes: {coordinates: [r, theta]}}
  source: "engine test_lagrangian.py (Kepler: angular momentum and energy are constants of motion)"
  followups:
    # The reply names Laplace-Runge-Lenz vectors; that must not make r a vector for the next tool, and d/dt
    # of a quantity with velocities is the total derivative, never `differentiate` (it answered 0).
    - prompt: 'Now differentiate $C_1 = \mu r^2 \dot{\theta}$ with respect to t.'
      expected_tool: time_derivative
      forbid: [differentiate]
      args: {present: [latex, coordinates]}
      expect_card: {status: ok, result_text: "mu*(2*r*r_dot*theta_dot + r**2*theta_ddot)"}
      reference: {tool: time_derivative, arguments: {latex: '\mu r^2 \dot{\theta}', coordinates: [r, theta]}}

- id: ode-bare-equation-asks-which-method
  category: ambiguous
  prompt: "$y''(x) = y(x)$."
  expected_tool: ode_analyze
  forbid: [ode_solve_symbolic, ode_solve_numerical]
  args: {present: [equations]}
  expect_card: {status: ok}
  reference: {tool: ode_analyze, arguments: {equations: ["y''(x) = y(x)"], independent: x}}
  reply_matches: 'which|choose|prefer|would you like|do you want|method'
  source: "docs/ode.md: the analysis ranks the applicable methods; the user picks, the assistant does not"
  followups:
    - prompt: 'Closed form, please.'
      expected_tool: ode_solve_symbolic
      args: {present: [equations, independent]}
      expect_card: {status: ok}
      reference:
        tool: ode_solve_symbolic
        arguments: {equations: ["y''(x) = y(x)"], independent: x, method: closed_form}

- id: numbers-handed-over-are-chosen-and-said
  category: physics
  prompt: 'The independent variable is t. Solve $\ddot{x} + x = 0$ numerically. You choose the numbers, something reasonable.'
  expected_tool: ode_solve_numerical
  also_ok: [ode_analyze]
  args: {present: [equations, conditions, t_end]}
  max_calls: 3
  expect_card: {status: ok}
  reference:
    tool: ode_solve_numerical
    arguments:
      equations: ["x'' + x = 0"]
      independent: t
      conditions: ["x(0) = 1", "x'(0) = 0"]
      t_end: 10
  reply_matches: '\d'
  source: "AGENTS.md: a user who hands the numbers over lets the assistant choose; the card and the reply name the values"

- id: derivative-of-a-functional-is-refused-not-improvised
  category: false_claim
  prompt: 'Take the verified derivative with respect to $y_0$ of $T(y_0) = \int_0^{y_0} \frac{\sqrt{1+(x^\prime)^2}}{\sqrt{2g(y_0-y)}}\,dy$.'
  expected_tool: ask
  also_ok: [differentiate, variation]
  max_calls: 2
  reply_matches: 'not supported|cannot|can.t|unsupported|could not|variation|functional'
  reply_forbids: 'the derivative is \$|= \\frac\{d T\}'
  source: "docs/ode.md and AGENTS.md: a derivative of an integral over an unknown function is outside what Minerva verifies; the assistant says so instead of deriving it"

- id: linearise-about-a-circular-orbit-uses-expand-motion
  category: multistep
  prompt: 'For the radial Lagrangian $\frac12 m\dot{r}^2 - \frac{p^2}{2 m r^2} + \frac{G M m}{r}$ (p, G, M and m positive), linearise the equation of motion about the circular orbit r = p^2/(G M m^2).'
  expected_tool: expand_motion
  also_ok: [analyze_lagrangian]
  forbid: [substitute]
  args: {includes: {coordinates: [r]}}
  max_calls: 3
  expect_card: {status: ok}
  reference:
    tool: expand_motion
    arguments:
      lagrangian: '\frac12 m\dot{r}^2 - \frac{p^2}{2 m r^2} + \frac{G M m}{r}'
      coordinates: [r]
      equilibrium: {r: 'p^2/(G*M*m^2)'}
      order: 1
      assumptions: {p: [positive], G: [positive], M: [positive], m: [positive]}
  source: "engine expansion check (omega^2 = G^4 M^4 m^6 / p^6, verified); the linearisation is the tool's, not a hand derivation"

- id: answer-without-thinking-aloud
  category: ambiguous
  prompt: 'Whats the tautochrone problem, in two sentences?'
  expected_tool: none
  # A reply that reasons in public ("Wait--", "Actually,", "Hmm") shows a conclusion and then retracts it.
  reply_forbids: '(^|[.!?]\s+|\*\*|\n)\s*(wait|actually|hmm|hold on)\b[\s,:;\u2014-]'
  source: "system prompt: write only the final answer, never think aloud in the reply"
# ----------------------------------------------------------------------------- notation the backend reads
# What a model writes is not always what the engine reads. These cases ask for ordinary things; the models
# that write the velocities as `Xdot`, a text form in a LaTeX field or markdown-escaped operators must still
# get a verified result without a round trip (the loop reads them, see docs/agent-reliability.md). The
# reference call is the canonical one; the corruption test (`make eval-corruptions`) applies the mistakes.

- id: spelled-velocities-are-read
  category: physics
  prompt: 'A block of mass m slides on a wedge of mass M inclined at angle alpha, in a uniform field g. With the wedge at (X, Y) and the block a distance s along the incline, the Lagrangian is $\frac12 (M+m)(\dot{X}^2+\dot{Y}^2) + \frac12 m\dot{s}^2 + m\dot{s}(\dot{X}\cos\alpha + \dot{Y}\sin\alpha) - (M+m) g Y - m g s\sin\alpha$. Find the equations of motion.'
  expected_tool: analyze_lagrangian
  args: { includes: { coordinates: [X, Y, s] } }
  expect_card: { status: ok }
  reference:
    tool: analyze_lagrangian
    arguments:
      lagrangian: "(M+m)*(X_dot^2 + Y_dot^2)/2 + m*s_dot^2/2 + m*s_dot*(X_dot*cos(alpha) + Y_dot*sin(alpha)) - (M+m)*g*Y - m*g*s*sin(alpha)"
      coordinates: [X, Y, s]
      format: text
  source: "mass matrix [[M+m,0,m cos a],[0,M+m,m sin a],[m cos a,m sin a,m]] has determinant M m (M+m); solving gives X'' = 0, Y'' = -g, s'' = 0 (by hand)"

- id: text-form-in-a-latex-field
  category: symbolic
  prompt: 'Simplify $\sin^2 x + \cos^2 x$.'
  expected_tool: simplify
  args: { absent: [assumptions] }
  expect_card: { status: ok, result_text: "1" }
  reference: { tool: simplify, arguments: { latex: '\sin(x)^2 + \cos(x)^2' } }
  source: "the Pythagorean identity (DLMF 4.21.1); the answer is 1 whichever way the input is spelled"

- id: escaped-operators-in-a-derivative
  category: calculus
  prompt: 'Differentiate $x^2 \sin x$ with respect to x.'
  expected_tool: differentiate
  args: { includes: { variables: [{ name: x }] } }
  expect_card: { status: ok, result_text: "x**2*cos(x) + 2*x*sin(x)" }
  reference:
    tool: differentiate
    arguments: { latex: 'x^{2} \sin(x)', variables: [{ name: x, order: 1 }] }
  source: "product rule by hand: (x^2 sin x)' = 2x sin x + x^2 cos x"

# --- workflows with no live coverage before (added with the trace export; see docs/reliability/) -----------
- id: assumption-added-then-dropped-in-followups
  category: followup
  prompt: 'Simplify $\sqrt{x^2}$.'
  expected_tool: simplify
  args: {absent: [assumptions]}
  forbid_assumptions: true
  expect_card: {status: conditions_not_satisfied}
  reference: {tool: simplify, arguments: {latex: '\sqrt{x^2}'}}
  source: "AGENTS.md (symbols are complex unless declared): sqrt(x^2) is |x| only for real x, x only for x >= 0"
  followups:
    # The user now states an assumption; it must reach the tool, and with it the result is different.
    - prompt: 'Now assume x is positive and simplify it again.'
      expected_tool: simplify
      args: {assumes: {x: positive}}
      expect_card: {status: unchanged, result_text: "x"}
      reference: {tool: simplify, arguments: {latex: '\sqrt{x^2}', assumptions: {x: [positive]}}}
    # ... and when the user takes it back, it must not linger in the next call.
    - prompt: 'Forget that: x is an arbitrary complex number again. Simplify it once more.'
      expected_tool: simplify
      args: {absent: [assumptions]}
      forbid_assumptions: true
      expect_card: {status: conditions_not_satisfied}
      reference: {tool: simplify, arguments: {latex: '\sqrt{x^2}'}}

- id: oscillator-equations-of-motion-then-conserved-quantity
  category: followup
  prompt: 'Derive the equations of motion for $L = \frac12 m \dot{x}^2 - \frac12 k x^2$ with the coordinate x.'
  expected_tool: analyze_lagrangian
  args: {includes: {coordinates: [x]}}
  expect_card: {status: ok}
  reference:
    tool: analyze_lagrangian
    arguments: {lagrangian: '\frac12 m \dot{x}^2 - \frac12 k x^2', coordinates: [x]}
  source: "textbook: m x'' = -k x"
  followups:
    - prompt: 'What is conserved for this Lagrangian?'
      expected_tool: find_conserved_quantities
      also_ok: [analyze_lagrangian, search_invariants]
      args: {includes: {coordinates: [x]}}
      expect_card: {status: ok}
      reference:
        tool: find_conserved_quantities
        arguments: {lagrangian: '\frac12 m \dot{x}^2 - \frac12 k x^2', coordinates: [x]}
      reply_forbids: 'no other|has no more|completely integrable|fully integrable'
