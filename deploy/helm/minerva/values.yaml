# Defaults are generic. Deployment-specific settings (hostnames, node placement, pull secrets) are
# supplied at deploy time (--set / extra values file / repository variables), never committed.
requireDigests: false        # production overlay turns this on: images are deployed by digest
imagePullSecrets: []         # e.g. [{ name: ghcr-pull }] when the images are private
existingSecret: minerva-secrets   # keys: postgres-password, session-secret (created by hand)

hosts:                       # public hostnames, used for CORS/origin checks and documentation comments
  site: ""
  app: ""

placement:                   # node names to keep pods off (cluster specific; pass via extra values)
  statelessAvoidNodes: []
  statefulAvoidNodes: []

api:
  image: { repository: ghcr.io/oscarjhernandez/minerva-api, tag: "", digest: "" }
  allowRegistration: true
  # Header with the real client IP, set by a proxy you control (Cloudflare sets cf-connecting-ip).
  # Empty = use the socket peer, which behind the web proxy is one shared address.
  trustedIpHeader: ""
  compute: { timeoutSeconds: 10, memoryMb: 1024, maxConcurrency: 4 }
  # Chat model. "off" disables chat; "ollama" uses your own Ollama-compatible host. The host address is
  # deployment specific: pass it through extra values (HELM_EXTRA_VALUES), never commit it.
  # mode is the DEFAULT provider: off | ollama | openrouter. Ollama (baseUrl + model) stays available next
  # to OpenRouter, so users can switch in the chat UI without a redeploy.
  llm:
    mode: "off"
    baseUrl: ""
    model: ""
    timeoutSeconds: 120
    think: false
    stripThinking: false
    # OpenRouter (cloud). API key VALUES never go in values: set existingSecret to the NAME of a Kubernetes
    # Secret (separate from minerva-secrets) holding the operator key; the chart refuses an `apiKey` field.
    openrouter:
      model: ""               # default model id, e.g. openai/gpt-4.1-mini (required when mode=openrouter)
      models: []              # models offered in the UI; empty = the application's built-in short list
      byok: false             # let users paste their own key in the chat UI (preferred for public sites)
      existingSecret: ""      # e.g. minerva-openrouter (key: api-key); empty = no operator key
      secretKey: api-key
      keyUsers: ""            # comma-separated emails allowed to spend the operator key; "*" = all signed-in users
      dailyTurns: 50          # per-user cap on the operator key
      maxTokens: 4096
      dataCollection: deny    # deny | allow (asks OpenRouter to route only to providers that do not store prompts)
      zdr: false              # only zero-data-retention endpoints (fewer models)
      timeoutSeconds: 120
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }

web:
  image: { repository: ghcr.io/oscarjhernandez/minerva-web, tag: "", digest: "" }
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }

site:
  image: { repository: ghcr.io/oscarjhernandez/minerva-site, tag: "", digest: "" }
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }

postgres:
  image: postgres:17-alpine
  storage: 5Gi
  storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

cloudflared:                 # one tunnel pod; routing lives in the Cloudflare infrastructure repository
  enabled: false
  image: cloudflare/cloudflared:2026.10.6
  tokenSecret: cloudflared-token
  tokenKey: token
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }
