apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "minerva.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "minerva.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports: [{ port: 8100, targetPort: 8100, name: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "minerva.labels" . | nindent 4 }}
spec:
  replicas: 1   # rate limits are per process; scale out only after moving them to a shared store
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "minerva.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "minerva.selector" (dict "root" . "component" "api") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "minerva.affinity" (dict "ctx" . "stateful" false) | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: {{ include "minerva.image" (dict "image" .Values.api.image "root" .) }}
          {{- include "minerva.containerSecurity" . | nindent 10 }}
          ports: [{ containerPort: 8100, name: http }]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: postgres-password } }
            - name: MINERVA_DATABASE_URL
              value: postgresql+psycopg://minerva:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgres:5432/minerva
            - name: MINERVA_SESSION_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: session-secret } }
            - { name: MINERVA_ENV, value: production }
            - { name: MINERVA_COOKIE_SECURE, value: "true" }
            - name: MINERVA_ALLOWED_ORIGINS
              value: {{ if .Values.hosts.app }}{{ printf "https://%s" .Values.hosts.app | quote }}{{ else }}""{{ end }}
            - { name: MINERVA_TRUSTED_IP_HEADER, value: {{ .Values.api.trustedIpHeader | quote }} }
            - { name: MINERVA_ALLOW_REGISTRATION, value: {{ .Values.api.allowRegistration | quote }} }
            - { name: MINERVA_COMPUTE_TIMEOUT_SECONDS, value: {{ .Values.api.compute.timeoutSeconds | quote }} }
            - { name: MINERVA_COMPUTE_MEMORY_MB, value: {{ .Values.api.compute.memoryMb | quote }} }
            - { name: MINERVA_COMPUTE_MAX_CONCURRENCY, value: {{ .Values.api.compute.maxConcurrency | quote }} }
            {{- /* Mirrors the startup checks in settings.py; "scripted" is development only and is refused here. */}}
            {{- $llm := .Values.api.llm }}
            {{- if not (has $llm.mode (list "off" "ollama")) }}{{ fail (printf "api.llm.mode must be off or ollama, got %q" $llm.mode) }}{{ end }}
            {{- if eq $llm.mode "ollama" }}{{ $_ := required "api.llm.baseUrl is required when api.llm.mode=ollama" $llm.baseUrl }}{{ $_ := required "api.llm.model is required when api.llm.mode=ollama" $llm.model }}{{ end }}
            - { name: MINERVA_LLM_MODE, value: {{ $llm.mode | quote }} }
            - { name: MINERVA_LLM_BASE_URL, value: {{ $llm.baseUrl | quote }} }
            - { name: MINERVA_LLM_MODEL, value: {{ $llm.model | quote }} }
            - { name: MINERVA_LLM_TIMEOUT_SECONDS, value: {{ $llm.timeoutSeconds | quote }} }
            - { name: MINERVA_LLM_THINK, value: {{ $llm.think | quote }} }
            - { name: MINERVA_LLM_STRIP_THINKING, value: {{ $llm.stripThinking | quote }} }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20, failureThreshold: 6 }
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 3, failureThreshold: 40 }
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 256Mi } }]
