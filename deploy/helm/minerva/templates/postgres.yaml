apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "minerva.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "minerva.selector" (dict "root" . "component" "postgres") | nindent 4 }}
  ports: [{ port: 5432, name: pg }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "minerva.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "minerva.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "minerva.selector" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "minerva.affinity" (dict "ctx" . "stateful" true) | nindent 6 }}
      securityContext: { fsGroup: 70, runAsUser: 70, runAsGroup: 70, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          ports: [{ containerPort: 5432, name: pg }]
          env:
            - { name: POSTGRES_USER, value: minerva }
            - { name: POSTGRES_DB, value: minerva }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: postgres-password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe: { exec: { command: ["pg_isready", "-U", "minerva"] }, periodSeconds: 10 }
          livenessProbe: { exec: { command: ["pg_isready", "-U", "minerva"] }, periodSeconds: 20, failureThreshold: 6 }
          resources: {{ toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.storageClass }}
        storageClassName: {{ .Values.postgres.storageClass | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
