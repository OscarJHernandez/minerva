apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-site
  labels:
    {{- include "minerva.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "minerva.selector" (dict "root" . "component" "site") | nindent 4 }}
  ports: [{ port: 80, targetPort: 8080, name: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-site
  labels:
    {{- include "minerva.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "minerva.selector" (dict "root" . "component" "site") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "minerva.selector" (dict "root" . "component" "site") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "minerva.affinity" (dict "ctx" . "stateful" false) | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: site
          image: {{ include "minerva.image" (dict "image" .Values.site.image "root" .) }}
          {{- include "minerva.containerSecurity" . | nindent 10 }}
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20 }
          resources: {{ toYaml .Values.site.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
        - { name: cache, emptyDir: { sizeLimit: 64Mi } }
