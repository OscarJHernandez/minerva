apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "minerva.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "minerva.selector" (dict "root" . "component" "web") | nindent 4 }}
  ports: [{ port: 80, targetPort: 3000, name: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "minerva.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "minerva.selector" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "minerva.selector" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "minerva.affinity" (dict "ctx" . "stateful" false) | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: {{ include "minerva.image" (dict "image" .Values.web.image "root" .) }}
          {{- include "minerva.containerSecurity" . | nindent 10 }}
          ports: [{ containerPort: 3000, name: http }]
          env:
            - { name: MINERVA_API_URL, value: "http://{{ .Release.Name }}-api:8100" }
          readinessProbe: { httpGet: { path: /login, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /login, port: http }, periodSeconds: 20, failureThreshold: 6 }
          resources: {{ toYaml .Values.web.resources | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 128Mi } }]
