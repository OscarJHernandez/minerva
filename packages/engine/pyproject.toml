[project]
name = "minerva-engine"
version = "0.1.0"
description = "Minerva symbolic computation engine (SymPy backend, sandboxed execution)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["sympy>=1.14,<1.15", "pydantic>=2.14,<3", "lark>=1.3,<2", "mpmath>=1.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minerva_engine"]
