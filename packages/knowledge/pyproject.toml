[project]
name = "minerva-knowledge"
version = "0.1.0"
description = "Minerva mathematical knowledge base: curated entries, validation, FTS5 retrieval"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["minerva-engine", "pydantic>=2.14,<3", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minerva_knowledge"]
