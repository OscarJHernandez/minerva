- id: method.mech.euler_lagrange
  title: Euler–Lagrange equations
  kind: method
  chapter: physics.mechanics
  section: variational
  verification: stated
  applies_to: ["lagrangian"]
  validity: "Lagrangian L(q, q̇, t) with generalised coordinates q_i; holonomic constraints already eliminated."
  statement_latex: '\frac{d}{dt}\frac{\partial L}{\partial \dot q_i}-\frac{\partial L}{\partial q_i}=0'
  notes: "Minerva evaluates this symbolically with the total time derivative acting on q, q̇ and t."
  keywords: [euler lagrange, equations of motion, lagrangian, variational, action]
- id: method.mech.cyclic_coordinate
  title: Cyclic coordinate and conserved momentum
  kind: theorem
  chapter: physics.mechanics
  section: variational
  verification: stated
  applies_to: ["lagrangian:cyclic"]
  validity: "A coordinate q_i that does not appear in L (only its velocity does)."
  statement_latex: '\frac{\partial L}{\partial q_i}=0 \;\Longrightarrow\; p_i=\frac{\partial L}{\partial \dot q_i}\ \text{is conserved}'
  notes: "A cyclic coordinate lets the order of the system be reduced by two (Routh reduction)."
  keywords: [cyclic, ignorable coordinate, conjugate momentum, conserved, routh]
- id: method.mech.energy_function
  title: Energy function (Jacobi integral)
  kind: theorem
  chapter: physics.mechanics
  section: variational
  verification: stated
  applies_to: ["lagrangian:time-independent"]
  validity: "L without explicit time dependence. h equals the total energy T + V when the kinetic energy is quadratic in the velocities and V does not depend on them."
  statement_latex: 'h=\sum_i \dot q_i\frac{\partial L}{\partial \dot q_i}-L,\qquad \frac{\partial L}{\partial t}=0\;\Longrightarrow\;\frac{dh}{dt}=0'
  keywords: [energy, jacobi integral, hamiltonian, time translation, conserved]
- id: method.mech.noether
  title: Noether's theorem
  kind: theorem
  chapter: physics.mechanics
  section: variational
  verification: stated
  applies_to: ["lagrangian:rotation", "lagrangian:cyclic", "lagrangian:time-independent", "lagrangian:no-symmetry-found"]
  validity: "A continuous transformation q_i → q_i + ε ξ_i(q, t) with δL = dF/dt."
  statement_latex: '\delta L=\frac{dF}{dt}\;\Longrightarrow\;Q=\sum_i p_i\,\xi_i-F\ \text{is conserved}'
  notes: "Minerva searches cyclic coordinates, time translation and rotations of coordinate pairs (F = 0). Symmetries needing F ≠ 0 (such as Galilean boosts) and hidden symmetries (such as the Runge–Lenz vector) are not searched for here; the search for more constants of motion looks for them in a declared family."
  keywords: [noether, symmetry, conservation law, angular momentum, momentum]
- id: method.mech.legendre_hamiltonian
  title: Legendre transform to the Hamiltonian
  kind: method
  chapter: physics.mechanics
  section: variational
  verification: stated
  applies_to: ["lagrangian", "ode:second-order"]
  validity: "Invertible mass matrix ∂²L/∂q̇_i∂q̇_j (non-degenerate Lagrangian)."
  statement_latex: 'p_i=\frac{\partial L}{\partial\dot q_i},\quad H=\sum_i p_i\dot q_i-L,\quad \dot q_i=\frac{\partial H}{\partial p_i},\ \dot p_i=-\frac{\partial H}{\partial q_i}'
  notes: "Hamilton's equations are first order and preserve phase-space volume; symplectic integrators exploit this for long simulations."
  keywords: [hamiltonian, legendre transform, phase space, canonical, hamilton equations]
- id: method.mech.reduction
  title: Order reduction with conserved quantities
  kind: method
  chapter: physics.mechanics
  section: variational
  verification: stated
  applies_to: ["lagrangian:cyclic", "lagrangian:rotation", "lagrangian:time-independent"]
  validity: "Independent conserved quantities; each can be used to eliminate one variable."
  statement_latex: 'n\ \text{degrees of freedom},\ k\ \text{independent conserved quantities}\;\Rightarrow\;\text{phase-space dimension } 2n-k\text{ (before eliminating time)}'
  notes: "With n independent integrals in involution the system is integrable by quadratures (Liouville). One degree of freedom with conserved energy reduces to a single quadrature."
  keywords: [reduction, quadrature, integrable, liouville, conserved quantities, kepler]
- id: method.mech.small_oscillations
  title: Linearisation and normal modes about an equilibrium
  kind: method
  chapter: physics.mechanics
  section: variational
  verification: stated
  applies_to: ["lagrangian:time-independent"]
  validity: "An equilibrium q0 (all accelerations vanish at q0, zero velocity) of a time-independent L with an invertible mass matrix. The expansion is local."
  statement_latex: '\ddot{u}=A\,u+B\,\dot{u}+O(|u,\dot u|^2),\qquad A=\frac{\partial \ddot q}{\partial q}\Big|_{q_0},\ B=\frac{\partial \ddot q}{\partial \dot q}\Big|_{q_0};\qquad B=0:\ \det(A+\omega^2 I)=0'
  notes: "Minerva expands the accelerations in the deviations from the equilibrium and checks every expansion against a contour-integral estimate of its coefficients and the order of its remainder. For up to two coordinates without velocity-linear terms it gives the normal-mode frequencies, each checked by substitution. A negative ω² describes the linearised equations only; it is not a statement about the full motion."
  keywords: [small oscillations, linearisation, normal modes, equilibrium, perturbation, approximation, expansion, frequency]
- id: method.mech.poincare_lindstedt
  title: Poincaré–Lindstedt method for a weakly nonlinear oscillator
  kind: method
  chapter: physics.mechanics
  section: variational
  verification: stated
  applies_to: ["lagrangian:time-independent"]
  validity: "One degree of freedom, acceleration depending on the position only, small parameter ε with a linear oscillator at ε = 0 (ω0² > 0). The series is local in ε."
  statement_latex: '\ddot w+\omega_0^2 w=\sum_{j\ge1}\varepsilon^j G_j(w),\quad \tau=\omega t,\ \omega=\omega_0+\varepsilon\omega_1+\cdots,\quad w=w_0+\varepsilon w_1+\cdots;\ \text{choose }\omega_k\text{ so that the }\cos\tau\text{ term of each order vanishes}'
  notes: "Minerva solves each order exactly on cosine polynomials, then puts the truncated solution into the unexpanded equation of motion and checks that its residual falls at order ε^(N+1). The optional comparison with the numerical solution is a measurement on the chosen span, not a bound. Damped or driven systems need multiple scales or averaging, which are not implemented."
  keywords: [poincare lindstedt, perturbation theory, duffing, anharmonic oscillator, pendulum period, frequency shift, secular term, strained time, approximation]
