# Vector identities. Each is checked by the engine's vector calculus: the difference of the two sides is
# evaluated (exact components and an independent Cartesian finite-difference reading) in Cartesian,
# cylindrical and spherical coordinates for abstract fields, which must come out identically zero.
# `requires: [c2]` is a fact about the identity (equal mixed partial derivatives), not an assumption:
# Minerva applies such an identity only to fields the user declared twice continuously differentiable.
# Left sides are written so that they can be matched on an expression (text syntax, typed variables:
# f and g are scalar fields, A, B and C are vector fields).

# ---------------------------------------------------------------------------- second derivatives
- id: vector.curl_grad
  title: Curl of a gradient
  kind: identity
  chapter: math.vector_calculus
  section: second_order
  verification: symbolic
  statement_latex: '\nabla\times(\nabla f) = \mathbf{0}'
  validity: "f twice continuously differentiable (equal mixed partial derivatives)."
  check:
    {
      kind: vector_identity,
      lhs: "curl(grad(f))",
      rhs: "0",
      fields: { f: scalar },
      requires: [c2],
    }
  reference:
    {
      source: "Griffiths, Introduction to Electrodynamics",
      locator: "chapter 1, second derivatives",
    }
  applies_to: ["vector:curl", "vector:grad"]
  keywords: [curl, gradient, irrotational, second derivative]

- id: vector.div_curl
  title: Divergence of a curl
  kind: identity
  chapter: math.vector_calculus
  section: second_order
  verification: symbolic
  statement_latex: '\nabla\cdot(\nabla\times\mathbf{A}) = 0'
  validity: "A twice continuously differentiable (equal mixed partial derivatives)."
  check:
    {
      kind: vector_identity,
      lhs: "div(curl(A))",
      rhs: "0",
      fields: { A: vector },
      requires: [c2],
    }
  reference:
    {
      source: "Griffiths, Introduction to Electrodynamics",
      locator: "chapter 1, second derivatives",
    }
  applies_to: ["vector:div", "vector:curl"]
  keywords: [divergence, curl, solenoidal, second derivative]

- id: vector.curl_curl
  title: Curl of a curl
  kind: identity
  chapter: math.vector_calculus
  section: second_order
  verification: symbolic
  statement_latex: '\nabla\times(\nabla\times\mathbf{A}) = \nabla(\nabla\cdot\mathbf{A}) - \nabla^{2}\mathbf{A}'
  validity: "A twice continuously differentiable; the vector Laplacian is taken on the Cartesian components."
  check:
    {
      kind: vector_identity,
      lhs: "curl(curl(A))",
      rhs: "grad(div(A)) - lap(A)",
      fields: { A: vector },
      requires: [c2],
    }
  reference:
    {
      source: "Griffiths, Introduction to Electrodynamics",
      locator: "chapter 1, second derivatives",
    }
  applies_to: ["vector:curl", "vector:grad", "vector:div", "vector:lap"]
  keywords: [curl, curl of a curl, laplacian, wave equation, vector laplacian]

- id: vector.laplacian_scalar
  title: Laplacian of a scalar field
  kind: identity
  chapter: math.vector_calculus
  section: second_order
  verification: symbolic
  statement_latex: '\nabla^{2} f = \nabla\cdot(\nabla f)'
  validity: "f twice differentiable."
  check:
    {
      kind: vector_identity,
      lhs: "lap(f)",
      rhs: "div(grad(f))",
      fields: { f: scalar },
      requires: [],
    }
  reference:
    {
      source: "Griffiths, Introduction to Electrodynamics",
      locator: "chapter 1, second derivatives",
    }
  applies_to: ["vector:lap", "vector:div", "vector:grad"]
  keywords: [laplacian, divergence, gradient]

# ---------------------------------------------------------------------------- product rules
- id: vector.grad_product
  title: Gradient of a product
  kind: identity
  chapter: math.vector_calculus
  section: products
  verification: symbolic
  statement_latex: '\nabla(fg) = f\,\nabla g + g\,\nabla f'
  validity: "f and g differentiable."
  check:
    {
      kind: vector_identity,
      lhs: "grad(f*g)",
      rhs: "f*grad(g) + g*grad(f)",
      fields: { f: scalar, g: scalar },
      requires: [],
    }
  reference:
    {
      source: "Griffiths, Introduction to Electrodynamics",
      locator: "chapter 1, product rules",
    }
  applies_to: ["vector:grad"]
  keywords: [gradient, product rule]

- id: vector.div_scalar_vector
  title: Divergence of a scalar times a vector
  kind: identity
  chapter: math.vector_calculus
  section: products
  verification: symbolic
  statement_latex: '\nabla\cdot(f\mathbf{A}) = \nabla f\cdot\mathbf{A} + f\,\nabla\cdot\mathbf{A}'
  validity: "f and A differentiable."
  check:
    {
      kind: vector_identity,
      lhs: "div(f*A)",
      rhs: "dot(grad(f), A) + f*div(A)",
      fields: { f: scalar, A: vector },
      requires: [],
    }
  reference:
    {
      source: "Griffiths, Introduction to Electrodynamics",
      locator: "chapter 1, product rules",
    }
  applies_to: ["vector:div", "vector:grad"]
  keywords: [divergence, product rule]

- id: vector.curl_scalar_vector
