  validity: "f and A differentiable."
  check:
    {
      kind: vector_identity,
      lhs: "curl(f*A)",
      rhs: "cross(grad(f), A) + f*curl(A)",
      fields: { f: scalar, A: vector },
      requires: [],
    }
  reference:
    {
      source: "Griffiths, Introduction to Electrodynamics",
      locator: "chapter 1, product rules",
    }
  applies_to: ["vector:curl", "vector:grad", "vector:cross"]
  keywords: [curl, product rule]

- id: vector.div_cross
  title: Divergence of a cross product
  kind: identity
  chapter: math.vector_calculus
  section: products
  verification: symbolic
  statement_latex: '\nabla\cdot(\mathbf{A}\times\mathbf{B}) = \mathbf{B}\cdot(\nabla\times\mathbf{A}) - \mathbf{A}\cdot(\nabla\times\mathbf{B})'
  validity: "A and B differentiable."
  check:
    {
      kind: vector_identity,
      lhs: "div(cross(A, B))",
      rhs: "dot(B, curl(A)) - dot(A, curl(B))",
      fields: { A: vector, B: vector },
      requires: [],
    }
  reference:
    {
      source: "Griffiths, Introduction to Electrodynamics",
      locator: "chapter 1, product rules",
    }
  applies_to: ["vector:div", "vector:cross", "vector:curl"]
  keywords: [divergence, cross product, poynting]

- id: vector.curl_cross
  title: Curl of a cross product
  kind: identity
  chapter: math.vector_calculus
  section: products
  verification: symbolic
  statement_latex: '\nabla\times(\mathbf{A}\times\mathbf{B}) = \mathbf{A}(\nabla\cdot\mathbf{B}) - \mathbf{B}(\nabla\cdot\mathbf{A}) + (\mathbf{B}\cdot\nabla)\mathbf{A} - (\mathbf{A}\cdot\nabla)\mathbf{B}'
  validity: "A and B differentiable."
  check:
    {
      kind: vector_identity,
      lhs: "curl(cross(A, B))",
      rhs: "A*div(B) - B*div(A) + adv(B, A) - adv(A, B)",
      fields: { A: vector, B: vector },
      requires: [],
    }
  reference:
    {
      source: "Griffiths, Introduction to Electrodynamics",
      locator: "chapter 1, product rules",
    }
  applies_to: ["vector:curl", "vector:cross", "vector:div", "vector:adv"]
  keywords: [curl, cross product, advective derivative]

- id: vector.grad_dot
  title: Gradient of a dot product
  kind: identity
  chapter: math.vector_calculus
  section: products
  verification: symbolic
  statement_latex: '\nabla(\mathbf{A}\cdot\mathbf{B}) = (\mathbf{A}\cdot\nabla)\mathbf{B} + (\mathbf{B}\cdot\nabla)\mathbf{A} + \mathbf{A}\times(\nabla\times\mathbf{B}) + \mathbf{B}\times(\nabla\times\mathbf{A})'
  validity: "A and B differentiable."
  check:
    {
      kind: vector_identity,
      lhs: "grad(dot(A, B))",
      rhs: "adv(A, B) + adv(B, A) + cross(A, curl(B)) + cross(B, curl(A))",
      fields: { A: vector, B: vector },
      requires: [],
    }
  reference:
    {
      source: "Griffiths, Introduction to Electrodynamics",
      locator: "chapter 1, product rules",
    }
  applies_to:
    ["vector:grad", "vector:dot", "vector:adv", "vector:cross", "vector:curl"]
  keywords: [gradient, dot product, advective derivative]

- id: vector.grad_square
  title: Gradient of the square of a vector
  kind: identity
  chapter: math.vector_calculus
  section: products
  verification: symbolic
  statement_latex: '\nabla(\mathbf{A}\cdot\mathbf{A}) = 2(\mathbf{A}\cdot\nabla)\mathbf{A} + 2\,\mathbf{A}\times(\nabla\times\mathbf{A})'
  validity: "A differentiable."
  check:
    {
      kind: vector_identity,
      lhs: "grad(dot(A, A))",
      rhs: "2*adv(A, A) + 2*cross(A, curl(A))",
      fields: { A: vector },
      requires: [],
    }
  reference:
    {
      source: "Griffiths, Introduction to Electrodynamics",
      locator: "chapter 1, product rules",
