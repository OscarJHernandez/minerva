- id: const.c
  title: Speed of light in vacuum
  kind: constant
  chapter: physics.constants
  section: si
  verification: stated
  statement_latex: 'c = 299\,792\,458\ \mathrm{m\,s^{-1}}'
  constant: {value: "299792458", unit: "m/s"}
  reference: {source: "SI Brochure, 9th edition (2019)", locator: "Table 1"}
  keywords: [light, speed, relativity, exact]
- id: const.h
  title: Planck constant
  kind: constant
  chapter: physics.constants
  section: si
  verification: stated
  statement_latex: 'h = 6.626\,070\,15\times10^{-34}\ \mathrm{J\,s}'
  constant: {value: "6.62607015e-34", unit: "J s"}
  reference: {source: "SI Brochure, 9th edition (2019)", locator: "Table 1"}
  keywords: [planck, quantum, action, exact]
- id: const.hbar
  title: Reduced Planck constant
  kind: constant
  chapter: physics.constants
  section: si
  verification: stated
  statement_latex: '\hbar = \frac{h}{2\pi} = 1.054\,571\,817\ldots\times10^{-34}\ \mathrm{J\,s}'
  constant: {value: "1.054571817e-34", unit: "J s"}
  notes: "Derived from the exact value of h; digits truncated, not rounded."
  keywords: [hbar, planck, reduced, quantum]
