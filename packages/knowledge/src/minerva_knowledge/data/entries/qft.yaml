  keywords: [klein-gordon, scalar field, free field, wave equation]
- id: qft.dirac
  title: Dirac equation
  kind: equation
  chapter: physics.qft
  section: free_fields
  verification: stated
  statement_latex: '\left(\mathrm{i}\gamma^\mu\partial_\mu - m\right)\psi(x) = 0'
