- id: qft.klein_gordon
  title: Klein–Gordon equation
  kind: equation
  chapter: physics.qft
  section: free_fields
  verification: stated
  statement_latex: '\left(\partial_\mu\partial^\mu + m^2\right)\phi(x) = 0'
