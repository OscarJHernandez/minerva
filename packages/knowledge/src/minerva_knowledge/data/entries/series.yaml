- id: series.exp
  title: Exponential series
  kind: series
  chapter: math.series
  section: power
  verification: numeric
  validity: "All x."
  statement_latex: '\mathrm{e}^{x} = \sum_{n=0}^{\infty}\frac{x^n}{n!}'
  check: {kind: series, term: "x**n/factorial(n)", index: n, lower: 0, upper: "oo", result: "exp(x)", params: {x: {min: -3.0, max: 3.0}}}
  reference: {source: DLMF, locator: "§4.6", url: "https://dlmf.nist.gov/4.6"}
  keywords: [exponential, maclaurin, taylor, series]
- id: series.sin
  title: Sine series
  kind: series
  chapter: math.series
  section: power
  verification: numeric
  validity: "All x."
  statement_latex: '\sin x = \sum_{n=0}^{\infty}\frac{(-1)^n x^{2n+1}}{(2n+1)!}'
  check: {kind: series, term: "(-1)**n*x**(2*n + 1)/factorial(2*n + 1)", index: n, lower: 0, upper: "oo", result: "sin(x)", params: {x: {min: -3.0, max: 3.0}}}
  reference: {source: DLMF, locator: "§4.19", url: "https://dlmf.nist.gov/4.19"}
  keywords: [sine, maclaurin, taylor, series]
