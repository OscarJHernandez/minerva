- id: series.geometric
  title: Geometric series
  kind: series
  chapter: math.series
  section: power
  verification: numeric
  validity: "|x| < 1."
  statement_latex: '\sum_{n=0}^{\infty}x^n = \frac{1}{1-x}'
  check: {kind: series, term: "x**n", index: n, lower: 0, upper: "oo", result: "1/(1 - x)", params: {x: {min: -0.9, max: 0.9}}}
  keywords: [geometric, series, convergence]
