- id: matrix-check-missing-transposed-term
  group: matrix
  kind: invalid_candidate
  operation: matrix_calculus
  source: "d tr(X^T A X) has two terms; A X alone is right only for symmetric A"
  input: "tr(transpose(X)*A*X)"
  matrices: [{name: A, rows: 3, cols: 3}, {name: X, rows: 3, cols: 2}]
  vars: {}
  request: {action: gradient, variable: X}
  candidate: {result: "A*X"}
  control: {result: "A*X + transpose(A)*X"}

- id: matrix-check-inverse-for-inverse-transpose
  group: matrix
  kind: invalid_candidate
  operation: matrix_calculus
  source: "d log det X is X^-T, not X^-1, for a matrix that is not declared symmetric"
  input: "logdet(X)"
  matrices: [{name: X, rows: 3, cols: 3}]
  vars: {}
  request: {action: gradient, variable: X, invertible: [X]}
  candidate: {result: "inv(X)"}
  control: {result: "transpose(inv(X))"}

- id: matrix-check-quadratic-form-half-gradient
  group: matrix
  kind: invalid_candidate
  operation: matrix_calculus
  source: "The gradient of x^T A x is (A + A^T) x, not A x, when A is not symmetric"
  input: "transpose(x)*A*x"
  matrices: [{name: A, rows: 3, cols: 3}, {name: x, rows: 3, cols: 1}]
  vars: {}
  request: {action: gradient, variable: x}
  candidate: {result: "A*x"}
  control: {result: "(A + transpose(A))*x"}

- id: matrix-check-unconstrained-gradient-for-symmetric-variable
  group: matrix
  kind: invalid_candidate
  operation: matrix_calculus
  source: "For a symmetric variable the gradient must itself be symmetric; the unconstrained one is not"
  input: "tr(inv(S)*A)"
  matrices: [{name: A, rows: 3, cols: 3}, {name: S, rows: 3, cols: 3, positive_definite: true}]
  vars: {}
  request: {action: gradient, variable: S}
  candidate: {result: "-inv(S)*transpose(A)*inv(S)"}
  control: {result: "-1/2*inv(S)*(A + transpose(A))*inv(S)"}

- id: matrix-check-reordered-product
  group: matrix
  kind: invalid_candidate
  operation: matrix_calculus
  source: "Matrix factors are never reordered: d tr(AXB) = A^T B^T, not B^T A^T"
  input: "tr(A*X*B)"
  matrices: [{name: A, rows: 3, cols: 3}, {name: X, rows: 3, cols: 3}, {name: B, rows: 3, cols: 3}]
  vars: {}
  request: {action: gradient, variable: X}
  candidate: {result: "transpose(B)*transpose(A)"}
  control: {result: "transpose(A)*transpose(B)"}

- id: matrix-check-gradient-perturbed-by-1e-6
  group: matrix
  kind: invalid_candidate
  operation: matrix_calculus
  source: "A gradient that is off by a relative 1e-6 must be rejected"
  input: "-1/2*transpose(x - mu)*inv(S)*(x - mu)"
  matrices: [{name: x, rows: 3, cols: 1}, {name: mu, rows: 3, cols: 1}, {name: S, rows: 3, cols: 3, positive_definite: true}]
  vars: {}
  request: {action: gradient, variable: mu}
  candidate: {result: "1000001/1000000*inv(S)*(x - mu)"}
  control: {result: "inv(S)*(x - mu)"}
