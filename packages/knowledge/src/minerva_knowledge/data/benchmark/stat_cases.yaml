- id: matrix-valued-function-has-no-gradient
  group: matrix
  kind: unsupported
  operation: matrix_calculus
  source: "A matrix by matrix derivative is a fourth-order tensor: out of scope"
  input: "X*A"
  matrices: [{name: A, rows: 3, cols: 3}, {name: X, rows: 3, cols: 3}]
  vars: {}
  request: {action: gradient, variable: X}
  expect: {status: unsupported, reason: non_scalar_gradient}

