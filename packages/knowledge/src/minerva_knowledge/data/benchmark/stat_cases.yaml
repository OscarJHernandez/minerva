- id: matrix-hessian-gaussian-mean
  group: matrix
  kind: supported
  operation: matrix_calculus
  source: "Hand derivation: the observed information for the mean is the precision matrix"
  input: "-1/2*transpose(x - mu)*inv(S)*(x - mu)"
  matrices: [{name: x, rows: 3, cols: 1}, {name: mu, rows: 3, cols: 1}, {name: S, rows: 3, cols: 3, positive_definite: true}]
  vars: {}
  request: {action: hessian, variable: mu}
  expect:
    outputs: {result: "-inv(S)"}

