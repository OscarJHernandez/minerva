# What Minerva can do today, with examples that are run through the real engine.
#
# Hand-written source for docs/capabilities.md and apps/site/src/data/capabilities.json.
# Regenerate with `uv run python scripts/capabilities.py`; CI fails when the generated files differ
# (scripts/tests/test_capabilities.py), so a change in behaviour shows up as a diff in the pull request.
#
# Top level: `groups` (ordered; id, title, summary) organise the docs navigation. Every capability, planned ones
# included, names its `group`; add a group here before using it, and every group needs a capability.
#
# Per capability: id, title, status (available | planned), group, where (workbench | reference | chat | api), summary, limits,
# examples. Planned capabilities have no examples. Every example has an `id`, a `title`, an `op` and the
# fields that op needs:
#   simplify     input, assumptions, goal (simplify | expand | factor | rewrite), target [function names]
#   differentiate input, variables [{name, order}], assumptions
#   series       input, variable, point, order, assumptions
#   matrix       input, matrices [{name, rows, cols | entries, depends_on}], action (evaluate | simplify |
#                differentiate | integrate | evolve), variable, lower, upper, commuting [[A, B]],
#                invertible [names], self_commuting [names]
#   distribution input, assumptions, action (simplify | integrate | differentiate), variable, lower, upper, endpoint,
#                notation {delta | theta | Theta: dirac_delta | heaviside | symbol} (the user's answer to "is that a
#                Dirac delta?"; without it the example shows the question)
#   sums         input, assumptions, action (expand | evaluate_constant | factor | log_of_product | differentiate | check),
#                variable, candidate {result: text}
#   expectation  input, random [names], independent [[names]] (only what the user states), action (expand |
#                to_moments | check), candidate {result: text}
#   statistics   family, parametrization, parameters {name: text}, observation, sample_size, iid, estimate [names],
#                action (moments | log_likelihood | score | mle | fisher_information | posterior), prior {family,
#                parameters}, data [numbers], candidate {key: text}, assumptions
#   identities   input, assumptions, show [rule ids to display]
#   geometry     coordinates, metric [[expression]], assumptions, functions [{name, args}], quantities, tensor {variance,
#                components}, tensor_index
#   tensor       input, tensors {name: {rank, symmetry}}, dimension
#   solve        equation, variable
#   lagrangian   input, coordinates   (text: velocities are written r_dot, theta_dot; LaTeX: \dot{r})
#   invariants   input, coordinates, angles, degree, power_bound, harmonics
#   discovery    input, coordinates, system (lagrangian | hamiltonian), momenta, angles, budget
#   entry        entry [handbook entry id]
#   read_formulas formulas [LaTeX strings, as a vision model would transcribe them]
#   substitute   input, relations [LaTeX `left = right`], order (given | simultaneous), assumptions
#   rewrite      input, action (simplify | expand | factor | cancel | collect | rule), part, occurrence, rule, by, assumptions
#   isolate      input (an equation), variable, assumptions
# Syntax: every example may set `format: text` (plain typing: sin(x)/(1+cos(x)), explicit `*`, `^` for powers) or
# leave it out for LaTeX. Prefer plain text: it is how people type, and the page shows the formula the engine
# read from it. Keep LaTeX only where LaTeX is the point (refusing an ambiguous `\sin 2x`, photo transcription,
# one example per capability that shows LaTeX input). Tensor inputs have their own form, S(a,b)*A(-a,-b).
# Add a refusal example wherever a capability has an obvious limit: what Minerva declines to do is part of
# what it does.

groups:
  - id: math
    title: Mathematics
    summary: Symbolic computation, with every result verified before it is shown.
  - id: physics
    title: Physics
    summary: Mechanics and other physical systems, from a Lagrangian to its conserved quantities.
  - id: knowledge
    title: Handbook and identities
    summary: A citable, machine-checked collection of identities and equations, and the search over it.
  - id: statistics
    title: Statistics
    summary: Sums, expectations, probability models, estimators, information and Bayesian updates, derived and checked rather than looked up.
  - id: interfaces
    title: Using Minerva
    summary: How to reach the tools, through the chat, photos of equations and the workbench.

capabilities:
  - id: simplify
    title: Verified simplification
    status: available
    group: math
    where: [workbench, chat, api]
    summary: >-
      Searches a short chain of rewrites toward a goal (simplify, expand, factor, or rewrite in given functions):
      handbook identities, each at every place it matches and read in either direction, plus SymPy's own moves.
      Every step is checked at random complex sample points and, separately, with a symbolic zero test; the steps
      and the identities used are shown. A result that cannot be verified is never shown.
    limits:
      - Numerical agreement at sample points is evidence, not proof; only a passed symbolic zero test means SymPy
        also reduced the difference to zero. Both are reported for every step.
      - Steps are equalities where both sides are defined. When the result excludes points the input did not
        (a cancelled factor), it says where it is valid (`x \neq 1`); square-root, logarithm and branch-cut
        domains are not reported this way.
      - The search is bounded (at most 4 rewrites in a row, a few alternatives per step, a time budget). "Nothing
        better was found" does not show that no better form exists.
      - An identity that matches but whose conditions are not provable from your assumptions is reported with the
        unmet conditions and never applied.
      - Symbols are complex unless you declare otherwise, so results that need real or positive symbols are
        left alone until you say so.
      - If nothing better is found, the input is returned unchanged and the status says so.
      - In LaTeX, bare function arguments such as `\sin 2x` and inverse notation such as `\sin^{-1}` are rejected as ambiguous; plain text needs the parentheses, `sin(2*x)`.
    examples:
      - id: simplify-trig-quotients
        title: Rational trigonometric expression
        op: simplify
        format: text
        input: "sin(x)/(1+cos(x)) + (1+cos(x))/sin(x)"
      - id: simplify-fourth-powers
        title: Difference of fourth powers
        op: simplify
        format: text
        input: "(sin(x)^4 - cos(x)^4)/(sin(x)^2 - cos(x)^2)"
      - id: simplify-cancelled-singularity
        title: Cancelling a factor keeps its restriction
        note: >-
          The result is `x + 1`, valid only where `x \neq 1`; the two expressions differ in domain.
        op: simplify
        format: text
        input: "(x^2-1)/(x-1)"
      - id: simplify-sqrt-general
        title: Square root of a square, no assumptions
        note: >-
          Without an assumption the square root of a square is neither x nor |x| for every complex x, so nothing is simplified.
        op: simplify
        format: text
        input: "sqrt(x^2)"
      - id: simplify-sqrt-real
        title: The same, with x declared real
        note: >-
          Under the declared assumption the expression is read as |x|.
        op: simplify
        format: text
        input: "sqrt(x^2)"
        assumptions: { x: [real] }
      - id: simplify-power-general
        title: Power of a power, no assumptions
        note: >-
          The rule (x^a)^b = x^{ab} fails for complex x, so the expression is left as it is.
        op: simplify
        format: text
        input: "(x^a)^b"
      - id: simplify-power-positive
        title: The same, with x positive and a real
        note: >-
          With x positive and a real the exponents combine, and the expression is read as x^{ab}.
        op: simplify
        format: text
        input: "(x^a)^b"
        assumptions: { x: [positive], a: [real] }
      - id: simplify-chain
        title: Two identities in a row
        note: >-
          The Pythagorean identity turns sin^2 + cos^2 into 1, and then 1 + tan^2 = sec^2. Neither identity alone
          reaches the result; each step is verified before the next is tried.
        op: simplify
        input: '\sin^2 x + \cos^2 x + \tan^2 x'
      - id: simplify-chain-nested
        title: An identity inside a larger expression
        op: simplify
        format: text
        input: "log(sin(t)^2 + cos(t)^2 + y)"
      - id: simplify-chain-blocked
        title: Matches, but its conditions are not provable
        note: >-
          Combining logarithms needs both arguments positive. Nothing is applied and the input comes back.
        op: simplify
        format: text
        input: "log(x) + log(y)"
      - id: simplify-chain-unlocked
        title: The same, with x and y declared positive
        op: simplify
        format: text
        input: "log(x) + log(y)"
        assumptions: { x: [positive], y: [positive] }
      - id: simplify-goal-expand
        title: Expand a multiple angle
        op: simplify
        format: text
        input: "sin(3*x)"
        goal: expand
      - id: simplify-goal-factor
        title: Factor a difference of fourth powers
        op: simplify
        format: text
        input: "x^4 - y^4"
        goal: factor
      - id: simplify-goal-rewrite
        title: Rewrite in terms of sine and cosine
        op: simplify
        format: text
        input: "tan(x)*cos(x)"
        goal: rewrite
        target: [sin, cos]
      - id: simplify-nothing-better
        title: Nothing to improve
        op: simplify
        format: text
        input: "sin(x)"
      - id: simplify-ambiguous
        title: Ambiguous input is refused
        op: simplify
        input: '\sin 2x'

  - id: differentiate
    title: Verified differentiation
    status: available
    group: math
    where: [workbench, chat, api]
    summary: >-
      Differentiates symbolically with respect to one or more variables, to any order up to 10, mixed partials
      included. Every step is checked against an independent numerical derivative.
    limits:
      - Where no complex derivative exists (`|x|`, real and imaginary parts, conjugates) the answer is
        "unsupported" unless the variable is declared real.
      - The notation `\frac{d}{dx}` and undefined functions `f(x)` are not accepted in the input yet.
    examples:
      - id: diff-product
        title: Product rule
        op: differentiate
        format: text
        input: "x^3*sin(x)"
        variables: [{ name: x }]
      - id: diff-third-order
        title: Third derivative of a Gaussian
        op: differentiate
        input: '\exp(-x^2)'
        variables: [{ name: x, order: 3 }]
      - id: diff-mixed
        title: Mixed partial derivative
        op: differentiate
        format: text
        input: "x^2*y^3"
        variables: [{ name: x }, { name: y }]
      - id: diff-abs-complex
        title: No complex derivative
        note: >-
          Declare x real to differentiate |x|.
        op: differentiate
        format: text
        input: "abs(x)"
        variables: [{ name: x }]

  - id: series
    title: Verified Taylor series
    status: available
    group: math
    where: [workbench, chat, api]
    summary: >-
      Expands an expression in one variable about a finite real point, to order 12 at most. The coefficients are
      re-derived from the original function by a contour-integral estimate (no differentiation), and the
      remainder is measured to shrink at the claimed order. Both checks must pass or no series is shown.
    limits:
      - Only Taylor series about a finite point. A pole or branch point at the point (`1/x`, `\sqrt{x}`, `\ln x` at 0)
        is "unsupported"; Laurent, Puiseux and asymptotic series are not produced.
      - Functions with no complex derivative (`|x|`) are unsupported.
      - The error table is a measurement at a few distances for this expression, not a bound.
    examples:
      - id: series-exp
        title: Exponential about zero
        op: series
        input: '\exponentialE^{x}'
        variable: x
        point: "0"
        order: 5
      - id: series-parameter
        title: Binomial series with a symbolic exponent
        op: series
        format: text
        input: "(1+x)^a"
        variable: x
        point: "0"
        order: 3
      - id: series-shifted
        title: Logarithm about 1
        op: series
        format: text
        input: "log(x)"
        variable: x
        point: "1"
        order: 4
        assumptions: { x: [positive] }
      - id: series-pole
        title: A pole has no Taylor series
        op: series
        format: text
        input: "1/x"
        variable: x
        point: "0"
        order: 3

  - id: matrix-calculus
    title: Noncommutative matrix calculus
    status: available
    group: math
    where: [chat, api, workbench]
    summary: >-
      Ordered products of matrix exponentials with declared matrices (a size, or explicit entries), also
      matrices that depend on a variable, A(t). Minerva recognises the structure and picks the technique: the
      ordered product rule; the Frechet derivative of exp(X(t)) when X and X' do not commute (never assumed to
      equal X' exp(X)); merging exponentials only where commutation is declared or visible in the entries; a
      closed form for an invertible matrix; Duhamel integrals of e^((t-s)A) B e^(sA); a Sylvester equation or a
      block-matrix exponential for other integrals; and evolution operators dU/dt = A(t) U, U(0) = I. A result
      is shown only if independent checks agree. An equation, a representation or a numerical approximation is
      never presented as an evaluated result.
    limits:
      - The variable is scalar. A matrix depends on it only if declared (or visible in explicit entries), and A(t) is never read as t times A; integrals of time-dependent matrices are not supported.
      - Matrices are never assumed to commute (also with their own derivative or at other times) or to be invertible; each must be declared, or be visible in explicit entries.
      - Time-ordered exponentials, Dyson series and Magnus expansions are not supported. An abstract generator that does not commute with itself at all times is declined; explicit entries with a numeric span are solved numerically.
      - A numerical solution (up to 4 by 4, double precision) is a measurement on the span you give, checked by a second method, by integrating backwards and by Liouville's formula; the end of the span is a number only you can choose.
      - Integrals need exponents that are affine in the variable and at most two exponentials depending on it. Abstract matrices give an exact equation or representation, entries only for explicit matrices (at most 4 by 4) whose closed form SymPy finds in time.
      - The numerical check is evidence, not proof. The exact check compares formal power series through degree 4 and is reported separately.
    examples:
      - id: matrix-integral-explicit
        title: An integral of a product of noncommuting exponentials
        op: matrix
        format: text
        input: "exp(w*A)*exp(-w*B)"
        matrices:
          - { name: A, entries: [["1", "0"], ["0", "2"]] }
          - { name: B, entries: [["0", "1"], ["0", "0"]] }
        action: integrate
        variable: w
        lower: "0"
        upper: "1"
      - id: matrix-integral-abstract
        title: The same structure with abstract matrices gives a verified equation, not entries
        op: matrix
        format: text
        input: "exp(-(x-y)*(y-w)*A)*exp(-(w-z)*(z-q)*B)"
        matrices:
          - { name: A, rows: 2 }
          - { name: B, rows: 2 }
        action: integrate
        variable: w
        lower: a
        upper: b
      - id: matrix-derivative
        title: Derivative of a product keeps the order
        op: matrix
        format: text
        input: "exp(t*A)*exp(s*B)"
        matrices:
          - { name: A, rows: 2 }
          - { name: B, rows: 2 }
        action: differentiate
        variable: t
      - id: matrix-merge-blocked
        title: Exponentials of matrices that may not commute are not merged
        op: matrix
        format: text
        input: "exp(A)*exp(B)"
        matrices:
          - { name: A, rows: 2 }
          - { name: B, rows: 2 }
        action: simplify
      - id: matrix-merge-declared
        title: Merged once commutation is declared
        op: matrix
        input: '\exp(A)\exp(B)'
        matrices:
          - { name: A, rows: 2 }
          - { name: B, rows: 2 }
        commuting: [[A, B]]
        action: simplify
      - id: matrix-frechet
        title: The derivative of an exponential whose exponent does not commute with its derivative
        op: matrix
        format: text
        input: "exp(t^2*A + t*B)"
        matrices:
          - { name: A, rows: 2 }
          - { name: B, rows: 2 }
        action: differentiate
        variable: t
      - id: matrix-frechet-explicit
        title: The same derivative with explicit entries is evaluated
        op: matrix
        input: '\exp(tA + t^2 B)'
        matrices:
          - { name: A, entries: [["0", "1"], ["0", "0"]] }
          - { name: B, entries: [["0", "0"], ["1", "0"]] }
        action: differentiate
        variable: t
      - id: matrix-frechet-commuting
        title: With commutation declared it is the familiar product
        op: matrix
        input: '\exp(t^2 A + t B)'
        matrices:
          - { name: A, rows: 2 }
          - { name: B, rows: 2 }
        commuting: [[A, B]]
        action: differentiate
        variable: t
      - id: matrix-time-dependent
        title: A time-dependent matrix that commutes with itself at all times
        op: matrix
        input: '\exp(A(t))'
        matrices:
          - { name: A, rows: 2, depends_on: t }
        self_commuting: [A]
        action: differentiate
        variable: t
      - id: matrix-time-dependent-undeclared
        title: A time-dependent matrix without that declaration gives the Frechet integral
        op: matrix
        input: '\exp(A(t))'
        matrices:
          - { name: A, rows: 2, depends_on: t }
        action: differentiate
        variable: t
      - id: matrix-duhamel-explicit
        title: A Duhamel integral with explicit matrices
        op: matrix
        input: '\exp((t-s)A) B \exp(sA)'
        matrices:
          - { name: A, entries: [["0", "1"], ["0", "0"]] }
          - { name: B, entries: [["0", "0"], ["1", "0"]] }
        action: integrate
        variable: s
        lower: "0"
        upper: t
      - id: matrix-duhamel-abstract
        title: With abstract matrices it is an exact representation, not an evaluated integral
        op: matrix
        input: '\exp((t-s)A) B \exp(sA)'
        matrices:
          - { name: A, rows: 2 }
          - { name: B, rows: 2 }
        action: integrate
        variable: s
        lower: "0"
        upper: t
      - id: matrix-duhamel-commuting
        title: When B commutes with A the integral is a closed form
        op: matrix
        input: '\exp((t-s)A) B \exp(sA)'
        matrices:
          - { name: A, rows: 2 }
          - { name: B, rows: 2 }
        commuting: [[A, B]]
        action: integrate
        variable: s
        lower: "0"
        upper: t
      - id: matrix-evolution-commuting
        title: An evolution operator for a generator whose matrices commute
        op: matrix
        input: "tA + t^2 B"
        matrices:
          - { name: A, rows: 2 }
          - { name: B, rows: 2 }
        commuting: [[A, B]]
        action: evolve
        variable: t
      - id: matrix-evolution-explicit
        title: An evolution operator from explicit entries that commute with themselves
        op: matrix
        input: "A(t)"
        matrices:
          - { name: A, entries: [["t", "0"], ["0", "2t"]] }
        action: evolve
        variable: t
      - id: matrix-evolution-numeric
        title: A generator that does not commute with itself is solved numerically on a span you choose
        op: matrix
        input: "A(t)"
        matrices:
          - { name: A, entries: [["0", "1"], ["-t", "0"]] }
        action: evolve
        variable: t
        upper: "1.5"
      - id: matrix-time-ordered
        title: An abstract generator that does not commute with itself is declined
        op: matrix
        input: "tA + t^2 B"
        matrices:
          - { name: A, rows: 2 }
          - { name: B, rows: 2 }
        action: evolve
        variable: t

  - id: distribution-calculus
    title: Dirac delta and Heaviside calculus
    status: available
    group: math
    where: [workbench, chat, api]
    summary: >-
      Simplify, integrate and differentiate expressions with Dirac delta and Heaviside functions. Equality is
      as distributions (the same action on every test function), never pointwise: a delta has no values to
      compare. Each step cites a handbook identity and the conditions that were established exactly (the
      variable is real, a scale factor is nonzero, a root is real and simple, a delta lies inside the limits);
      a result is shown only if an independent test-function pairing against a regularised input agrees.
      Whatever cannot be decided is refused with a reason, never guessed.
    limits:
      - One real variable. A delta needs a polynomial argument with simple real roots; repeated roots, other functions (sin x) and products of distributions are declined.
      - A delta exactly on an integration limit counts only under a convention you choose (half, include or exclude); Minerva never picks one.
      - Heaviside functions are differentiated when the argument is affine and the other factors are smooth everywhere; derivatives of a delta, products of steps and integrals of ordinary functions with a step are declined.
      - The test-function check is supporting evidence, not a proof; the exact conditions are reported separately. Write `delta(x)` or `\delta(x)` (outside this operation they are ordinary symbols) and Minerva asks whether it is a Dirac delta, and `theta(x)` whether it is a step function, then computes nothing until you answer. The explicit names (\operatorname{DiracDelta}, \operatorname{Heaviside}) need no question.
    examples:
      - id: delta-shell-integral
        title: An integral against a delta of a polynomial with two simple roots
        op: distribution
        format: text
        notation: { delta: dirac_delta }
        input: "x^2*delta(x^2 - 4)"
        action: integrate
        variable: x
        lower: "-oo"
        upper: oo
      - id: delta-notation-asked
        title: Minerva asks whether delta is a Dirac delta
        op: distribution
        format: text
        input: "x^2*delta(x^2 - 4)"
        action: integrate
        variable: x
        lower: "-oo"
        upper: oo
        note: >-
          Until you answer, delta(...) is an ordinary symbol times a bracket, so nothing is computed. The chat and
          the workbench show the question with buttons; the example above this one is the same integral after
          the answer "yes, a Dirac delta".
      - id: delta-scaling-parameter
        title: Scaling by a parameter whose sign is known
        op: distribution
        format: text
        notation: { delta: dirac_delta }
        input: "delta(a*x)"
        assumptions: { a: [negative] }
        action: simplify
        variable: x
      - id: heaviside-derivative
        title: The derivative of a switched-on decay has a delta where it jumps
        op: distribution
        format: text
        notation: { theta: heaviside }
        input: "exp(-g*x)*theta(x)"
        assumptions: { g: [positive] }
        action: differentiate
        variable: x
      - id: delta-scale-sign-unknown
        title: A scale factor of unknown sign is declined
        op: distribution
        input: '\operatorname{DiracDelta}(a x)'
        assumptions: { a: [real] }
        action: simplify
        variable: x
      - id: delta-on-a-limit
        title: A delta on an integration limit is ambiguous until you choose a convention
        op: distribution
        format: text
        notation: { delta: dirac_delta }
        input: "delta(x - 1)"
        action: integrate
        variable: x
        lower: "0"
        upper: "1"
      - id: delta-repeated-root
        title: A repeated root is declined
        op: distribution
        format: text
        notation: { delta: dirac_delta }
        input: "delta(x^2)"
        action: simplify
        variable: x

  - id: differential-geometry
    title: Differential geometry in coordinates
    status: available
    group: math
    where: [workbench, chat, api]
    summary: >-
      Give the coordinates and a metric once and ask for the inverse metric, the Christoffel symbols of the
      Levi-Civita connection, the Riemann, Ricci and Einstein tensors, the Ricci scalar and other curvature
      invariants, symbolic geodesic equations, and the covariant derivative or index raising of a tensor field.
      Functions of the coordinates (f(r), a(t)) may be declared. The conventions are stated with every result.
      A quantity is shown only if independent numerical checks pass: the connection is checked for metric
      compatibility, the curvature for its symmetries and the Bianchi identities, the Einstein tensor for a
      vanishing divergence, the geodesic equations against the Euler-Lagrange equations. A symbolic proof is
      reported separately, and the signature is never assumed.
    limits:
      - Explicit metrics only, in at most 4 coordinates, with real coordinates. No abstract manifolds, charts or atlases, tetrads, spin connections or differential forms; the connection is always Levi-Civita.
      - Unspecified functions are real functions of the coordinates; an undeclared f(r) is refused instead of being read as f times r.
      - The signature is reported only when the declared assumptions decide the sign of each entry of a diagonal metric. Where a determinant or denominator vanishes is reported as a restriction on the coordinates, not as a statement about curvature singularities; root, logarithm and branch domains are not analysed.
      - Numerical agreement is evidence, not proof. A symbolic proof (a zero test that succeeded) is shown separately and is not attempted for very large expressions.
      - Geodesic equations are symbolic; they are not integrated numerically.
    examples:
      - id: geometry-sphere
        title: The 2-sphere, with its curvature invariants
        op: geometry
        format: text
        coordinates: [theta, phi]
        metric:
          - ["a^2", "0"]
          - ["0", "a^2*sin(theta)^2"]
        assumptions: { a: [positive] }
        quantities: [christoffel, ricci_scalar, kretschmann]
      - id: geometry-schwarzschild
        title: Schwarzschild spacetime is Ricci-flat
        op: geometry
        coordinates: ["t", "r", '\theta', '\phi']
        metric:
          - ["-(1-2M/r)", "0", "0", "0"]
          - ["0", "(1-2M/r)^{-1}", "0", "0"]
          - ["0", "0", "r^2", "0"]
          - ["0", "0", "0", 'r^2 \sin^2\theta']
        assumptions: { M: [positive], r: [positive] }
        quantities: [ricci, kretschmann]
      - id: geometry-geodesics
        title: Geodesic equations of the plane in polar coordinates
        op: geometry
        format: text
        coordinates: [r, theta]
        metric:
          - ["1", "0"]
          - ["0", "r^2"]
        assumptions: { r: [positive] }
        quantities: [geodesics]
      - id: geometry-function
        title: An unspecified function in the metric
        op: geometry
        format: text
        coordinates: [t, r, theta, phi]
        metric:
          - ["-f(r)", "0", "0", "0"]
          - ["0", "1/f(r)", "0", "0"]
          - ["0", "0", "r^2", "0"]
          - ["0", "0", "0", "r^2*sin(theta)^2"]
        assumptions: { r: [positive] }
        functions: [{ name: f, args: [r] }]
        quantities: [ricci_scalar]
      - id: geometry-covariant
        title: The covariant derivative of the radial vector field
        op: geometry
        format: text
        coordinates: [r, theta]
        metric:
          - ["1", "0"]
          - ["0", "r^2"]
        assumptions: { r: [positive] }
        quantities: [covariant_derivative]
        tensor: { variance: [up], components: ["1", "0"] }
      - id: geometry-degenerate
        title: A degenerate metric is declined
        op: geometry
        format: text
        coordinates: ["x", "y"]
        metric:
          - ["1", "0"]
          - ["0", "0"]
        quantities: [christoffel]
      - id: geometry-undeclared-function
        title: An undeclared function is refused instead of being read as a product
        op: geometry
        format: text
        coordinates: ["r"]
        metric:
          - ["f(r)"]
        quantities: [christoffel]
      - id: geometry-asymmetric
        title: A metric that is not symmetric is declined
        op: geometry
        format: text
        coordinates: ["x", "y"]
        metric:
          - ["1", "x"]
          - ["0", "1"]
        quantities: [christoffel]

  - id: identities
    title: Identity search with applicability checks
    status: available
    group: knowledge
    where: [workbench, chat, api]
    summary: >-
      Retrieval proposes handbook identities that may fit an expression. The engine then matches each pattern,
      checks its validity conditions against your declared assumptions, rewrites, and verifies the rewrite.
    limits:
      - An identity whose conditions cannot be proven from your assumptions is reported, with the unmet
        conditions, and not applied.
      - Matches that only work by inventing roots, reciprocals or the imaginary unit are discarded.
      - Retrieval is keyword and structure based; semantic search is planned.
    examples:
      - id: identity-log-blocked
        title: The identity is found but not applied
        note: >-
          The identity matches, but \log(xy) = \log x + \log y needs both factors positive, which is not provable from the declared assumptions.
        op: identities
        format: text
        input: "log(x*y)"
        show: [log.product]
      - id: identity-log-applicable
        title: Applied once x and y are declared positive
        op: identities
        format: text
        input: "log(x*y)"
        assumptions: { x: [positive], y: [positive] }
        show: [log.product]
      - id: identity-product-to-sum
        title: Product to sum
        op: identities
        input: '\sin(a)\cos(b)'
        show: [trig.product_to_sum]

  - id: derivations
    title: Derivations in the workbench
    status: available
    group: interfaces
    where: [workbench, api]
    summary: >-
      Builds a derivation step by step without a language model. Each step is an operation (simplify, differentiate,
      integrate, Taylor polynomial) or a handbook identity applied to the previous result, and is verified and saved
      to your account with what produced it and the assumptions in force. You can continue from any earlier step.
    limits:
      - A step is carried forward as its text form, which the parser reads back exactly. A result the text parser
        cannot read (for example one using `erf` or `Piecewise`) is shown but cannot be continued.
      - An identity is offered only when the engine reports it applicable (conditions proven from your assumptions);
        applying it recomputes and re-verifies the rewrite on the server. Handbook entries that are only stated are never applied.
      - If you edit a carried-forward result, the next step is recorded as a new input, not a continuation.
    examples:
      - id: derivation-apply-identity
        title: Applying a handbook identity as a step
        note: >-
          In the workbench this is the Apply button next to an applicable identity; it appears only after the
          assumptions make the identity applicable.
        op: identities
        format: text
        input: "log(x*y)"
        assumptions: { x: [positive], y: [positive] }
        show: [log.product]

  - id: substitution
    title: Substituting relations
    status: available
    group: math
    where: [workbench, chat, api]
    summary: >-
      Replaces the left side of a relation you supply by its right side, one relation at a time, and records each
      replacement as a step with the relation it used. The relations are your premises: Minerva checks that the
      replacement reproduces the original expression, not that your relation is true, so a result that depends on
      them is shown as holding given them. If the result also holds without them, it says so.
    limits:
      - At most four relations, applied once each in the order you give. If another order would give a different
        result, or the relations rewrite each other, the request is refused until you say whether to apply them in the
        order listed or all at once; Minerva never picks one.
      - A relation that can never hold (`x = x + 1`) or relates only numbers is refused. A relation used as a
        commutation rule (`AB - BA = 1`) is not applied, because only patterns that occur in the expression are replaced.
      - Replacement finds the occurrences SymPy recognises; a pattern that does not occur leaves the expression unchanged.
      - The input must be an expression (not an equation). Noncommuting symbols are supported for polynomial
        expressions, and the order of their factors is kept.
      - Where a cancelled denominator excludes a point, the result states it (`x \neq 0`).
    examples:
      - id: substitution-pythagoras
        title: A relation replaces a part, and the result is conditional
        note: >-
          The step is shown before SymPy combines the terms. The result depends on your relation, so it is marked
          as holding given it.
        op: substitute
        input: "x^2 + y^2"
        relations: ["y^2 = 1 - x^2"]
      - id: substitution-physics
        title: Energy conservation
        op: substitute
        input: '\frac{1}{2} m v^2 + m g h'
        relations: ["v^2 = 2 g (H - h)"]
      - id: substitution-restriction
        title: A cancelled denominator is reported
        op: substitute
        input: '\frac{y}{x}'
        relations: ["y = x^2"]
      - id: substitution-order-refused
        title: The order matters, so Minerva asks
        note: >-
          Applying x = y first gives 2; applying y = 1 first gives y + 1. Nothing is shown until the order is stated.
        op: substitute
        input: "x + y"
        relations: ["x = y", "y = 1"]
      - id: substitution-order-given
        title: The order stated by the user
        op: substitute
        input: "x + y"
        relations: ["x = y", "y = 1"]
        order: given
      - id: substitution-false-premise
        title: A relation that can never hold is refused
        op: substitute
        input: "x + 1"
        relations: ["x = x + 1"]
      - id: substitution-absent
        title: The left side does not occur
        op: substitute
        input: "x + 1"
        relations: ["z = 2"]
      - id: substitution-noncommutative
        title: Noncommuting symbols keep their order
        op: substitute
        input: "A^2 B"
        relations: ["A B = D"]
        assumptions: { A: [noncommutative], B: [noncommutative], D: [noncommutative] }

  - id: rewrite-part
    title: Changing one part of an expression
    status: available
    group: math
    where: [workbench, chat, api]
    summary: >-
      Applies one move to one part of an expression and leaves the rest alone: expand, factor, cancel, simplify,
      collect terms by chosen variables or powers, or a handbook identity. You choose the part from a list the server
      makes (or type it); if it occurs more than once you choose the occurrence. The whole expression before and
      after is verified, and an identity whose conditions are not provable from your assumptions is reported and not applied.
    limits:
      - A part is chosen for one exact expression; if the expression has changed, the choice is refused as stale and
        never applied somewhere else.
      - An identity is matched against the chosen part alone, with the same filters as everywhere else (no invented
        roots, reciprocals or the imaginary unit).
      - Collect works on symbols and parts of the expression, at most four, and by commuting ones for noncommuting
        expressions. For noncommuting symbols only expand and collect are supported, on polynomial expressions;
        every other operation reports that it does not support them.
      - Verification is numerical, and symbolic where SymPy finds a zero; for noncommuting symbols random matrices
        sized from the degree are used.
    examples:
      - id: rewrite-expand-one-factor
        title: Expand one factor
        op: rewrite
        input: "(x + 1)^2 (y + 1)^2"
        part: "(x + 1)^2"
        action: expand
      - id: rewrite-identity-second-term
        title: A handbook identity on the second term
        op: rewrite
        input: '\sin(2x) + \sin(2y)'
        part: '\sin(2y)'
        action: rule
        rule: trig.double_sin
      - id: rewrite-one-of-two
        title: One of two equal places
        note: >-
          The same part occurs twice; only the chosen occurrence changes.
        op: rewrite
        input: '\sin(2x) + y \sin(2x)'
        part: '\sin(2x)'
        occurrence: 2
        action: rule
        rule: trig.double_sin
      - id: rewrite-collect
        title: Collect terms
        op: rewrite
        input: "a x^2 y + b x y^2 + c x^2 + d y^2"
        action: collect
        by: ["x"]
      - id: rewrite-conditions
        title: The identity is found but not applied
        note: >-
          log(xy) = log x + log y needs both factors positive; nothing in the declared assumptions says so.
        op: rewrite
        input: '\log(x y) + \log(x z)'
        part: '\log(x y)'
        action: rule
        rule: log.product
      - id: rewrite-stale
        title: A part that is not there
        op: rewrite
        input: '\sin x'
        part: '\tan x'
        action: expand
      - id: rewrite-noncommutative
        title: Expanding a square of noncommuting symbols
        op: rewrite
        input: "(A + B)^2 + x"
        part: "(A + B)^2"
        action: expand
        assumptions: { A: [noncommutative], B: [noncommutative] }

  - id: isolate
    title: Solving an equation for one variable
    status: available
    group: math
    where: [workbench, chat, api]
    summary: >-
      Isolates a variable in an equation and lists every solution with the conditions it needs: parameters that must
      not vanish, values the equation itself excludes, and the parameter values where it degenerates. Polynomial and
      rational equations are solved in closed form where one exists; a variable that occurs once inside powers, roots,
      exp and log is solved by undoing each operation, one recorded step at a time. Every solution is substituted back
      into your equation, and a separate check shows that none was dropped.
    limits:
      - Solutions are over the complex numbers. Assumptions on the unknown (real, positive) are not used to choose among
        them, and the result says so; a logarithm or an exponential gives a family with an integer k_1.
      - Supported are linear and quadratic factors with symbolic coefficients, cubic and quartic factors with rational
        coefficients, and one occurrence of the unknown inside sums, products, powers, principal roots, exp and log
        (a base is accepted only if known positive). Periodic inverses (sin, cos), absolute values, symbolic exponents of
        the unknown, systems of equations and symbolic polynomials of degree three or more are unsupported, and no
        partial answer is given.
      - A root that makes a denominator zero is removed, and a principal root can make a candidate extraneous (the
        equation √x = -2 has no solution). An equation with no solution is reported as such.
      - Noncommuting symbols are not supported here.
    examples:
      - id: isolate-linear
        title: The condition and the degenerate case
        op: isolate
        input: "a x + b = c"
        variable: x
      - id: isolate-kinematics
        title: Both roots of a quadratic
        op: isolate
        input: 's = u t + \frac{1}{2} a t^2'
        variable: t
      - id: isolate-lens
        title: A rational equation
        op: isolate
        input: '\frac{1}{f} = \frac{1}{u} + \frac{1}{v}'
        variable: v
      - id: isolate-extraneous
        title: The only candidate is excluded
        note: >-
          Clearing the denominator gives x = 1, which makes the denominator zero.
        op: isolate
        input: '\frac{x^2 - 1}{x - 1} = 2'
        variable: x
      - id: isolate-sqrt-extraneous
        title: Squaring creates an extraneous candidate
        op: isolate
        input: '\sqrt{x} = -2'
        variable: x
      - id: isolate-exponential
        title: An exponential gives a family of solutions
        op: isolate
        input: 'N = M \exp(-r t)'
        variable: t
      - id: isolate-inverse-square
        title: A root of each sign
        op: isolate
        input: 'F = \frac{G m n}{r^2}'
        variable: r
      - id: isolate-periodic-refused
        title: A periodic inverse is not supported
        op: isolate
        input: '\sin x = a'
        variable: x
      - id: isolate-quintic-refused
        title: No closed form in general
        op: isolate
        input: "x^5 + a x + 1 = 0"
        variable: x

  - id: polynomial-solving
    title: Polynomial equations
    status: available
    group: math
    where: [chat]
    summary: >-
      Factors a polynomial equation, says whether a formula in radicals exists (Galois criterion, Abel–Ruffini),
      gives exact roots where they exist and numerical roots otherwise, and verifies the roots by substitution
      and Vieta's relations.
    limits:
      - Polynomial equations in one variable only; other equations are not solved.
    examples:
      - id: solve-cubic
        title: A cubic that factors
        op: solve
        equation: "x^3 + x^2 + x + 1 = 0"
        variable: x
      - id: solve-quintic
        title: A quintic with no formula in radicals
        op: solve
        equation: "x^5 - x - 1 = 0"
        variable: x

  - id: lagrangian
    title: Lagrangian mechanics
    status: available
    group: physics
    where: [chat]
    summary: >-
      From a Lagrangian and its coordinates, derives the Euler–Lagrange equations, momenta and accelerations,
      and finds constants of motion by cyclic coordinates, time translation and rotations of coordinate pairs.
      Each constant is verified: its time derivative is zero on the equations of motion.
    limits:
      - Symmetries that hold only up to a total time derivative (Galilean boosts) are not searched for, and the
        result says so. Hidden symmetries such as the Runge–Lenz vector are not found here; the separate search
        for more constants of motion looks for them in a declared family.
    examples:
      - id: lagrangian-kepler-polar
        title: Kepler problem in polar coordinates
        op: lagrangian
        format: text
        input: "m*(r_dot^2 + r^2*theta_dot^2)/2 + k/r"
        coordinates: [r, theta]
      - id: lagrangian-kepler-cartesian
        title: The same problem in Cartesian coordinates
        op: lagrangian
        input: '\frac12 m(\dot{x}^2 + \dot{y}^2) + \frac{k}{\sqrt{x^2+y^2}}'
        coordinates: [x, y]
      - id: lagrangian-time-dependent
        title: Explicit time dependence removes the energy
        op: lagrangian
        format: text
        input: "m*x_dot^2/2 - k*x^2*t/2"
        coordinates: [x]

  - id: discovery
    title: Find the conserved quantities of a system
    status: available
    group: physics
    where: [workbench, chat, api]
    summary: >-
      Give a Lagrangian or a Hamiltonian and ask for its conserved quantities. Minerva derives the equations of
      motion (confirmed by numerical differentiation), then searches a deterministic ladder of larger and larger
      families of candidates: polynomials in the velocities or momenta times powers of the coordinates, cos and sin
      of angles (declared, detected, or cyclic) and powers of t. In each family the conservation condition is
      solved exactly; a candidate is shown only if it is verified on the equations of motion, and products of what
      is already known are not counted as discoveries. It then reports which constants are functionally independent
      (an exact Jacobian rank, with the algebraic relations that tie the rest to them) and exactly which families
      were and were not searched. You do not choose an ansatz, a power bound or the angles.
    limits:
      - Complete within each family searched and nothing more. No additional constant always means within the
        explored families, never that the system has none.
      - Only rational equations of motion are searched. Square roots (Cartesian Kepler), logarithms and non-polynomial
        time dependence are reported as unsupported. At most 3 coordinates.
      - Families are capped (350 unknown coefficients by default); larger ones are listed as not searched.
      - Parameters are generic. Constants that exist only at special values (resonant frequency ratios) are found
        only when those values are given.
      - Functional independence is a proved lower bound (exact rank at rational points); it is called exact only
        when an upper bound from the relations meets it. Numerical sampling is never used as proof.
      - A name such as Runge–Lenz is a recognition the model may offer afterwards; the search never uses it.
    examples:
      - id: discovery-kepler
        title: Kepler problem, from the Lagrangian alone
        note: >-
          No angle, power bound or invariant is given. The search expands until both components of the Laplace–Runge–Lenz
          vector appear, and reports that, with the energy and angular momentum, only three of the four are
          functionally independent, with the exact relation between them.
        op: discovery
        input: '\frac12 m(\dot{r}^2 + r^2\dot{\theta}^2) + \frac{k}{r}'
        coordinates: [r, theta]
      - id: discovery-kepler-hamiltonian
        title: The same system as a Hamiltonian
        op: discovery
        system: hamiltonian
        input: '\frac{p_r^2}{2m} + \frac{p_\theta^2}{2 m r^2} - \frac{k}{r}'
        coordinates: [r, theta]
        momenta: [p_r, p_theta]
      - id: discovery-resonant
        title: A resonant oscillator has an extra invariant
        note: >-
          With frequencies in the ratio 1 : 2 a constant of degree 3 in the momenta appears; the search reaches it
          by raising the degree by itself.
        op: discovery
        system: hamiltonian
        input: '\frac{p_1^2 + q_1^2}{2} + \frac{p_2^2 + 4 q_2^2}{2}'
        coordinates: [q_1, q_2]
        momenta: [p_1, p_2]
      - id: discovery-henon-heiles
        title: Hénon–Heiles, none within the explored families
        note: >-
          Only the energy is known; nothing else is found. This says nothing about families that were not searched.
        op: discovery
        input: '\frac12(\dot{x}^2 + \dot{y}^2) - \frac12(x^2 + y^2) - x^2 y + \frac13 y^3'
        coordinates: [x, y]
      - id: discovery-cartesian-kepler
        title: A square root is refused
        op: discovery
        input: '\frac12 m(\dot{x}^2 + \dot{y}^2) + \frac{k}{\sqrt{x^2 + y^2}}'
        coordinates: [x, y]

  - id: invariants
    title: Search for hidden constants of motion
    status: available
    group: physics
    where: [chat]
    summary: >-
      Looks for constants of motion beyond cyclic coordinates, energy and rotations, such as the
      Runge–Lenz vector of the Kepler problem. It solves exactly for every combination of functions of the
      coordinates (powers, and cos and sin of coordinates you declare to be angles) times velocity monomials of
      a chosen degree whose time derivative vanishes on the equations of motion. Only constants that pass the
      same verification as the others are shown, and the known ones and their products are left out of the count.
    limits:
      - It searches one declared family and says which. Finding nothing proves nothing outside that family.
      - Time-dependent Lagrangians, accelerations with square roots or other non-rational functions, and more
        than three coordinates are refused.
      - The family is capped (500 unknown coefficients); a bigger one is reported as a resource limit.
      - Naming a constant (for example as the Runge–Lenz vector) is a recognition the model may offer, not
        something the search proves.
    examples:
      - id: invariants-kepler-polar
        title: Kepler problem, with the angle declared
        note: >-
          Both components of the Laplace–Runge–Lenz vector appear, up to a constant factor, without being
          looked up. The angular momentum and energy are known already and are not counted.
        op: invariants
        format: text
        input: "m*(r_dot^2 + r^2*theta_dot^2)/2 + k/r"
        coordinates: [r, theta]
        angles: [theta]
      - id: invariants-oscillator
        title: Isotropic oscillator in the plane
        note: >-
          The cross term and the energy of one direction, the components of the Fradkin tensor, beyond the
          energy and angular momentum.
        op: invariants
        format: text
        input: "m*(x_dot^2 + y_dot^2)/2 - k*(x^2 + y^2)/2"
        coordinates: [x, y]
      - id: invariants-henon-heiles
        title: Hénon–Heiles, none in this family
        note: >-
          Only the energy is known and nothing else is found. That says nothing about constants outside the
          searched family.
        op: invariants
        input: '\frac12(\dot{x}^2 + \dot{y}^2) - \frac12(x^2 + y^2) - x^2 y + \frac13 y^3'
        coordinates: [x, y]
      - id: invariants-time-dependent
        title: Explicit time dependence is refused
        op: invariants
        format: text
        input: "m*x_dot^2/2 - k*t*x^2/2"
        coordinates: [x]

  - id: tensors
    title: Tensor canonicalization
    status: available
    group: math
    where: [api, chat]
    summary: >-
      Puts a tensor expression in canonical form using declared index symmetries (symmetric, antisymmetric,
      Riemann-type), through SymPy's Butler–Portugal algorithm.
    limits:
      - Only symmetries of a single term are applied. Multi-term identities such as the Bianchi identity are out
        of scope and are not applied.
      - The result is not independently verified; the report says so.
      - There is no workbench form for tensors yet.
    examples:
      - id: tensor-contraction
        title: Symmetric contracted with antisymmetric
        op: tensor
        input: "S(a,b)*A(-a,-b)"
        tensors:
          S: { rank: 2, symmetry: symmetric }
          A: { rank: 2, symmetry: antisymmetric }
      - id: tensor-riemann-contraction
        title: Riemann tensor contracted with a symmetric pair
        op: tensor
        input: "R(a,b,c,d)*S(-a,-b)"
        tensors:
          R: { rank: 4, symmetry: riemann }
          S: { rank: 2, symmetry: symmetric }
      - id: tensor-pair-symmetry
        title: Pair exchange symmetry
        op: tensor
        input: "R(a,b,c,d) - R(c,d,a,b)"
        tensors:
          R: { rank: 4, symmetry: riemann }
      - id: tensor-bianchi
        title: The cyclic sum is left alone
        note: >-
          This cyclic sum vanishes by the algebraic Bianchi identity, a multi-term identity that Minerva does not apply, so it is returned in canonical form and not as 0.
        op: tensor
        input: "R(a,b,c,d) + R(a,c,d,b) + R(a,d,b,c)"
        tensors:
          R: { rank: 4, symmetry: riemann }

  - id: handbook
    title: Citable handbook
    status: available
    group: knowledge
    where: [reference, chat, api]
    summary: >-
      Handbook entries state identities, integrals, series, special functions and physical equations in original
      wording and cite sources by locator only. Each entry is verified at a declared level, or labelled "stated"
      when it is a literature record that is never applied.
    limits:
      - Entries recorded from the literature ("stated") carry no rule and are never used to rewrite anything.
      - Coverage is limited and growing; quantum field theory is stated entries only.
    examples:
      - id: entry-log-product
        title: A checked identity with its condition
        op: entry
        entry: log.product
      - id: entry-klein-gordon
        title: A stated literature record
        op: entry
        entry: qft.klein_gordon

  - id: chat
    title: Chat with a model you host
    status: available
    group: interfaces
    where: [chat]
    needs_model: true
    summary: >-
      A conversation in which a language model plans, asks and explains, and calls the tools above. It runs
      only when you connect a model, such as one served by Ollama; it is off by default.
    limits:
      - The model never computes and never decides correctness. Formulas it writes that no tool produced in
        the conversation are shown as unchecked. Equations it writes are called false only when
        the sides differ by a constant; definitions, coordinate changes and equations of motion are not
        identities, stay unchecked, and are judged only against definitions stated earlier in the conversation.
      - How well it chooses tools depends on the model, and no model tried so far passes every evaluation case.
        See docs/model-evaluation.md.
      - Only Ollama-compatible hosts are supported.

  - id: formula-image
    title: Read formulas from a photo
    status: available
    group: interfaces
    where: [chat]
    needs_model: true
    summary: >-
      Attach a photo or screenshot of an equation in the chat. A vision model you host transcribes it to
      LaTeX, you confirm or correct the transcription, and Minerva's strict parser shows how it reads each
      formula before anything is computed. The model only transcribes; it never solves, simplifies or
      decides anything about the image.
    limits:
      - A transcription can be wrong, which is why you confirm it before it is used. Only what the parser
        accepts from the confirmed text is passed on to the tools.
      - Ambiguous notation is refused exactly as typed input is, for example `\sin 2x`.
      - Images are never stored or logged, and are limited in size to PNG, JPEG or WebP files.
      - It needs a vision-capable model on the Ollama-compatible host you connect.
    examples:
      - id: image-read-clean
        title: A transcribed equation, read by the strict parser
        note: >-
          This is the step after the vision model and your confirmation: the confirmed LaTeX is read by the
          same parser as typed input, and nothing is simplified.
        op: read_formulas
        formulas:
          - "x^2 + 2x + 1 = (x+1)^2"
      - id: image-read-ambiguous
        title: A transcription with ambiguous notation is refused
        op: read_formulas
        formulas:
          - '\sin 2x'

  - id: finite-sums
    title: Finite sums and products
    status: available
    group: statistics
    where: [workbench, chat, api]
    summary: >-
      Expand, factor and differentiate finite sums and products with symbolic bounds, over indexed data
      (`Sum(x[i]^2, (i, 1, n))` in text, `\sum_{i=1}^{n} x_i^2` in LaTeX). A rewrite is shown only if it agrees with the
      original on explicit expansions at several sizes (always including n of at least 2) with a separate unknown for
      every element; sampling one number per symbol would accept `sum x^2 = (sum x)^2 / n`, which is true for
      n = 1, so no other operation accepts a sum. Agreement at those sizes is evidence, not a proof for every n.
    limits:
      - Bounds must be provably non-empty integers (declare the upper bound an integer and positive); infinite sums are declined.
      - At most two nested sums; `x_{ij}` and `x_{i,j}` are declined as ambiguous.
      - The result is worded "checked for n = ...", never "proved for every n".
      - "`log(prod f) = sum log f` needs every factor provably positive."
    examples:
      - id: sum-expand-squares
        title: Expand a sum of squared deviations
        op: sums
        format: text
        input: "Sum((x[i] - mu)^2, (i, 1, n))"
        assumptions: { n: [integer, positive], x: [real], mu: [real] }
        action: expand
      - id: sum-sample-variance-identity
        title: The identity behind the sample variance
        op: sums
        format: text
        input: "Sum((x[i] - Sum(x[j], (j, 1, n))/n)^2, (i, 1, n))"
        assumptions: { n: [integer, positive], x: [real] }
        action: expand
      - id: sum-latex
        title: The same in LaTeX
        op: sums
        input: '\sum_{i=1}^{n}(x_i-\mu)^2'
        assumptions: { n: [integer, positive], x: [real], mu: [real] }
        action: expand
      - id: sum-log-of-product
        title: The log of a product, for positive factors
        op: sums
        format: text
        input: "log(Product(x[i], (i, 1, n)))"
        assumptions: { n: [integer, positive], x: [positive] }
        action: log_of_product
      - id: sum-false-identity
        title: A false identity that holds for n = 1 is rejected
        op: sums
        format: text
        input: "Sum(x[i]^2, (i, 1, n))"
        assumptions: { n: [integer, positive], x: [real] }
        action: check
        candidate: { result: "Sum(x[i], (i, 1, n))^2/n" }
      - id: sum-range-not-provable
        title: A range that cannot be shown non-empty is declined
        op: sums
        format: text
        input: "Sum(x[i], (i, 1, m))"
        assumptions: { x: [real] }
        action: expand

  - id: expectations
    title: Expectation, variance and covariance
    status: available
    group: statistics
    where: [workbench, chat, api]
    summary: >-
      Linearity of expectation and bilinearity of covariance for declared random variables, including sums over
      indexed variables. Independence is never assumed: covariance terms stay unless you state independence, and a
      result that used it holds given it (Minerva does not check that it is true). A result is shown only if it
      agrees with the original on explicit finite joint distributions that are dependent unless independence was declared.
    limits:
      - Only variables you list are random; an expectation with none of them is declined.
      - One independence group is supported, and `[["X"]]` for an indexed X means its components are mutually independent.
      - Moments are assumed to exist (the check uses finite supports).
      - The check is evidence from explicit distributions, not a proof for every distribution.
    examples:
      - id: var-of-sum
        title: Variance of a sum keeps the covariance
        op: expectation
        format: text
        input: "Var(X + Y)"
        random: [X, Y]
      - id: var-of-sum-independent
        title: With independence stated, the result holds given it
        op: expectation
        format: text
        input: "Var(X + Y)"
        random: [X, Y]
        independent: [[X, Y]]
      - id: covariance-from-moments
        title: Covariance from raw moments
        op: expectation
        format: text
        input: "Cov(X, Y)"
        random: [X, Y]
        action: to_moments
      - id: product-without-independence
        title: E[XY] does not factor without independence
        op: expectation
        format: text
        input: "E[X*Y]"
        random: [X, Y]
      - id: var-wrong-answer
        title: Dropping the covariance term is rejected
        op: expectation
        format: text
        input: "Var(X + Y)"
        random: [X, Y]
        action: check
        candidate: { result: "Var(X) + Var(Y)" }

  - id: statistical-derivations
    title: Maximum likelihood, Fisher information and Bayesian updates
    status: available
    group: statistics
    where: [workbench, chat, api]
    summary: >-
      Derive, from a density, the moments of a family (Bernoulli, binomial, Poisson, normal, beta, gamma, Cauchy,
      uniform), the log-likelihood and score, the maximum-likelihood estimator, the Fisher information and the posterior
      for a prior. Estimators come from the score equations and are accepted only if the direct log-likelihood has zero
      slope there, the point lies in the parameter space and the Hessian is negative definite; an optimum is called global
      only when concavity is proved. Posteriors are found by matching the kernel, never from a table. Independence of
      observations is never assumed; a likelihood of several observations needs you to state it.
    limits:
      - Estimates that lie outside the parameter space for the data (a Bernoulli sample of all zeros, identical normal observations) are declined, not invented.
      - Families whose support depends on the parameter (uniform on (0, theta)) have no score or information.
      - The score equations are solved one parameter at a time (triangular systems); moments of the Cauchy family do not exist and are declined.
      - A prior is your assumption; the posterior holds for it. Only kernels of the supported families are recognised.
      - Numerical agreement (quadrature, a direct log-likelihood) is evidence, not a proof; the symbolic parts are stated separately.
    examples:
      - id: gaussian-mle
        title: Maximum-likelihood estimators of a normal mean and variance
        op: statistics
        family: normal
        parametrization: variance
        observation: x
        sample_size: n
        iid: true
        estimate: [mu, v]
        action: mle
        assumptions: { n: [integer, positive], x: [real] }
      - id: bernoulli-mle
        title: The sample proportion, and where it exists
        op: statistics
        family: bernoulli
        observation: x
        sample_size: n
        iid: true
        estimate: [p]
        action: mle
        assumptions: { n: [integer, positive] }
      - id: bernoulli-all-zeros
        title: No maximum-likelihood estimate for a sample of all zeros
        op: statistics
        family: bernoulli
        observation: x
        sample_size: "4"
        iid: true
        estimate: [p]
        action: mle
        data: ["0", "0", "0", "0"]
      - id: mle-needs-independence
        title: Several observations need a statement of independence
        op: statistics
        family: normal
        parametrization: variance
        parameters: { v: v }
        observation: x
        sample_size: n
        estimate: [mu]
        action: mle
        assumptions: { n: [integer, positive], v: [positive], x: [real] }
      - id: normal-fisher-information
        title: Fisher information of a normal mean and standard deviation
        op: statistics
        family: normal
        estimate: [mu, sigma]
        action: fisher_information
        assumptions: { mu: [real], sigma: [positive] }
      - id: beta-binomial-posterior
        title: A Beta prior and a binomial likelihood
        op: statistics
        family: binomial
        parameters: { n: n }
        observation: k
        estimate: [p]
        prior: { family: beta, parameters: { alpha: alpha, beta: beta } }
        action: posterior
        assumptions:
          { n: [integer, positive], k: [integer, nonnegative], alpha: [positive], beta: [positive] }
      - id: gamma-moments
        title: Moments derived from a density
        op: statistics
        family: gamma
        parameters: { alpha: alpha, beta: beta }
        action: moments
        assumptions: { alpha: [positive], beta: [positive] }
      - id: cauchy-mean-does-not-exist
        title: The mean of a Cauchy variable is declined
        op: statistics
        family: cauchy
        action: moments
      - id: uniform-has-no-information
        title: A support that depends on the parameter has no Fisher information
        op: statistics
        family: uniform_0_theta
        estimate: [theta]
        action: fisher_information
        assumptions: { theta: [positive] }

  - id: matrix-gradients
    title: Gradients, Jacobians and Hessians of matrix functions
    status: available
    group: statistics
    where: [workbench, chat, api]
    summary: >-
      Derivatives of scalar functions of vectors and matrices, such as the Gaussian log-likelihood with respect to
      the mean or the covariance (`-1/2*logdet(S) - 1/2*transpose(x - mu)*inv(S)*(x - mu)`), built by differentials
      and accepted only if central differences of the original function agree at random real matrices of the declared
      sizes. Matrices keep their order; the derivative with respect to a symmetric matrix is the gradient within
      the symmetric matrices (the unconstrained gradient is never returned for it), with the entrywise form labelled separately.
    limits:
      - Plain-text syntax only for these actions (`tr`, `det`, `logdet`, `transpose`, `inv`, `*` for the matrix product); `logdet` means log of the absolute determinant.
      - Over the real numbers (a transpose, not a conjugate transpose); Hermitian and Wirtinger derivatives are not supported.
      - "`inv`, `logdet` and the derivative of `det` need the matrix declared invertible (or positive definite) by you."
      - Matrix-valued functions have no gradient here (the derivative of a matrix by a matrix is a fourth-order tensor).
      - The symbolic leg is not run; numerical agreement is evidence, not a proof.
    examples:
      - id: gaussian-gradient-mean
        title: The Gaussian log-density with respect to the mean
        op: matrix
        format: text
        input: "-1/2*transpose(x - mu)*inv(S)*(x - mu)"
        matrices:
          - { name: x, rows: 3, cols: 1 }
          - { name: mu, rows: 3, cols: 1 }
          - { name: S, rows: 3, cols: 3, positive_definite: true }
        action: gradient
        variable: mu
      - id: gaussian-gradient-covariance
        title: With respect to a positive definite covariance
        op: matrix
        format: text
        input: "-1/2*logdet(S) - 1/2*transpose(x - mu)*inv(S)*(x - mu)"
        matrices:
          - { name: x, rows: 3, cols: 1 }
          - { name: mu, rows: 3, cols: 1 }
          - { name: S, rows: 3, cols: 3, positive_definite: true }
        action: gradient
        variable: S
      - id: quadratic-form-hessian
        title: The Hessian of a quadratic form
        op: matrix
        format: text
        input: "transpose(x)*A*x"
        matrices:
          - { name: A, rows: 3, cols: 3 }
          - { name: x, rows: 3, cols: 1 }
        action: hessian
        variable: x
      - id: logdet-needs-invertible
        title: An inverse is never assumed
        op: matrix
        format: text
        input: "logdet(X)"
        matrices:
          - { name: X, rows: 3, cols: 3 }
        action: gradient
        variable: X

