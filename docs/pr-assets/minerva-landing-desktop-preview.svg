<text x="680" y="44" font-family="Arial" font-size="13" fill="#5b5d68" >Why Minerva</text>
<text x="777" y="44" font-family="Arial" font-size="13" fill="#5b5d68" >Examples</text>
<text x="865" y="44" font-family="Arial" font-size="13" fill="#5b5d68" >Docs</text>
<text x="920" y="44" font-family="Arial" font-size="13" fill="#5b5d68" >Self-host</text>
<text x="1000" y="44" font-family="Arial" font-size="13" fill="#5b5d68" >GitHub</text>
<rect x="1057" y="19" width="104" height="36" rx="5" fill="#2c3e9b"/>
<text x="1070" y="42" font-family="Arial" font-size="13" fill="#fff" >Try Minerva</text>
<text x="140" y="141" font-family="Arial" font-size="14" fill="#5b5d68" letter-spacing="2">OPEN SOURCE  ·  SELF-HOSTABLE  ·  BRING YOUR OWN MODEL</text>
<text x="140" y="220" font-family="Georgia" font-size="55" fill="#1a1b20" >For the joy of figuring things out.</text>
<text x="140" y="284" font-family="Georgia" font-size="24" fill="#5b5d68" >Minerva is your own mathematical assistant, built for curious minds who</text>
<text x="140" y="320" font-family="Georgia" font-size="24" fill="#5b5d68" >love exploring ideas, discovering connections, and solving problems.</text>
<text x="140" y="356" font-family="Georgia" font-size="24" fill="#5b5d68" >Find useful identities, try different approaches, and check your reasoning</text>
<text x="140" y="392" font-family="Georgia" font-size="24" fill="#5b5d68" >without losing the pleasure of figuring things out for yourself.</text>
<text x="140" y="453" font-family="Arial" font-size="16" fill="#5b5d68" >Run it on your own hardware, connect a language model of your choice, or</text>
<text x="140" y="476" font-family="Arial" font-size="16" fill="#5b5d68" >use the symbolic tools without AI. Open source, with mathematics you can check.</text>
<rect x="140" y="535" width="145" height="48" rx="5" fill="#2c3e9b"/>
<text x="161" y="566" font-family="Arial" font-size="16" fill="#fff" >Try Minerva</text>
<rect x="300" y="535" width="188" height="48" rx="5" fill="none" stroke="#e3e0d8"/>
<text x="320" y="566" font-family="Arial" font-size="16" fill="#1a1b20" >Explore the source</text>
<text x="140" y="623" font-family="Arial" font-size="14" fill="#5b5d68" >Self-hosting guide  ·  Read the docs</text>
<line x1="120" y1="704" x2="1080" y2="704" stroke="#e3e0d8"/>
<text x="140" y="780" font-family="Georgia" font-size="41" fill="#1a1b20" >Why Minerva</text>
<text x="140" y="836" font-family="Georgia" font-size="25" fill="#1a1b20" >Stay curious</text>
<text x="630" y="836" font-family="Georgia" font-size="25" fill="#1a1b20" >A tool that helps you think</text>
<text x="140" y="870" font-family="Arial" font-size="15" fill="#5b5d68" >Mathematics is about more than finding the right answer.</text>
<text x="630" y="870" font-family="Arial" font-size="15" fill="#5b5d68" >Search for useful identities and investigate methods.</text>
