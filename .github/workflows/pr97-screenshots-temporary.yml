name: PR 97 screenshots from built site (temporary)
on:
  push:
    branches:
      - docs/landing-value-proposition-20261118
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - name: Install and build actual Next.js site
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @minerva/site build
      - name: Install screenshot harness
        run: |
          python3 -m venv /tmp/pr97-capture-venv
          /tmp/pr97-capture-venv/bin/pip install --quiet playwright pillow
          if ! command -v google-chrome >/dev/null 2>&1; then
            /tmp/pr97-capture-venv/bin/python -m playwright install chromium
          fi
      - name: Verify rendered mathematics and capture real page
        run: |
          /tmp/pr97-capture-venv/bin/python - <<'PY'
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from io import BytesIO
          from pathlib import Path
          from threading import Thread
          import shutil
          from PIL import Image
          from playwright.sync_api import sync_playwright

          out = Path("apps/site/out").resolve()
          assert (out / "index.html").is_file(), f"Site output absent: {out}"
          handler = partial(SimpleHTTPRequestHandler, directory=str(out))
          server = ThreadingHTTPServer(("127.0.0.1", 0), handler)
          Thread(target=server.serve_forever, daemon=True).start()
          url = f"http://127.0.0.1:{server.server_port}/"
          dest = Path("docs/pr-assets/screenshots")
          dest.mkdir(parents=True, exist_ok=True)

          def save_png_to_webp(data, filename):
              picture = Image.open(BytesIO(data)).convert("RGB")
              picture.save(dest / filename, "WEBP", quality=85, method=6)
              print(f"{filename}: {picture.width}x{picture.height} pixels, {(dest / filename).stat().st_size} bytes", flush=True)

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  channel="chrome" if shutil.which("google-chrome") else None,
                  args=["--no-sandbox"],
              )
              for device, width, height in [("desktop", 1440, 900), ("mobile", 390, 844)]:
                  for theme in ("light", "dark"):
                      page = browser.new_page(viewport={"width": width, "height": height}, device_scale_factor=1, color_scheme=theme, reduced_motion="reduce")
                      page.goto(url, wait_until="networkidle", timeout=60000)
                      page.evaluate("document.fonts.ready")
                      assert page.locator("[data-math-error]").count() == 0, "KaTeX rendered an error!"
                      card = page.locator("article").filter(has_text="No assumptions. No shortcuts.")
                      assert card.count() == 1, "Expected exactly one logarithm identity card"
                      annotations = card.locator("annotation").all_text_contents()
                      assert len(annotations) == 2, f"Expected input and output math; got {annotations!r}"
                      assert annotations[0].startswith("\\log"), f"Input malformed: {annotations[0]!r}"
                      assert annotations[1].startswith("\\log") and "= \\log" in annotations[1], f"Output malformed: {annotations[1]!r}"
                      assert "log" in card.inner_text(), "Logarithm not visible"
                      dims = page.evaluate("({visible: window.innerWidth, full: document.documentElement.scrollWidth})")
                      assert dims["full"] <= dims["visible"] + 2, f"Horizontal overflow: {dims}"
                      print(f"{device}/{theme}: rendered logarithm LaTeX {annotations!r}; no KaTeX errors; no horizontal overflow", flush=True)
                      save_png_to_webp(page.screenshot(full_page=True, animations="disabled"), f"minerva-{device}-{theme}.webp")
                      if theme == "light":
                          proof = page.get_by_role("heading", name="Small calculations. Clear evidence.").locator("..")
                          save_png_to_webp(proof.screenshot(animations="disabled"), f"minerva-{device}-proof.webp")
                          figures = page.locator("#examples figure")
                          assert figures.count() == 2
                          first = figures.nth(0).bounding_box()
                          second = figures.nth(1).bounding_box()
                          # Get document-space coordinates independent of viewport scrolling.
                          full_png = Image.open(BytesIO(page.screenshot(full_page=True, animations="disabled"))).convert("RGB")
                          top = max(0, int(first["y"] + page.evaluate("scrollY")) - 4)
                          bottom = min(full_png.height, int(second["y"] + page.evaluate("scrollY") + second["height"]) + 6)
                          assert bottom > top + 200
                          preview = full_png.crop((0, top, full_png.width, bottom))
                          preview.save(dest / f"minerva-{device}-examples.webp", "WEBP", quality=85, method=6)
                          print(f"minerva-{device}-examples.webp: {preview.width}x{preview.height} pixels", flush=True)
                      page.close()
              browser.close()
          server.shutdown()
          PY
      - name: Commit refreshed screenshot assets to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pr-assets/screenshots
          if git diff --cached --quiet; then
            echo "Screenshot assets already current."
            exit 0
          fi
          git commit -m "docs(site): refresh PR 97 screenshots from actual Next.js output"
          git push origin HEAD:refs/heads/docs/landing-value-proposition-20261118
