name: CI

# Trusted code (branches of this repository, and main via the Deploy workflow) runs on the self-hosted `minerva-runners`
# scale set, which provides a PostgreSQL sidecar on 127.0.0.1:5432 and a rootless BuildKit sidecar.
# Pull requests from forks run the same checks on GitHub-hosted runners, with SQLite instead of
# PostgreSQL and without any secret or image build, so untrusted code never reaches the cluster.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs a pull request needs, so a docs-only change does not start the cluster runners.
  # Everything runs for pushes to main and for the Deploy workflow. Plain git, no third-party action;
  # the default pull_request checkout is a merge commit whose first parent is the base branch.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.paths.outputs.python }}
      web: ${{ steps.paths.outputs.web }}
      chart: ${{ steps.paths.outputs.chart }}
      images: ${{ steps.paths.outputs.images }}
      workflows: ${{ steps.paths.outputs.workflows }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            files=""; all=true
          else
            files=$(git diff --name-only HEAD^1 HEAD); all=false
          fi
          match() { [ "$all" = true ] || printf '%s\n' "$files" | grep -Eq "$1"; }
          out() { if match "$2"; then echo "$1=true"; else echo "$1=false"; fi; }
          {
            out python '^(packages/|services/|scripts/|pyproject\.toml$|uv\.lock$|AGENTS\.md$|CLAUDE\.md$|\.agents/|\.claude/|\.github/)'
            out web '^(apps/|packages/ui/|package\.json$|pnpm-|\.prettier|\.github/)'
            out chart '^(deploy/|scripts/|\.github/)'
            out images '^(deploy/|apps/|packages/|services/|scripts/|pnpm-|uv\.lock$|pyproject\.toml$|\.github/)'
            out workflows '^\.github/'
          } | tee -a "$GITHUB_OUTPUT"

  python:
    name: Python (lint, types, tests, handbook)
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'minerva-runners' }}
    timeout-minutes: 20
    env:
      # Forks have no PostgreSQL sidecar: the tests then use in-memory SQLite. (Both branches are non-empty
      # strings; `cond && '' || x` would always pick x because '' is falsy in expressions.)
      MINERVA_TEST_DATABASE_URL: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'sqlite+pysqlite:///:memory:' || 'postgresql+psycopg://postgres@127.0.0.1:5432/postgres' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: The handbook data is tracked (a .gitignore rule once hid it)
        run: git ls-files --error-unmatch packages/knowledge/src/minerva_knowledge/data/chapters.yaml
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages/engine/src packages/knowledge/src services/api/src
      - name: Verify every handbook entry at its declared level
        run: uv run python -m minerva_knowledge verify
      - name: Migrations apply and match the models (PostgreSQL)
        if: ${{ !startsWith(env.MINERVA_TEST_DATABASE_URL, 'sqlite') }}
        working-directory: services/api
        run: |
          export MINERVA_DATABASE_URL="$MINERVA_TEST_DATABASE_URL"
          uv run alembic upgrade head
          uv run alembic check
      - name: Agent files and skills are consistent
        run: uv run python scripts/check_agent_files.py
      - run: uv run pytest

  web:
    name: Web (lint, types, tests, build)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'minerva-runners' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Node first: the stock self-hosted runner image has no `node`, and pnpm's installer needs it.
      # No package-manager cache: pods are ephemeral, and setup-node v5 would otherwise look for pnpm before it is installed.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          MINERVA_API_URL: http://localhost:8100

  chart:
    name: Helm chart
    needs: changes
    if: ${{ needs.changes.outputs.chart == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'minerva-runners' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Lint and render the production overlay (fake digests)
        run: |
          D=sha256:$(printf 'a%.0s' {1..64})
          SET=(--set api.image.digest=$D --set web.image.digest=$D --set site.image.digest=$D)
          helm lint deploy/helm/minerva -f deploy/helm/minerva/values-production.yaml "${SET[@]}"
          helm template minerva deploy/helm/minerva -f deploy/helm/minerva/values-production.yaml "${SET[@]}" > /dev/null
      - name: Missing digests must be refused in production
        run: |
          if helm template minerva deploy/helm/minerva -f deploy/helm/minerva/values-production.yaml > /dev/null 2>&1; then
            echo "::error::requireDigests did not reject a release without image digests"; exit 1
          fi
      - run: bash -n scripts/build-image.sh

  images:
    name: Build images (not pushed)
    # Only trusted code: needs the BuildKit sidecar of the self-hosted runner.
    needs: changes
    if: needs.changes.outputs.images == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: minerva-runners
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: bash scripts/build-image.sh deploy/docker/api.Dockerfile ghcr.io/oscarjhernandez/minerva-api:ci no-push
      - run: bash scripts/build-image.sh deploy/docker/web.Dockerfile ghcr.io/oscarjhernandez/minerva-web:ci no-push
      - run: bash scripts/build-image.sh deploy/docker/site.Dockerfile ghcr.io/oscarjhernandez/minerva-site:ci no-push

  security:
    name: Dependency audit and secret scan
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'minerva-runners' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"
      - name: Python dependencies (pip-audit)
        run: |
          uv export --frozen --no-hashes --no-emit-workspace > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
      # Node first: the stock self-hosted runner image has no `node`, and pnpm's installer needs it.
      # No package-manager cache: pods are ephemeral, and setup-node v5 would otherwise look for pnpm before it is installed.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: JavaScript dependencies (high and above)
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm audit --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  workflows:
    name: Workflow lint (actionlint, zizmor)
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'minerva-runners' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uvx --from actionlint-py actionlint
      - name: Static analysis of workflows (offline, no token needed)
        run: uvx zizmor --offline --config .github/zizmor.yml .github/workflows

  # One stable name for branch protection: skipped jobs count as passing, failed or cancelled ones do not.
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, python, web, chart, images, security, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a required job ended as '$r'"; exit 1;; esac
          done
