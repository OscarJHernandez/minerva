name: CI

# Trusted code (branches of this repository, and main via the Deploy workflow) runs on the self-hosted `minerva-runners`
# scale set, which provides a PostgreSQL sidecar on 127.0.0.1:5432 and a rootless BuildKit sidecar.
# Pull requests from forks run the same checks on GitHub-hosted runners, with SQLite instead of
# PostgreSQL and without any secret or image build, so untrusted code never reaches the cluster.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs a pull request needs, so a docs-only change does not start the cluster runners.
  # Everything runs for pushes to main and for the Deploy workflow. Plain git, no third-party action;
  # the default pull_request checkout is a merge commit whose first parent is the base branch.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.paths.outputs.python }}
      web: ${{ steps.paths.outputs.web }}
      chart: ${{ steps.paths.outputs.chart }}
      images: ${{ steps.paths.outputs.images }}
      workflows: ${{ steps.paths.outputs.workflows }}
      deps: ${{ steps.paths.outputs.deps }}
      # The git tree this run checked out (on a pull request: the merge of its head into the base). `ci-ok`
      # records it, and the Deploy workflow skips its own CI run when main's tree is exactly this one.
      tree: ${{ steps.paths.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            files=""; all=true
          else
            files=$(git diff --name-only HEAD^1 HEAD); all=false
          fi
          match() { [ "$all" = true ] || printf '%s\n' "$files" | grep -Eq "$1"; }
          out() { if match "$2"; then echo "$1=true"; else echo "$1=false"; fi; }
          # Python and web tests run together or not at all: a pull-request run that attests "this tree was tested"
          # (see `ci-ok`) must have run both suites, whichever side the change was on.
          code='^(packages/|services/|scripts/|pyproject\.toml$|uv\.lock$|AGENTS\.md$|CLAUDE\.md$|\.agents/|\.claude/|\.github/|apps/|package\.json$|pnpm-|\.prettier)'
          {
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            out python "$code"
            out web "$code"
            out chart '^(deploy/|scripts/|\.github/)'
            # A pull request builds the images only when what goes into them changes shape: the Dockerfiles and
            # chart, the build script, the dependency manifests. Deploy builds and publishes them from main anyway.
            out images '^(deploy/|scripts/build-image\.sh$|pnpm-lock\.yaml$|uv\.lock$|(.*/)?(pyproject\.toml|package\.json)$|\.github/)'
            out deps '^(pnpm-lock\.yaml$|uv\.lock$|(.*/)?(pyproject\.toml|package\.json)$|\.github/)'
            out workflows '^\.github/'
          } | tee -a "$GITHUB_OUTPUT"

  python:
    name: Python (lint, types, handbook)
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'minerva-runners' }}
    timeout-minutes: 10
    env:
      # Forks have no PostgreSQL sidecar: the tests then use in-memory SQLite. (Both branches are non-empty
      # strings; `cond && '' || x` would always pick x because '' is falsy in expressions.)
      MINERVA_TEST_DATABASE_URL: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'sqlite+pysqlite:///:memory:' || 'postgresql+psycopg://postgres@127.0.0.1:5432/postgres' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: The handbook data is tracked (a .gitignore rule once hid it)
        run: git ls-files --error-unmatch packages/knowledge/src/minerva_knowledge/data/chapters.yaml
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages/engine/src packages/knowledge/src services/api/src
      - name: Verify every handbook entry at its declared level
        run: uv run python -m minerva_knowledge verify
      - name: The verification report is current (adversarial corpus, reference problems, benchmarks)
        # About ten seconds: it re-runs the adversarial corpus through the numerical verifier and compares
        # the counts with docs/benchmarks/verification-summary.json. A false accept or a false reject fails here.
        run: uv run python scripts/verification_report.py --check
      - name: Migrations apply and match the models (PostgreSQL)
        if: ${{ !startsWith(env.MINERVA_TEST_DATABASE_URL, 'sqlite') }}
        working-directory: services/api
        run: |
          export MINERVA_DATABASE_URL="$MINERVA_TEST_DATABASE_URL"
          uv run alembic upgrade head
          uv run alembic check
      - name: Agent files and skills are consistent
        run: uv run python scripts/check_agent_files.py
      - name: The API starts with production dependencies only (no dev tools)
        # The image installs `--no-dev`; a dependency declared only as a dev tool passes every test and then
        # crashes the container at import time.
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/prod-venv
        run: |
          uv sync --frozen --no-dev --no-editable --package minerva-api
          "$UV_PROJECT_ENVIRONMENT/bin/python" -c "import minerva_api.main"

  # The tests are spread over runner pods with MINERVA_TEST_SHARD=i/n (root `conftest.py`: every test belongs to
  # exactly one shard, an unset variable runs everything). `ci-ok` needs every shard, so a shard that fails or is
  # cancelled fails the run. The API tests are one more pod (`tests-api`): they drop and recreate the tables of their
  # database in every test, so each xdist worker there has a database of its own (`services/api/tests/conftest.py`).
  # `--durations` shows which tests to speed up next.
  tests:
    name: Tests (engine, handbook, scripts) ${{ matrix.shard }}/5
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'minerva-runners' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      # 3 workers: pods have no CPU limit, so this uses idle cores. `loadfile`: one worker owns each file, so a
      # benchmark module's corpus fixture runs once instead of once per worker (root `conftest.py`).
      - name: Tests, shard ${{ matrix.shard }} of 5
        env:
          MINERVA_TEST_SHARD: ${{ matrix.shard }}/5
        run: uv run pytest -n 3 --dist loadfile --durations=15 --ignore=services/api

  tests-api:
    name: Tests (API)
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'minerva-runners' }}
    timeout-minutes: 25
    env:
      # Forks have no PostgreSQL sidecar: the tests then use in-memory SQLite.
      MINERVA_TEST_DATABASE_URL: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'sqlite+pysqlite:///:memory:' || 'postgresql+psycopg://postgres@127.0.0.1:5432/postgres' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      # 3 workers, one PostgreSQL database each (`database_url_for_tests` in services/api/tests/conftest.py, created
      # on first use); `loadfile` keeps every test file on one worker. Serial, the suite took two pods and 6 to 8 minutes each.
      - name: API tests
        run: uv run pytest -n 3 --dist loadfile --durations=15 services/api

  web:
    name: Web (lint, types, tests, build)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'minerva-runners' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node first: the stock self-hosted runner image has no `node`, and pnpm's installer needs it.
      # No package-manager cache: pods are ephemeral, and setup-node v5 would otherwise look for pnpm before it is installed.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          MINERVA_API_URL: http://localhost:8100

  # Browser tests: the landing page -> app flow against the real API (deterministic scripted model, throwaway SQLite)
  # and the built site and web app (e2e/). On a GitHub-hosted runner, always: Chromium needs system libraries
  # (`playwright install --with-deps` uses sudo) that the self-hosted runner image does not have and its non-root pods
  # cannot install. The job has no secrets and runs only what the other jobs already run, so nothing is exposed.
  e2e:
    name: Browser tests (landing page to chat)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - name: Build the site and the web app
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3131
          MINERVA_API_URL: http://127.0.0.1:8131
        run: |
          pnpm --filter @minerva/site build
          pnpm --filter @minerva/web build
      - name: Browser
        run: pnpm --filter @minerva/e2e exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm --filter @minerva/e2e e2e

  # Helm chart checks and workflow lint share one job (one runner pod): each is seconds of work, and a pod per
  # job made them wait minutes for a free pod whenever two runs overlapped. Each group keeps its own path filter.
  lint:
    name: Helm chart and workflow lint
    needs: changes
    if: ${{ needs.changes.outputs.chart == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'minerva-runners' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ needs.changes.outputs.chart == 'true' }}
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Lint and render the production overlay (fake digests)
        if: ${{ needs.changes.outputs.chart == 'true' }}
        run: |
          D=sha256:$(printf 'a%.0s' {1..64})
          SET=(--set api.image.digest=$D --set web.image.digest=$D --set site.image.digest=$D)
          helm lint deploy/helm/minerva -f deploy/helm/minerva/values-production.yaml "${SET[@]}"
          helm template minerva deploy/helm/minerva -f deploy/helm/minerva/values-production.yaml "${SET[@]}" > /dev/null
      - name: Missing digests must be refused in production
        if: ${{ needs.changes.outputs.chart == 'true' }}
        run: |
          if helm template minerva deploy/helm/minerva -f deploy/helm/minerva/values-production.yaml > /dev/null 2>&1; then
            echo "::error::requireDigests did not reject a release without image digests"; exit 1
          fi
      - name: Chat model settings are rendered and validated
        if: ${{ needs.changes.outputs.chart == 'true' }}
        run: |
          D=sha256:$(printf 'a%.0s' {1..64})
          SET=(--set api.image.digest=$D --set web.image.digest=$D --set site.image.digest=$D)
          OUT=$(helm template minerva deploy/helm/minerva -f deploy/helm/minerva/values-production.yaml "${SET[@]}" \
            --set api.llm.mode=ollama --set api.llm.baseUrl=http://ollama.example:11440 --set api.llm.model=minerva)
          echo "$OUT" | grep -q 'MINERVA_LLM_MODE, value: "ollama"' || { echo "::error::MINERVA_LLM_MODE not rendered"; exit 1; }
          echo "$OUT" | grep -q 'MINERVA_LLM_BASE_URL, value: "http://ollama.example:11440"' || { echo "::error::MINERVA_LLM_BASE_URL not rendered"; exit 1; }
          if helm template minerva deploy/helm/minerva -f deploy/helm/minerva/values-production.yaml "${SET[@]}" \
            --set api.llm.mode=ollama > /dev/null 2>&1; then
            echo "::error::ollama mode without baseUrl and model must be refused"; exit 1
          fi
          if helm template minerva deploy/helm/minerva -f deploy/helm/minerva/values-production.yaml "${SET[@]}" \
            --set api.llm.mode=scripted > /dev/null 2>&1; then
            echo "::error::scripted mode must be refused in the chart"; exit 1
          fi
      - name: OpenRouter settings are rendered, reference a Secret and never carry a key value
        if: ${{ needs.changes.outputs.chart == 'true' }}
        run: |
          D=sha256:$(printf 'a%.0s' {1..64})
          SET=(--set api.image.digest=$D --set web.image.digest=$D --set site.image.digest=$D)
          T=(helm template minerva deploy/helm/minerva -f deploy/helm/minerva/values-production.yaml "${SET[@]}")
          OUT=$("${T[@]}" --set api.llm.mode=ollama --set api.llm.baseUrl=http://ollama.example:11440 \
            --set api.llm.model=minerva --set api.llm.openrouter.byok=true \
            --set api.llm.openrouter.existingSecret=minerva-openrouter --set api.llm.openrouter.keyUsers=owner@example.org)
          echo "$OUT" | grep -q 'MINERVA_LLM_MODE, value: "ollama"' || { echo "::error::Ollama default lost"; exit 1; }
          echo "$OUT" | grep -q 'MINERVA_OPENROUTER_BYOK, value: "true"' || { echo "::error::BYOK not rendered"; exit 1; }
          echo "$OUT" | grep -q 'secretKeyRef: { name: "minerva-openrouter", key: "api-key" }' || { echo "::error::key must come from the Secret"; exit 1; }
          # Without openrouter settings there is no key reference at all (existing installs are unchanged).
          if "${T[@]}" | grep -q MINERVA_OPENROUTER_API_KEY; then
            echo "::error::an API key reference was rendered without existingSecret"; exit 1
          fi
          if "${T[@]}" --set api.llm.mode=openrouter > /dev/null 2>&1; then
            echo "::error::openrouter mode without a model must be refused"; exit 1
          fi
          if "${T[@]}" --set api.llm.mode=openrouter --set api.llm.openrouter.model=a/b > /dev/null 2>&1; then
            echo "::error::openrouter mode without byok or a Secret must be refused"; exit 1
          fi
          if "${T[@]}" --set api.llm.openrouter.apiKey=sk-or-x > /dev/null 2>&1; then
            echo "::error::a literal API key in values must be refused"; exit 1
          fi
      - if: ${{ needs.changes.outputs.chart == 'true' }}
        run: |
          bash -n scripts/build-image.sh
          bash -n scripts/deploy-preflight.sh
      - if: ${{ needs.changes.outputs.workflows == 'true' }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Workflow lint (actionlint)
        if: ${{ needs.changes.outputs.workflows == 'true' }}
        run: uvx --from actionlint-py actionlint
      - name: Static analysis of workflows (offline, no token needed)
        if: ${{ needs.changes.outputs.workflows == 'true' }}
        run: uvx zizmor --offline --config .github/zizmor.yml .github/workflows

  images:
    name: Build image (not pushed) ${{ matrix.name }}
    # Only trusted code: needs the BuildKit sidecar of the self-hosted runner. One pod per image (as in Deploy).
    needs: changes
    if: needs.changes.outputs.images == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: minerva-runners
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        name: [api, web, site]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/build-image.sh "deploy/docker/${MATRIX_NAME}.Dockerfile" "ghcr.io/oscarjhernandez/minerva-${MATRIX_NAME}:ci" no-push
        env:
          MATRIX_NAME: ${{ matrix.name }}

  security:
    name: Dependency audit and secret scan
    needs: changes
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'minerva-runners' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The audits (about four minutes of installs) run when a dependency manifest or lockfile changed, and always
      # on main and in the Deploy workflow; the secret scan below runs on every change.
      - if: ${{ needs.changes.outputs.deps == 'true' }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Python dependencies (pip-audit)
        if: ${{ needs.changes.outputs.deps == 'true' }}
        run: |
          uv export --frozen --no-hashes --no-emit-workspace > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --cache-dir "$RUNNER_TEMP/pip-audit-cache"
      # Node first: the stock self-hosted runner image has no `node`, and pnpm's installer needs it.
      # No package-manager cache: pods are ephemeral, and setup-node v5 would otherwise look for pnpm before it is installed.
      - if: ${{ needs.changes.outputs.deps == 'true' }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - if: ${{ needs.changes.outputs.deps == 'true' }}
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: JavaScript dependencies (high and above)
        if: ${{ needs.changes.outputs.deps == 'true' }}
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm audit --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  # One stable name for branch protection: skipped jobs count as passing, failed or cancelled ones do not.
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, python, tests, tests-api, web, e2e, lint, images, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a required job ended as '$r'"; exit 1;; esac
          done
      # Only a pull request from a branch of this repository, and only when both test suites ran: a docs-only
      # change is not attested, so Deploy tests it. Read by `scripts/ci_tested_tree.py` (exact message required).
      - name: Record which tree this run tested
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.python == 'true' && needs.changes.outputs.web == 'true' }}
        env:
          TREE: ${{ needs.changes.outputs.tree }}
        run: |
          echo "::notice title=Tested tree::tested-tree: ${TREE}"
