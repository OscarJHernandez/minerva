name: Model evaluation

# Runs the agent benchmark (scripts/eval_models.py) against a model host, by hand. It needs a model endpoint,
# which is a repository variable (MINERVA_EVAL_BASE_URL) and never a value in this file or a report; the job is
# skipped when the variable is not set. Only workflow_dispatch starts it, so pull-request code (including forks)
# never reaches the model host. Results are written to the job summary; commit a run you want to keep with
# `make eval` locally (docs/model-evaluation.md describes the baseline and comparison commands).
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated models: name, ollama:name or openrouter:vendor/model"
        required: true
        type: string
      suite:
        description: "Case suite"
        required: true
        default: all
        type: choice
        options: [core, reliability, all]
      repeat:
        description: "Runs of every case"
        required: true
        default: "2"
        type: string
      compare_with:
        description: "Optional saved report to compare with (path in the repository, same case set)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: model-eval
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate
    if: ${{ vars.MINERVA_EVAL_BASE_URL != '' && !github.event.repository.fork }}
    runs-on: minerva-runners
    timeout-minutes: 240
    env:
      MINERVA_EVAL_BASE_URL: ${{ vars.MINERVA_EVAL_BASE_URL }}
      MODELS: ${{ inputs.models }}
      SUITE: ${{ inputs.suite }}
      REPEAT: ${{ inputs.repeat }}
      COMPARE_WITH: ${{ inputs.compare_with }}
    steps:
      - name: Keep the model host out of the logs
        run: echo "::add-mask::$MINERVA_EVAL_BASE_URL"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: The benchmark's own ground truth still agrees with the engine
        run: uv run python scripts/eval_models.py --suite "$SUITE" --check-cases
      - name: Evaluate
        run: |
          args=(--suite "$SUITE" --models "$MODELS" --repeat "$REPEAT" --seed 7 --label "run-$GITHUB_RUN_ID"
                --json-out "$RUNNER_TEMP/eval.json" --out "$RUNNER_TEMP/eval.md")
          if [ -n "$COMPARE_WITH" ]; then args+=(--compare "$COMPARE_WITH"); fi
          uv run python scripts/eval_models.py "${args[@]}"
          cat "$RUNNER_TEMP/eval.md" >> "$GITHUB_STEP_SUMMARY"
